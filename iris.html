<title>Gestão Instituto Íris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface-2: #eef0f7;
  --ink: #141c40;
  --muted: #5b6386;
  --faint: #8a91ad;
  --line: #e1e4ef;
  --navy: #1c2d6b;
  --navy-ink: #ffffff;
  --navy-soft: #e6eaf7;
  --gold: #d99a12;
  --gold-soft: #fbf1d9;
  --gold-ink: #7a5508;
  --green: #17885a;
  --green-soft: #dff3e9;
  --red: #c8403a;
  --red-soft: #fbe5e3;
  --amber: #a8700f;
  --amber-soft: #fbefd6;
  --shadow: 0 1px 2px rgba(20, 28, 64, .06), 0 6px 20px rgba(20, 28, 64, .05);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1326; --surface: #161d37; --surface-2: #1d2645; --ink: #edf0fa; --muted: #a2aac8; --faint: #7a83a6;
    --line: #283255; --navy: #8ea6ff; --navy-ink: #0e1326; --navy-soft: #222d55; --gold: #f2b93b; --gold-soft: #3a2f14; --gold-ink: #f6d58a;
    --green: #4fcf92; --green-soft: #173a2b; --red: #ff7a72; --red-soft: #45201f; --amber: #f2b93b; --amber-soft: #3a2f14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1326; --surface: #161d37; --surface-2: #1d2645; --ink: #edf0fa; --muted: #a2aac8; --faint: #7a83a6;
  --line: #283255; --navy: #8ea6ff; --navy-ink: #0e1326; --navy-soft: #222d55; --gold: #f2b93b; --gold-soft: #3a2f14; --gold-ink: #f6d58a;
  --green: #4fcf92; --green-soft: #173a2b; --red: #ff7a72; --red-soft: #45201f; --amber: #f2b93b; --amber-soft: #3a2f14;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ── Estrutura ── */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
.main { min-width: 0; padding-inline: 16px; padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.mobile-head { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .01em; }
.brand small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; border: 0; background: none; color: var(--faint);
  font-size: 10.5px; font-weight: 600; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--navy); }
.tab.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 9px; background: var(--gold); color: #1a1405; font-size: 10px; line-height: 16px; padding: 0 4px; }

@media (min-width: 960px) {
  .app { grid-template-columns: 232px 1fr; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; background: var(--surface); border-right: 1px solid var(--line); }
  .side .brand { padding: 2px 8px 22px; }
  .side .tab { flex-direction: row; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; font-weight: 600; color: var(--muted); text-align: left; }
  .side .tab svg { width: 20px; height: 20px; }
  .side .tab:hover { background: var(--surface-2); color: var(--ink); }
  .side .tab.on { background: var(--navy-soft); color: var(--navy); }
  .side .tab.on::before { top: 9px; bottom: 9px; left: -14px; right: auto; width: 4px; height: auto; border-radius: 0 3px 3px 0; }
  .side .tab .dot { position: static; margin-left: auto; }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 8px; }
  .tabs, .mobile-head { display: none; }
  .main { padding-inline: 32px; padding-block: 28px 48px; }
}

/* ── Cabeçalho de página ── */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head h1 { font-size: 28px; font-weight: 800; }
.page-head p { color: var(--muted); margin-top: 4px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
@media (min-width: 960px) { .page-head h1 { font-size: 34px; } }

/* ── Blocos ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-title h2 { font-size: 18px; font-weight: 700; }
.section-title span { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 960px) { .grid2 { grid-template-columns: 1.25fr 1fr; align-items: start; } }
.row { display: flex; align-items: center; gap: 10px; }
.wrapx { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px; }
.kpi span { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.kpi b { display: block; font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi small { display: block; font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.kpi.hl { background: var(--navy); border-color: var(--navy); }
.kpi.hl span, .kpi.hl small { color: color-mix(in srgb, var(--navy-ink) 75%, transparent); }
.kpi.hl b { color: var(--navy-ink); }

/* ── Botões / campos ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 16px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--faint); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1d1503; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--red); }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.input, .select, .textarea { width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.textarea { min-height: 80px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-soft); }
.form-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.chip i { font-style: normal; font-size: 12px; opacity: .8; }
.check { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--navy); }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 11px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ── Pílulas / avatar ── */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.navy { background: var(--navy-soft); color: var(--navy); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); }
.avatar { flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: #fff; background: var(--navy); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dotc { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* ── Listas ── */
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; }
button.item:hover { background: var(--surface-2); }
.item strong { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { font-size: 13px; color: var(--muted); }
.meter { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 6px; background: var(--navy); }
.meter.gold > i { background: var(--gold); }
.empty { text-align: center; padding: 28px 18px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h3 { font-size: 17px; color: var(--ink); }

/* ── Chamada ── */
.roll { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .roll { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .roll { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.rcard { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: center; transition: border-color .15s, background .15s; }
.rcard b { font-size: 14px; line-height: 1.25; }
.rcard .state { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.rcard.P { border-color: var(--green); background: var(--green-soft); } .rcard.P .state { color: var(--green); }
.rcard.F { border-color: var(--red); background: var(--red-soft); } .rcard.F .state { color: var(--red); }
.rcard.J { border-color: var(--amber); background: var(--amber-soft); } .rcard.J .state { color: var(--amber); }
.savebar { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(20, 28, 64, .14); }
@media (min-width: 960px) { .savebar { bottom: 16px; } }
.tally { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── Tabelas ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }

/* ── Gráfico de barras ── */
.bars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: end; height: 170px; padding-top: 10px; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-pair { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.bar-pair i { display: block; width: 42%; max-width: 22px; border-radius: 4px 4px 0 0; min-height: 2px; }
.bar-pair .in { background: var(--green); }
.bar-pair .out { background: var(--red); }
.bar-col small { font-size: 11.5px; color: var(--faint); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ── Modal / toast / banner ── */
.backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 32, .55); display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.modal-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.modal-head h2 { font-size: 21px; }
.modal-foot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; }
@media (min-width: 640px) { .backdrop { align-items: center; padding: 24px; } .modal { max-width: 620px; border-radius: 20px; padding: 22px 24px; } }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 0; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.toast { position: fixed; z-index: 80; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
@media (min-width: 960px) { .toast { bottom: 24px; left: auto; right: 24px; } }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink); font-size: 14px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.banner svg { flex: none; width: 18px; height: 18px; margin-top: 2px; }
.photo-edit { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.hide { display: none !important; }
.today { display: grid; gap: 10px; }
.lesson { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.lesson .time { font-family: var(--display); font-weight: 800; font-size: 18px; min-width: 56px; font-variant-numeric: tabular-nums; }
.steps { counter-reset: s; display: grid; gap: 10px; text-align: left; width: 100%; max-width: 420px; }
.steps div { display: flex; gap: 10px; align-items: center; }
.steps div::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-ink); font-weight: 800; font-size: 13px; }
</style>

  <main class="main"><div class="wrap" id="view"></div></main>

<script>
(() => {
  'use strict';

  // ───────────── Utilidades ─────────────
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const ym = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const parseYmd = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const today = () => ymd(new Date());
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const money = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }).replace(/ /g, ' ');
  const pct = (n) => (n == null ? '—' : `${Math.round(n * 100)}%`);
  const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const fmtDate = (s) => (s ? parseYmd(s).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '') : '—');
  const fmtLong = (s) => parseYmd(s).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  const monthLabel = (m) => { const [y, mo] = m.split('-').map(Number); return `${MESES[mo - 1]}/${y}`; };
  const addMonths = (m, k) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + k, 1)); };
  const age = (nasc) => { if (!nasc) return null; const b = parseYmd(nasc), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--; return a >= 0 && a < 120 ? a : null; };
  const initials = (name) => { const p = String(name || '?').trim().split(/\s+/); return ((p[0]?.[0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase() || '?'; };
  const hueOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const sortByName = (a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');

  const ICON = {
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    check: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2A5 5 0 0 1 21.5 19"/>',
    book: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/>',
    form: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    cash: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    down: '<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v5h1"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  };
  const icon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
  const LOGO = `<svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#1c2d6b" stroke-width="3"/><path d="M6 24a14.5 14.5 0 0 0 28 0" fill="none" stroke="#d99a12" stroke-width="3" stroke-linecap="round"/><text x="20" y="23.5" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="10.5" fill="#1c2d6b">ÍRIS</text></svg>`;

  // ───────────── Estado ─────────────
  const COLS = ['alunos', 'turmas', 'chamadas', 'inscricoes', 'lancamentos'];
  const S = {
    mode: 'loading', // loading | db | local
    data: Object.fromEntries(COLS.map((c) => [c, {}])),
    loaded: new Set(),
    slow: false,
    canWrite: true,
    canUpload: false,
    view: 'painel',
    alunosQ: '', alunosTurma: '', alunosStatus: 'ativo',
    inscStatus: 'todas',
    finMes: ym(new Date()),
    chamada: { turmaId: '', data: today(), registros: {}, key: '', dirty: false },
    confirm: null,
  };
  try { const v = localStorage.getItem('iris:view'); if (v) S.view = v; } catch {}

  let db = null, assets = null, downloads = null;

  const list = (col) => Object.entries(S.data[col]).map(([id, d]) => ({ id, ...d }));
  const get = (col, id) => (S.data[col][id] ? { id, ...S.data[col][id] } : null);
  const turmasList = () => list('turmas').sort(sortByName);
  const alunosList = () => list('alunos').sort(sortByName);
  const alunosDaTurma = (tid) => alunosList().filter((a) => a.status !== 'inativo' && (a.turmaIds || []).includes(tid));
  const fotoSrc = (a) => (a && a.fotoId ? '/_blob/' + encodeURIComponent(a.fotoId) : '');
  const avatar = (a, size = 40) => {
    const src = fotoSrc(a);
    const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px;background:hsl(${hueOf(a?.nome)} 45% 38%)`;
    return `<span class="avatar" style="${st}">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${src ? '' : esc(initials(a?.nome))}</span>`;
  };

  // ───────────── Persistência ─────────────
  async function put(col, id, body) {
    if (S.mode === 'db') await db.collection(col).doc(id).set(body);
    else { S.data[col][id] = body; schedule(); }
  }
  async function patch(col, id, body) {
    if (S.mode === 'db') await db.collection(col).doc(id).update(body);
    else { S.data[col][id] = { ...S.data[col][id], ...body }; schedule(); }
  }
  async function del(col, id) {
    if (S.mode === 'db') await db.collection(col).doc(id).delete();
    else { delete S.data[col][id]; schedule(); }
  }
  async function guard(fn, ok) {
    if (!S.canWrite) return toast('Você tem acesso só para ver. Peça acesso de edição a quem administra a página.');
    try { await fn(); if (ok) toast(ok); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' && S.mode === 'db') { S.canWrite = false; schedule(); toast('Esta conta não pode salvar alterações aqui.'); }
      else if (code === 'quota_exceeded') toast('O espaço de dados ficou cheio. Apague registros antigos para continuar.');
      else toast('Não foi possível salvar. Verifique a conexão e tente de novo.');
      return false;
    }
  }

  // ───────────── Cálculos ─────────────
  function freqStats(sinceYmd) {
    const st = {};
    for (const c of list('chamadas')) {
      if (sinceYmd && c.data < sinceYmd) continue;
      for (const [aid, v] of Object.entries(c.registros || {})) {
        const s = (st[aid] ||= { total: 0, pres: 0, faltas: 0, just: 0 });
        s.total++;
        if (v === 'P') s.pres++;
        else if (v === 'J') { s.just++; }
        else if (v === 'F') s.faltas++;
      }
    }
    for (const s of Object.values(st)) s.rate = s.total ? (s.pres + s.just) / s.total : null;
    return st;
  }
  function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }

  // ───────────── Render ─────────────
  let raf = 0;
  function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

  const NAV = [
    ['painel', 'Painel', 'home'],
    ['chamada', 'Chamada', 'check'],
    ['alunos', 'Alunos', 'users'],
    ['turmas', 'Turmas', 'book'],
    ['inscricoes', 'Inscrições', 'form'],
    ['financas', 'Finanças', 'cash'],
  ];

  function renderNav() {
    const novas = list('inscricoes').filter((i) => i.status === 'nova').length;
    const btn = (id, label, ic) => `<button class="tab${S.view === id ? ' on' : ''}" data-act="nav" data-v="${id}" aria-current="${S.view === id ? 'page' : 'false'}">${icon(ic)}<span>${label}</span>${id === 'inscricoes' && novas ? `<span class="dot num">${novas}</span>` : ''}</button>`;
    $('#tabs').innerHTML = NAV.map((n) => btn(...n)).join('');
    $('#side').innerHTML = `<div class="brand">${LOGO}<div><b>Instituto Íris</b><small>Gestão das aulas</small></div></div>${NAV.map((n) => btn(...n)).join('')}<div class="side-foot">${S.mode === 'db' ? 'Dados salvos e compartilhados com a equipe.' : S.mode === 'local' ? 'Visualização local: nada é salvo.' : 'Carregando…'}</div>`;
  }

  function header(eyebrow, title, sub, actions = '') {
    return `<div class="mobile-head brand">${LOGO}<div><b>Instituto Íris</b><small>Aulas gratuitas em Éden</small></div></div>
      <div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="row wrapx">${actions}</div>` : ''}</div>`;
  }

  function notices() {
    let out = '';
    if (S.mode === 'local') out += `<div class="banner">${icon('info')}<span><b>Visualização local com dados de exemplo.</b> Abra pelo link do Claude para salvar e compartilhar com a equipe.</span></div>`;
    if (S.mode === 'db' && S.slow && S.loaded.size < COLS.length) out += `<div class="banner">${icon('info')}<span>Os dados estão demorando para carregar. O que aparece pode estar desatualizado.</span></div>`;
    if (S.mode === 'db' && !S.canWrite) out += `<div class="banner">${icon('info')}<span>Você está vendo sem permissão de edição. Para registrar chamadas e cadastros, peça acesso de Colaborador ou Editor.</span></div>`;
    const ex = COLS.some((c) => Object.values(S.data[c]).some((d) => d.exemplo));
    if (S.mode === 'db' && ex) out += `<div class="banner">${icon('info')}<span class="grow">Há <b>dados de exemplo</b> misturados aos seus. Apague quando terminar de testar.</span>${confirmBtn('apagar-exemplos', 'Apagar exemplos', 'Confirmar: apagar exemplos', 'btn sm')}</div>`;
    return out;
  }

  function confirmBtn(key, label, confirmLabel, cls) {
    const on = S.confirm === key;
    return `<button class="${cls}${on ? ' danger' : ''}" data-act="confirm" data-key="${key}">${on ? confirmLabel : label}</button>`;
  }

  function render() {
    // Preserva foco e cursor de campos da página principal.
    const ae = document.activeElement;
    const keep = ae && ae.id && $('#view').contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
    renderNav();
    if (S.mode === 'loading' || (S.mode === 'db' && S.loaded.size < COLS.length && !S.slow)) {
      $('#view').innerHTML = header('Instituto Íris', 'Carregando dados…', 'Buscando alunos, turmas e chamadas.');
      return;
    }
    const v = { painel: vPainel, chamada: vChamada, alunos: vAlunos, turmas: vTurmas, inscricoes: vInscricoes, financas: vFinancas }[S.view] || vPainel;
    $('#view').innerHTML = v();
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch {} } }
  }

  // ───────────── Painel ─────────────
  function vPainel() {
    const alunos = alunosList();
    const ativos = alunos.filter((a) => a.status !== 'inativo');
    const mes = ym(new Date());
    const novosMes = ativos.filter((a) => (a.matriculaEm || '').startsWith(mes)).length;
    const st30 = freqStats(daysAgo(30));
    const vals = Object.values(st30).filter((s) => s.total);
    const media = vals.length ? vals.reduce((n, s) => n + s.pres + s.just, 0) / vals.reduce((n, s) => n + s.total, 0) : null;
    const novas = list('inscricoes').filter((i) => i.status === 'nova').length;
    const lanc = list('lancamentos').filter((l) => (l.data || '').startsWith(mes));
    const saldo = lanc.reduce((n, l) => n + (l.tipo === 'saida' ? -1 : 1) * (Number(l.valor) || 0), 0);
    const turmas = turmasList();

    if (!turmas.length && !alunos.length) {
      return header('Painel', 'Bem-vinda ao painel do Íris', 'Tudo das aulas em um lugar: alunos, chamada, inscrições e o dinheiro do instituto.') + notices() + `
        <div class="empty card"><h3>Comece por aqui</h3>
          <div class="steps"><div>Crie as turmas (curso, dias e horário)</div><div>Cadastre os alunos com foto</div><div>Faça a chamada em cada aula</div></div>
          <div class="row wrapx" style="justify-content:center"><button class="btn primary" data-act="turma-new">${icon('plus')}Criar primeira turma</button>
          ${S.mode === 'db' && S.canWrite ? `<button class="btn" data-act="seed">Carregar exemplo para testar</button>` : ''}</div>
        </div>`;
    }

    const dow = new Date().getDay();
    const hoje = turmas.filter((t) => (t.dias || []).includes(dow)).sort((a, b) => String(a.horario).localeCompare(String(b.horario)));
    const stAll = freqStats();
    const baixa = ativos.map((a) => ({ a, s: stAll[a.id] })).filter((x) => x.s && x.s.total >= 4 && x.s.rate < 0.75).sort((x, y) => x.s.rate - y.s.rate).slice(0, 6);
    const recentes = list('inscricoes').sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm))).slice(0, 4);

    return header(fmtLong(today()), 'Painel', '') + notices() + `
      <div class="kpis">
        <div class="card kpi hl"><span>Alunos ativos</span><b>${ativos.length}</b><small>${novosMes} ${novosMes === 1 ? 'matrícula' : 'matrículas'} em ${MESES[new Date().getMonth()]}</small></div>
        <div class="card kpi"><span>Frequência média</span><b style="color:${media != null && media < 0.75 ? 'var(--red)' : 'inherit'}">${pct(media)}</b><small>últimos 30 dias</small></div>
        <div class="card kpi"><span>Inscrições novas</span><b>${novas}</b><small>aguardando contato</small></div>
        <div class="card kpi"><span>Saldo do mês</span><b style="font-size:24px;color:${saldo < 0 ? 'var(--red)' : 'inherit'}">${money(saldo)}</b><small>entradas menos saídas</small></div>
      </div>
      <div class="grid2">
        <section>
          <div class="section-title"><h2>Aulas de hoje</h2><span>${DIAS[dow]}</span></div>
          ${hoje.length ? `<div class="today">${hoje.map((t) => {
            const c = get('chamadas', `${t.id}_${today()}`);
            const n = alunosDaTurma(t.id).length;
            const pres = c ? Object.values(c.registros || {}).filter((v) => v === 'P').length : 0;
            return `<div class="lesson"><span class="time">${esc(t.horario || '--:--')}</span><span class="dotc" style="background:${esc(t.cor || '#1c2d6b')}"></span>
              <div class="grow"><b>${esc(t.nome)}</b><div class="small muted">${n} alunos${t.professor ? ' · ' + esc(t.professor) : ''}</div></div>
              ${c ? `<span class="pill green num">${pres}/${n} presentes</span>` : `<button class="btn sm primary" data-act="go-chamada" data-t="${t.id}">Fazer chamada</button>`}</div>`;
          }).join('')}</div>` : `<div class="empty">Nenhuma turma tem aula hoje.</div>`}

          <div class="section-title" style="margin-top:22px"><h2>Alunos por turma</h2><span>vagas ocupadas</span></div>
          <div class="card pad stack">${turmas.map((t) => {
            const n = alunosDaTurma(t.id).length, cap = Number(t.capacidade) || 0;
            const r = cap ? Math.min(1, n / cap) : 0;
            return `<div><div class="row small"><span class="dotc" style="background:${esc(t.cor || '#1c2d6b')}"></span><b class="grow">${esc(t.nome)}</b><span class="num muted">${n}${cap ? ' / ' + cap : ''}</span></div>
              <div class="meter${r >= 1 ? ' gold' : ''}" style="margin-top:6px"><i style="width:${cap ? Math.round(r * 100) : 0}%"></i></div></div>`;
          }).join('') || '<span class="muted">Nenhuma turma.</span>'}</div>
        </section>
        <section class="stack" style="gap:18px">
          <div>
            <div class="section-title"><h2>Atenção à frequência</h2><span>abaixo de 75%</span></div>
            <div class="card list">${baixa.length ? baixa.map(({ a, s }) => `<button class="item" data-act="aluno-open" data-id="${a.id}">${avatar(a, 36)}<div class="grow"><strong>${esc(a.nome)}</strong><span class="sub num">${plural(s.faltas, 'falta', 'faltas')} em ${s.total} aulas</span></div><span class="pill red num">${pct(s.rate)}</span></button>`).join('') : `<div class="pad muted small">Nenhum aluno abaixo de 75% (com 4 aulas ou mais registradas).</div>`}</div>
          </div>
          <div>
            <div class="section-title"><h2>Inscrições recentes</h2><button class="btn sm ghost" data-act="nav" data-v="inscricoes">Ver todas</button></div>
            <div class="card list">${recentes.length ? recentes.map((i) => `<div class="item"><div class="grow"><strong>${esc(i.nome)}</strong><span class="sub">${esc(get('turmas', i.turmaId)?.nome || 'Sem turma')} · ${fmtDate((i.criadoEm || '').slice(0, 10))}</span></div>${statusPill(i.status)}</div>`).join('') : `<div class="pad muted small">Nenhuma inscrição ainda.</div>`}</div>
          </div>
        </section>
      </div>`;
  }

  // ───────────── Chamada ─────────────
  function syncChamadaDraft() {
    const ch = S.chamada;
    const turmas = turmasList();
    if (!ch.turmaId || !get('turmas', ch.turmaId)) {
      const dow = parseYmd(ch.data).getDay();
      ch.turmaId = (turmas.find((t) => (t.dias || []).includes(dow)) || turmas[0] || {}).id || '';
    }
    const key = `${ch.turmaId}_${ch.data}`;
    if (ch.key !== key) {
      ch.key = key;
      ch.registros = { ...(get('chamadas', key)?.registros || {}) };
      ch.dirty = false;
    } else if (!ch.dirty) {
      ch.registros = { ...(get('chamadas', key)?.registros || {}) };
    }
  }

  function vChamada() {
    syncChamadaDraft();
    const ch = S.chamada;
    const turmas = turmasList();
    if (!turmas.length) return header('Frequência', 'Chamada', '') + notices() + `<div class="empty card"><h3>Nenhuma turma ainda</h3><p>Crie uma turma e cadastre os alunos para fazer a chamada.</p><button class="btn primary" data-act="turma-new">${icon('plus')}Criar turma</button></div>`;
    const t = get('turmas', ch.turmaId);
    const alunos = alunosDaTurma(ch.turmaId);
    const saved = get('chamadas', ch.key);
    const count = { P: 0, F: 0, J: 0 };
    for (const a of alunos) if (ch.registros[a.id]) count[ch.registros[a.id]]++;
    const sem = alunos.length - count.P - count.F - count.J;
    const diaOk = (t.dias || []).includes(parseYmd(ch.data).getDay());
    const hist = list('chamadas').filter((c) => c.turmaId === ch.turmaId).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 8);
    const LBL = { P: 'Presente', F: 'Falta', J: 'Justificada' };

    return header('Frequência', 'Chamada', 'Toque no aluno para marcar: presente, falta ou falta justificada.') + notices() + `
      <div class="card pad stack">
        <div class="chips" role="tablist" aria-label="Turma">${turmas.map((x) => `<button class="chip${x.id === ch.turmaId ? ' on' : ''}" data-act="ch-turma" data-t="${x.id}"><span class="dotc" style="background:${esc(x.cor || '#1c2d6b')}"></span>${esc(x.nome)}</button>`).join('')}</div>
        <div class="row wrapx">
          <label class="field" style="max-width:200px"><span>Data da aula</span><input class="input" type="date" id="ch-data" value="${esc(ch.data)}" max="${today()}"></label>
          <div class="grow small muted" style="padding-top:18px">${esc(t.nome)} · ${(t.dias || []).map((d) => DIAS[d]).join(', ') || 'sem dias definidos'} ${esc(t.horario || '')}${diaOk ? '' : ' · <b style="color:var(--amber)">não é dia desta turma</b>'}</div>
        </div>
      </div>
      ${alunos.length ? `
      <div class="stack" style="gap:8px">
        <div class="tally"><span class="pill green num">${plural(count.P, 'presente', 'presentes')}</span><span class="pill red num">${plural(count.F, 'falta', 'faltas')}</span><span class="pill amber num">${plural(count.J, 'justificada', 'justificadas')}</span>${sem ? `<span class="pill num">${sem} sem marcação</span>` : ''}</div>
        <div class="row"><button class="btn sm" data-act="ch-all">Todos presentes</button><button class="btn sm ghost" data-act="ch-clear">Limpar</button></div>
      </div>
      <div class="roll">${alunos.map((a) => { const v = ch.registros[a.id] || ''; return `<button class="rcard ${v}" data-act="ch-mark" data-id="${a.id}" aria-label="${esc(a.nome)}: ${v ? LBL[v] : 'sem marcação'}">${avatar(a, 64)}<b>${esc(a.nome)}</b><span class="state">${v ? LBL[v] : 'Toque para marcar'}</span></button>`; }).join('')}</div>
      <div class="savebar"><div class="grow small">${ch.dirty ? '<b>Alterações não salvas</b>' : saved ? `<span class="muted">Chamada salva${saved.atualizadoEm ? ' · ' + new Date(saved.atualizadoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : ''}</span>` : '<span class="muted">Ainda não salva</span>'}</div>
        <button class="btn gold" data-act="ch-save" ${ch.dirty && S.canWrite ? '' : 'disabled'}>Salvar chamada</button></div>`
      : `<div class="empty"><h3>Nenhum aluno nesta turma</h3><p>Cadastre alunos e marque esta turma no cadastro.</p><button class="btn primary" data-act="aluno-new" data-t="${t.id}">${icon('plus')}Cadastrar aluno</button></div>`}
      <section><div class="section-title"><h2>Últimas chamadas desta turma</h2></div>
        <div class="card list">${hist.length ? hist.map((c) => { const vals = Object.values(c.registros || {}); const p = vals.filter((v) => v !== 'F').length; return `<button class="item" data-act="ch-open" data-d="${c.data}"><div class="grow"><strong>${fmtLong(c.data)}</strong><span class="sub num">${plural(vals.filter((v) => v === 'P').length, 'presente', 'presentes')} · ${plural(vals.filter((v) => v === 'F').length, 'falta', 'faltas')} · ${plural(vals.filter((v) => v === 'J').length, 'justificada', 'justificadas')}</span></div><span class="pill ${vals.length && p / vals.length < 0.75 ? 'red' : 'green'} num">${vals.length ? pct(p / vals.length) : '—'}</span></button>`; }).join('') : '<div class="pad small muted">Nenhuma chamada registrada ainda.</div>'}</div>
      </section>`;
  }

  // ───────────── Alunos ─────────────
  function vAlunos() {
    const st = freqStats();
    const q = S.alunosQ.trim().toLowerCase();
    const rows = alunosList().filter((a) =>
      (!q || String(a.nome).toLowerCase().includes(q) || String(a.responsavel || '').toLowerCase().includes(q)) &&
      (!S.alunosTurma || (a.turmaIds || []).includes(S.alunosTurma)) &&
      (S.alunosStatus === 'todos' || (S.alunosStatus === 'ativo' ? a.status !== 'inativo' : a.status === 'inativo')));
    const turmas = turmasList();
    return header('Cadastro', 'Alunos', `${alunosList().filter((a) => a.status !== 'inativo').length} ativos`, `<button class="btn" data-act="csv-alunos">${icon('down')}Planilha</button><button class="btn primary" data-act="aluno-new">${icon('plus')}Novo aluno</button>`) + notices() + `
      <div class="card pad form-grid">
        <label class="field full"><span>Buscar</span><input class="input" id="alunos-q" type="search" placeholder="Nome do aluno ou responsável" value="${esc(S.alunosQ)}"></label>
        <label class="field"><span>Turma</span><select class="select" id="alunos-turma"><option value="">Todas</option>${turmas.map((t) => `<option value="${t.id}"${S.alunosTurma === t.id ? ' selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></label>
        <label class="field"><span>Situação</span><select class="select" id="alunos-status">${[['ativo', 'Ativos'], ['inativo', 'Inativos'], ['todos', 'Todos']].map(([v, l]) => `<option value="${v}"${S.alunosStatus === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      ${rows.length ? `<div class="card list">${rows.map((a) => {
        const s = st[a.id]; const idade = age(a.nascimento);
        const ts = (a.turmaIds || []).map((id) => get('turmas', id)).filter(Boolean);
        return `<button class="item" data-act="aluno-open" data-id="${a.id}">${avatar(a, 46)}<div class="grow"><strong>${esc(a.nome)}</strong><span class="sub">${idade != null ? idade + ' anos · ' : ''}${ts.map((t) => esc(t.nome)).join(', ') || 'Sem turma'}</span></div>
          ${a.status === 'inativo' ? '<span class="pill">Inativo</span>' : s && s.total ? `<span class="pill ${s.rate < 0.75 ? 'red' : 'green'} num" title="Frequência">${pct(s.rate)}</span>` : '<span class="pill">sem aulas</span>'}</button>`;
      }).join('')}</div>` : `<div class="empty"><h3>${alunosList().length ? 'Nenhum aluno com esses filtros' : 'Nenhum aluno cadastrado'}</h3>${alunosList().length ? '' : `<button class="btn primary" data-act="aluno-new">${icon('plus')}Cadastrar aluno</button>`}</div>`}`;
  }

  // ───────────── Turmas ─────────────
  function vTurmas() {
    const st = freqStats(daysAgo(30));
    const turmas = turmasList();
    return header('Cursos', 'Turmas', 'Dias, horários, professores e vagas.', `<button class="btn primary" data-act="turma-new">${icon('plus')}Nova turma</button>`) + notices() + (turmas.length ? `
      <div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))">${turmas.map((t) => {
        const al = alunosDaTurma(t.id); const cap = Number(t.capacidade) || 0;
        let pres = 0, tot = 0; for (const a of al) { const s = st[a.id]; if (s) { pres += s.pres + s.just; tot += s.total; } }
        return `<button class="card pad stack" style="text-align:left;border-top:4px solid ${esc(t.cor || '#1c2d6b')}" data-act="turma-open" data-id="${t.id}">
          <h3 style="font-size:19px">${esc(t.nome)}</h3>
          <div class="small muted">${(t.dias || []).map((d) => DIAS[d]).join(', ') || 'Sem dias'} · ${esc(t.horario || '--:--')}${t.professor ? ' · ' + esc(t.professor) : ''}</div>
          <div class="row small"><span class="grow">Alunos</span><b class="num">${al.length}${cap ? ' / ' + cap : ''}</b></div>
          <div class="meter${cap && al.length >= cap ? ' gold' : ''}"><i style="width:${cap ? Math.min(100, Math.round((al.length / cap) * 100)) : 0}%"></i></div>
          <div class="row small"><span class="grow">Frequência (30 dias)</span><b class="num" style="color:${tot && pres / tot < 0.75 ? 'var(--red)' : 'inherit'}">${tot ? pct(pres / tot) : '—'}</b></div>
        </button>`;
      }).join('')}</div>` : `<div class="empty"><h3>Nenhuma turma</h3><button class="btn primary" data-act="turma-new">${icon('plus')}Criar turma</button></div>`);
  }

  // ───────────── Inscrições ─────────────
  const INSC = { nova: ['Nova', 'gold'], contato: ['Em contato', 'navy'], matriculada: ['Matriculada', 'green'], desistiu: ['Desistiu', ''] };
  const statusPill = (s) => `<span class="pill ${INSC[s]?.[1] || ''}">${INSC[s]?.[0] || esc(s)}</span>`;
  function vInscricoes() {
    const all = list('inscricoes').sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
    const cnt = (s) => all.filter((i) => i.status === s).length;
    const rows = S.inscStatus === 'todas' ? all : all.filter((i) => i.status === S.inscStatus);
    return header('Novos alunos', 'Inscrições', 'Quem quer entrar nas aulas. Ao matricular, o cadastro do aluno é criado.', `<button class="btn" data-act="csv-insc">${icon('down')}Planilha</button><button class="btn primary" data-act="insc-new">${icon('plus')}Nova inscrição</button>`) + notices() + `
      <div class="chips">${[['todas', 'Todas', all.length], ...Object.entries(INSC).map(([k, [l]]) => [k, l, cnt(k)])].map(([k, l, n]) => `<button class="chip${S.inscStatus === k ? ' on' : ''}" data-act="insc-filter" data-s="${k}">${l} <i class="num">${n}</i></button>`).join('')}</div>
      ${rows.length ? `<div class="card list">${rows.map((i) => { const idade = age(i.nascimento); return `
        <div class="item wrapx" style="align-items:flex-start">
          <div class="grow" style="min-width:200px"><strong>${esc(i.nome)}</strong>
            <span class="sub">${idade != null ? idade + ' anos · ' : ''}${esc(get('turmas', i.turmaId)?.nome || 'Turma a definir')} · inscrito em ${fmtDate((i.criadoEm || '').slice(0, 10))}</span>
            <div class="sub">${i.responsavel ? 'Resp.: ' + esc(i.responsavel) + ' · ' : ''}<span style="user-select:all">${esc(i.telefone || 'sem telefone')}</span>${i.origem ? ' · via ' + esc(i.origem) : ''}</div></div>
          <div class="row wrapx">${statusPill(i.status)}
            <select class="select" style="width:auto;min-height:34px;font-size:13.5px;padding:4px 30px 4px 10px" data-insc-status="${i.id}" aria-label="Situação">${Object.entries(INSC).map(([k, [l]]) => `<option value="${k}"${i.status === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
            ${i.status !== 'matriculada' && i.status !== 'desistiu' ? `<button class="btn sm primary" data-act="insc-matricular" data-id="${i.id}">Matricular</button>` : ''}
            <button class="btn sm ghost" data-act="insc-open" data-id="${i.id}">Editar</button></div>
        </div>`; }).join('')}</div>` : `<div class="empty"><h3>Nenhuma inscrição ${S.inscStatus !== 'todas' ? 'nesta situação' : 'ainda'}</h3></div>`}`;
  }

  // ───────────── Finanças ─────────────
  const CAT_IN = ['Doação', 'Patrocínio', 'Edital / projeto', 'Evento / rifa', 'Outros'];
  const CAT_OUT = ['Material didático', 'Lanche', 'Transporte', 'Aluguel / contas', 'Manutenção', 'Outros'];
  function vFinancas() {
    const m = S.finMes;
    const all = list('lancamentos');
    const doMes = all.filter((l) => (l.data || '').startsWith(m)).sort((a, b) => b.data.localeCompare(a.data));
    const sum = (arr, t) => arr.filter((l) => l.tipo === t).reduce((n, l) => n + (Number(l.valor) || 0), 0);
    const ent = sum(doMes, 'entrada'), sai = sum(doMes, 'saida');
    const acum = all.filter((l) => (l.data || '').slice(0, 7) <= m).reduce((n, l) => n + (l.tipo === 'saida' ? -1 : 1) * (Number(l.valor) || 0), 0);
    const meses = Array.from({ length: 6 }, (_, k) => addMonths(m, k - 5));
    const series = meses.map((mm) => { const a = all.filter((l) => (l.data || '').startsWith(mm)); return { mm, e: sum(a, 'entrada'), s: sum(a, 'saida') }; });
    const max = Math.max(1, ...series.flatMap((x) => [x.e, x.s]));
    const cats = {};
    for (const l of doMes) { const k = `${l.tipo}|${l.categoria || 'Outros'}`; cats[k] = (cats[k] || 0) + (Number(l.valor) || 0); }
    const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);

    return header('Dinheiro do instituto', 'Finanças', 'Doações, apoios e despesas das aulas gratuitas.', `<button class="btn" data-act="csv-fin">${icon('down')}Planilha</button><button class="btn primary" data-act="lanc-new">${icon('plus')}Novo lançamento</button>`) + notices() + `
      <div class="row"><button class="icon-btn" data-act="fin-prev" aria-label="Mês anterior">${icon('left')}</button><h2 style="font-size:20px;min-width:110px;text-align:center">${monthLabel(m)}</h2><button class="icon-btn" data-act="fin-next" aria-label="Próximo mês">${icon('right')}</button></div>
      <div class="kpis">
        <div class="card kpi"><span>Entradas</span><b style="font-size:24px;color:var(--green)">${money(ent)}</b><small>${doMes.filter((l) => l.tipo === 'entrada').length} lançamentos</small></div>
        <div class="card kpi"><span>Saídas</span><b style="font-size:24px;color:var(--red)">${money(sai)}</b><small>${doMes.filter((l) => l.tipo === 'saida').length} lançamentos</small></div>
        <div class="card kpi"><span>Saldo do mês</span><b style="font-size:24px">${money(ent - sai)}</b><small>entradas − saídas</small></div>
        <div class="card kpi hl"><span>Caixa acumulado</span><b style="font-size:24px">${money(acum)}</b><small>até ${monthLabel(m)}</small></div>
      </div>
      <div class="grid2">
        <section class="card pad">
          <div class="section-title"><h2>Últimos 6 meses</h2><div class="legend"><span><i style="background:var(--green)"></i>Entradas</span><span><i style="background:var(--red)"></i>Saídas</span></div></div>
          <div class="bars">${series.map((x) => `<div class="bar-col" title="${monthLabel(x.mm)}: entradas ${money(x.e)}, saídas ${money(x.s)}"><div class="bar-pair"><i class="in" style="height:${(x.e / max) * 100}%"></i><i class="out" style="height:${(x.s / max) * 100}%"></i></div><small${x.mm === m ? ' style="color:var(--ink);font-weight:700"' : ''}>${MESES[Number(x.mm.slice(5)) - 1]}</small></div>`).join('')}</div>
        </section>
        <section class="card pad">
          <div class="section-title"><h2>Por categoria</h2><span>${monthLabel(m)}</span></div>
          ${catRows.length ? `<div class="stack">${catRows.map(([k, v]) => { const [t, c] = k.split('|'); return `<div class="row small"><span class="dotc" style="background:var(--${t === 'saida' ? 'red' : 'green'})"></span><span class="grow">${esc(c)}</span><b class="num">${money(v)}</b></div>`; }).join('')}</div>` : '<p class="small muted">Sem lançamentos neste mês.</p>'}
        </section>
      </div>
      <section><div class="section-title"><h2>Lançamentos de ${monthLabel(m)}</h2></div>
        ${doMes.length ? `<div class="card table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th></th></tr></thead><tbody>${doMes.map((l) => `<tr><td class="num">${fmtDate(l.data)}</td><td>${esc(l.descricao)}</td><td class="muted">${esc(l.categoria || '')}</td><td class="r num" style="font-weight:700;color:var(--${l.tipo === 'saida' ? 'red' : 'green'})">${l.tipo === 'saida' ? '−' : '+'} ${money(l.valor)}</td><td class="r"><button class="btn sm ghost" data-act="lanc-open" data-id="${l.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Nenhum lançamento neste mês.</div>`}
      </section>`;
  }

  // ───────────── Modais ─────────────
  function openModal(title, body, foot, onMount) {
    $('#modal-root').innerHTML = `<div class="backdrop" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2 class="grow">${title}</h2><button class="icon-btn" data-act="modal-close" aria-label="Fechar">${icon('x')}</button></div>${body}<div class="modal-foot">${foot}</div></div></div>`;
    onMount && onMount($('#modal-root .modal'));
    const first = $('#modal-root .input');
    if (first && window.matchMedia('(min-width: 640px)').matches) first.focus();
  }
  const closeModal = () => { $('#modal-root').innerHTML = ''; S.confirm = null; };
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  function alunoModal(id, presetTurma) {
    const a = id ? get('alunos', id) : { nome: '', turmaIds: presetTurma ? [presetTurma] : [], status: 'ativo', matriculaEm: today() };
    const s = id ? freqStats()[id] : null;
    const turmas = turmasList();
    const photo = id ? `<div class="photo-edit">${avatar(a, 84)}<div class="stack" style="gap:6px">${S.canUpload ? `<label class="btn sm">${icon('cam')}${a.fotoId ? 'Trocar foto' : 'Adicionar foto'}<input type="file" accept="image/*" class="hide" data-photo="${id}"></label>` : `<span class="small muted">Para enviar fotos é preciso acesso de Editor.</span>`}${s && s.total ? `<span class="small muted num">Frequência ${pct(s.rate)} · ${s.pres} presenças, ${s.faltas} faltas, ${s.just} justificadas</span>` : ''}</div></div>` : `<p class="small muted" style="margin-bottom:12px">Depois de salvar, abra o aluno de novo para adicionar a foto.</p>`;
    openModal(id ? esc(a.nome) : 'Novo aluno', `${photo}
      <div class="form-grid">
        <label class="field full"><span>Nome completo</span><input class="input" id="f-nome" value="${esc(a.nome)}" autocomplete="off"></label>
        <label class="field"><span>Data de nascimento</span><input class="input" type="date" id="f-nasc" value="${esc(a.nascimento || '')}"></label>
        <label class="field"><span>Telefone</span><input class="input" id="f-tel" inputmode="tel" value="${esc(a.telefone || '')}" placeholder="(21) 9…"></label>
        <label class="field full"><span>Responsável (se menor de idade)</span><input class="input" id="f-resp" value="${esc(a.responsavel || '')}"></label>
        <div class="field full"><span>Turmas</span><div class="form-grid">${turmas.map((t) => `<label class="check"><input type="checkbox" name="f-turma" value="${t.id}"${(a.turmaIds || []).includes(t.id) ? ' checked' : ''}>${esc(t.nome)}</label>`).join('') || '<span class="small muted">Crie uma turma primeiro.</span>'}</div></div>
        <label class="field"><span>Matriculado em</span><input class="input" type="date" id="f-mat" value="${esc(a.matriculaEm || today())}"></label>
        <label class="field"><span>Situação</span><select class="select" id="f-status"><option value="ativo"${a.status !== 'inativo' ? ' selected' : ''}>Ativo</option><option value="inativo"${a.status === 'inativo' ? ' selected' : ''}>Inativo (saiu)</option></select></label>
        <label class="field full"><span>Observações</span><textarea class="textarea" id="f-obs">${esc(a.obs || '')}</textarea></label>
      </div>`,
      `${id ? confirmBtn('del-aluno', 'Excluir', 'Confirmar exclusão', 'btn ghost') : ''}<span class="grow"></span><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="aluno-save" data-id="${id || ''}">Salvar</button>`);
    $('#modal-root .modal').dataset.ctx = JSON.stringify({ type: 'aluno', id });
  }

  function turmaModal(id) {
    const t = id ? get('turmas', id) : { nome: '', dias: [], horario: '', capacidade: 20, cor: '#1c2d6b' };
    const CORES = ['#1c2d6b', '#d99a12', '#17885a', '#c8403a', '#7a4fc4', '#1d8bb5'];
    openModal(id ? 'Editar turma' : 'Nova turma', `<div class="form-grid">
      <label class="field full"><span>Nome da turma / curso</span><input class="input" id="t-nome" value="${esc(t.nome)}" placeholder="Ex.: Informática básica — tarde"></label>
      <div class="field full"><span>Dias de aula</span><div class="chips">${DIAS.map((d, i) => `<label class="check" style="padding:6px 10px"><input type="checkbox" name="t-dia" value="${i}"${(t.dias || []).includes(i) ? ' checked' : ''}>${d}</label>`).join('')}</div></div>
      <label class="field"><span>Horário</span><input class="input" type="time" id="t-hora" value="${esc(t.horario || '')}"></label>
      <label class="field"><span>Vagas</span><input class="input" type="number" min="0" id="t-cap" value="${esc(t.capacidade ?? '')}"></label>
      <label class="field full"><span>Professor(a)</span><input class="input" id="t-prof" value="${esc(t.professor || '')}"></label>
      <div class="field full"><span>Cor</span><div class="chips">${CORES.map((c) => `<label class="check" style="padding:6px 10px"><input type="radio" name="t-cor" value="${c}"${(t.cor || '#1c2d6b') === c ? ' checked' : ''}><span class="dotc" style="background:${c};width:16px;height:16px"></span></label>`).join('')}</div></div>
    </div>`, `${id ? confirmBtn('del-turma', 'Excluir', 'Confirmar exclusão', 'btn ghost') : ''}<span class="grow"></span><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="turma-save" data-id="${id || ''}">Salvar</button>`);
    $('#modal-root .modal').dataset.ctx = JSON.stringify({ type: 'turma', id });
  }

  function inscModal(id) {
    const i = id ? get('inscricoes', id) : { nome: '', status: 'nova', origem: 'Instagram' };
    openModal(id ? 'Editar inscrição' : 'Nova inscrição', `<div class="form-grid">
      <label class="field full"><span>Nome</span><input class="input" id="i-nome" value="${esc(i.nome)}"></label>
      <label class="field"><span>Data de nascimento</span><input class="input" type="date" id="i-nasc" value="${esc(i.nascimento || '')}"></label>
      <label class="field"><span>Telefone / WhatsApp</span><input class="input" id="i-tel" inputmode="tel" value="${esc(i.telefone || '')}"></label>
      <label class="field full"><span>Responsável</span><input class="input" id="i-resp" value="${esc(i.responsavel || '')}"></label>
      <label class="field"><span>Turma de interesse</span><select class="select" id="i-turma"><option value="">A definir</option>${turmasList().map((t) => `<option value="${t.id}"${i.turmaId === t.id ? ' selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></label>
      <label class="field"><span>Como conheceu</span><select class="select" id="i-origem">${['Instagram', 'Indicação', 'WhatsApp', 'Na rua / evento', 'Outro'].map((o) => `<option${i.origem === o ? ' selected' : ''}>${o}</option>`).join('')}</select></label>
      <label class="field full"><span>Observações</span><textarea class="textarea" id="i-obs">${esc(i.obs || '')}</textarea></label>
    </div>`, `${id ? confirmBtn('del-insc', 'Excluir', 'Confirmar exclusão', 'btn ghost') : ''}<span class="grow"></span><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="insc-save" data-id="${id || ''}">Salvar</button>`);
    $('#modal-root .modal').dataset.ctx = JSON.stringify({ type: 'insc', id });
  }

  function lancModal(id) {
    const l = id ? get('lancamentos', id) : { tipo: 'entrada', data: S.finMes === ym(new Date()) ? today() : S.finMes + '-01', categoria: 'Doação' };
    const cats = (t) => (t === 'saida' ? CAT_OUT : CAT_IN);
    openModal(id ? 'Editar lançamento' : 'Novo lançamento', `<div class="form-grid">
      <div class="field full"><span>Tipo</span><div class="seg" id="l-tipo">${[['entrada', 'Entrada'], ['saida', 'Saída']].map(([k, n]) => `<button type="button" class="${l.tipo === k ? 'on' : ''}" data-act="l-tipo" data-v="${k}">${n}</button>`).join('')}</div></div>
      <label class="field full"><span>Descrição</span><input class="input" id="l-desc" value="${esc(l.descricao || '')}" placeholder="Ex.: Doação para material escolar"></label>
      <label class="field"><span>Valor (R$)</span><input class="input num" id="l-valor" inputmode="decimal" value="${l.valor != null ? String(l.valor).replace('.', ',') : ''}" placeholder="0,00"></label>
      <label class="field"><span>Data</span><input class="input" type="date" id="l-data" value="${esc(l.data || today())}"></label>
      <label class="field full"><span>Categoria</span><select class="select" id="l-cat">${cats(l.tipo).map((c) => `<option${l.categoria === c ? ' selected' : ''}>${c}</option>`).join('')}</select></label>
    </div>`, `${id ? confirmBtn('del-lanc', 'Excluir', 'Confirmar exclusão', 'btn ghost') : ''}<span class="grow"></span><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="lanc-save" data-id="${id || ''}">Salvar</button>`);
    const m = $('#modal-root .modal'); m.dataset.ctx = JSON.stringify({ type: 'lanc', id }); m.dataset.tipo = l.tipo;
  }

  // Re-renderiza só o rodapé do modal (botões de confirmação).
  function refreshModalFoot() {
    const m = $('#modal-root .modal'); if (!m) return;
    m.querySelectorAll('[data-act="confirm"]').forEach((b) => { const on = S.confirm === b.dataset.key; b.classList.toggle('danger', on); b.textContent = on ? 'Confirmar exclusão' : 'Excluir'; });
  }

  // ───────────── Ações ─────────────
  function toast(msg) {
    $('#toast-root').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toast.t); toast.t = setTimeout(() => ($('#toast-root').innerHTML = ''), 3200);
  }

  async function saveAluno(id) {
    const nome = val('f-nome');
    if (!nome) return toast('Informe o nome do aluno.');
    const turmaIds = [...document.querySelectorAll('input[name="f-turma"]:checked')].map((x) => x.value);
    const base = id ? { ...S.data.alunos[id] } : { criadoEm: new Date().toISOString() };
    const body = { ...base, nome, nascimento: val('f-nasc'), telefone: val('f-tel'), responsavel: val('f-resp'), turmaIds, matriculaEm: val('f-mat'), status: val('f-status') || 'ativo', obs: val('f-obs') };
    const newId = id || uid();
    if (await guard(() => put('alunos', newId, body), id ? 'Aluno atualizado.' : 'Aluno cadastrado.')) { closeModal(); if (!id) alunoModal(newId); }
  }

  async function uploadPhoto(id, file) {
    if (!assets || !file) return;
    toast('Enviando foto…');
    try {
      const blob = await resizeImage(file, 480);
      const res = await assets.upload(blob);
      const old = S.data.alunos[id]?.fotoId;
      if (await guard(() => patch('alunos', id, { fotoId: res.id }), 'Foto salva.')) {
        if (old) assets.delete(old).catch(() => {});
        if ($('#modal-root .modal')) alunoModal(id);
      }
    } catch (e) { toast(e && e.code === 'not_granted' ? 'Sem permissão para enviar fotos.' : 'Não foi possível enviar a foto.'); }
  }

  function resizeImage(file, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('blob'))), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

  async function saveTurma(id) {
    const nome = val('t-nome');
    if (!nome) return toast('Informe o nome da turma.');
    const dias = [...document.querySelectorAll('input[name="t-dia"]:checked')].map((x) => Number(x.value));
    const cor = document.querySelector('input[name="t-cor"]:checked')?.value || '#1c2d6b';
    const body = { ...(id ? S.data.turmas[id] : { criadoEm: new Date().toISOString() }), nome, dias, horario: val('t-hora'), capacidade: Number(val('t-cap')) || 0, professor: val('t-prof'), cor };
    if (await guard(() => put('turmas', id || uid(), body), id ? 'Turma atualizada.' : 'Turma criada.')) closeModal();
  }

  async function saveInsc(id) {
    const nome = val('i-nome');
    if (!nome) return toast('Informe o nome.');
    const body = { ...(id ? S.data.inscricoes[id] : { status: 'nova', criadoEm: new Date().toISOString() }), nome, nascimento: val('i-nasc'), telefone: val('i-tel'), responsavel: val('i-resp'), turmaId: val('i-turma'), origem: val('i-origem'), obs: val('i-obs') };
    if (await guard(() => put('inscricoes', id || uid(), body), id ? 'Inscrição atualizada.' : 'Inscrição registrada.')) closeModal();
  }

  async function matricular(id) {
    const i = get('inscricoes', id); if (!i) return;
    const alunoId = uid();
    const aluno = { nome: i.nome, nascimento: i.nascimento || '', telefone: i.telefone || '', responsavel: i.responsavel || '', turmaIds: i.turmaId ? [i.turmaId] : [], matriculaEm: today(), status: 'ativo', obs: i.obs || '', criadoEm: new Date().toISOString(), inscricaoId: id };
    const ok = await guard(async () => { await put('alunos', alunoId, aluno); await patch('inscricoes', id, { status: 'matriculada', alunoId }); }, `${i.nome} matriculado(a).`);
    if (ok) alunoModal(alunoId);
  }

  async function saveLanc(id) {
    const m = $('#modal-root .modal');
    const valor = Number(val('l-valor').replace(/\./g, '').replace(',', '.'));
    if (!val('l-desc')) return toast('Descreva o lançamento.');
    if (!(valor > 0)) return toast('Informe um valor maior que zero.');
    const body = { tipo: m.dataset.tipo, descricao: val('l-desc'), valor: Math.round(valor * 100) / 100, data: val('l-data') || today(), categoria: val('l-cat'), atualizadoEm: new Date().toISOString() };
    if (await guard(() => put('lancamentos', id || uid(), body), 'Lançamento salvo.')) { closeModal(); S.finMes = body.data.slice(0, 7); schedule(); }
  }

  async function saveChamada() {
    const ch = S.chamada;
    const alunos = alunosDaTurma(ch.turmaId).map((a) => a.id);
    const registros = Object.fromEntries(Object.entries(ch.registros).filter(([k, v]) => v && alunos.includes(k)));
    const body = { turmaId: ch.turmaId, data: ch.data, registros, atualizadoEm: new Date().toISOString() };
    if (await guard(() => put('chamadas', ch.key, body), 'Chamada salva.')) { ch.dirty = false; schedule(); }
  }

  async function deleteExamples() {
    const ops = [];
    for (const c of COLS) for (const [id, d] of Object.entries(S.data[c])) if (d.exemplo) ops.push([c, id]);
    await guard(async () => { for (const [c, id] of ops) await del(c, id); }, 'Dados de exemplo apagados.');
  }

  // CSV (planilha) — separado por ponto e vírgula, com BOM, abre direto no Excel / Google Planilhas.
  function csv(rows) {
    const cell = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n');
  }
  async function saveFile(filename, data) {
    if (!downloads) return toast('Baixar planilha só funciona pelo link do Claude.');
    try { await downloads.save({ filename, data }); } catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('Não foi possível gerar a planilha.'); }
  }
  function csvAlunos() {
    const st = freqStats();
    const rows = [['Nome', 'Nascimento', 'Idade', 'Responsável', 'Telefone', 'Turmas', 'Matrícula', 'Situação', 'Aulas registradas', 'Presenças', 'Faltas', 'Justificadas', 'Frequência']];
    for (const a of alunosList()) { const s = st[a.id] || {}; rows.push([a.nome, a.nascimento, age(a.nascimento) ?? '', a.responsavel, a.telefone, (a.turmaIds || []).map((id) => get('turmas', id)?.nome).filter(Boolean).join(', '), a.matriculaEm, a.status === 'inativo' ? 'Inativo' : 'Ativo', s.total || 0, s.pres || 0, s.faltas || 0, s.just || 0, s.total ? pct(s.rate) : '']); }
    saveFile(`alunos-instituto-iris-${today()}.csv`, csv(rows));
  }
  function csvInsc() {
    const rows = [['Nome', 'Nascimento', 'Responsável', 'Telefone', 'Turma de interesse', 'Como conheceu', 'Situação', 'Inscrito em', 'Observações']];
    for (const i of list('inscricoes')) rows.push([i.nome, i.nascimento, i.responsavel, i.telefone, get('turmas', i.turmaId)?.nome || '', i.origem, INSC[i.status]?.[0] || i.status, (i.criadoEm || '').slice(0, 10), i.obs]);
    saveFile(`inscricoes-instituto-iris-${today()}.csv`, csv(rows));
  }
  function csvFin() {
    const rows = [['Data', 'Tipo', 'Descrição', 'Categoria', 'Valor']];
    for (const l of list('lancamentos').sort((a, b) => a.data.localeCompare(b.data))) rows.push([l.data, l.tipo === 'saida' ? 'Saída' : 'Entrada', l.descricao, l.categoria, (l.tipo === 'saida' ? -1 : 1) * (Number(l.valor) || 0)].map((v) => (typeof v === 'number' ? String(v).replace('.', ',') : v)));
    saveFile(`financas-instituto-iris-${today()}.csv`, csv(rows));
  }

  // Exemplo (apenas quando a pessoa pede, marcado como exemplo para apagar depois).
  function exampleData() {
    const d = new Date(); const back = (n) => { const x = new Date(d); x.setDate(x.getDate() - n); return ymd(x); };
    const t1 = 'ex-turma-info', t2 = 'ex-turma-reforco', t3 = 'ex-turma-danca';
    const turmas = {
      [t1]: { nome: 'Informática básica', dias: [1, 3], horario: '14:00', capacidade: 15, professor: 'Prof. Carla', cor: '#1c2d6b', exemplo: true },
      [t2]: { nome: 'Reforço escolar', dias: [2, 4], horario: '09:00', capacidade: 20, professor: 'Prof. Marcos', cor: '#d99a12', exemplo: true },
      [t3]: { nome: 'Dança', dias: [6], horario: '10:00', capacidade: 25, professor: 'Prof. Bia', cor: '#17885a', exemplo: true },
    };
    const nomes = [['Ana Clara Souza', t1, '2012-04-10'], ['Bruno Lima', t1, '2010-09-22'], ['Camila Rocha', t1, '1988-02-14'], ['Davi Santos', t2, '2014-06-03'], ['Eduarda Alves', t2, '2013-11-29'], ['Felipe Costa', t2, '2015-01-18'], ['Gabriela Nunes', t3, '2011-07-07'], ['Heitor Ramos', t3, '2012-12-01'], ['Isabela Melo', t2, '2014-03-25']];
    const alunos = {};
    nomes.forEach(([nome, t, nasc], k) => (alunos[`ex-aluno-${k}`] = { nome, turmaIds: [t], nascimento: nasc, status: 'ativo', matriculaEm: back(60 - k * 6), telefone: '', responsavel: '', exemplo: true }));
    const chamadas = {};
    for (let k = 1; k <= 28; k++) {
      const dt = back(k); const dow = parseYmd(dt).getDay();
      for (const [tid, t] of Object.entries(turmas)) {
        if (!t.dias.includes(dow)) continue;
        const reg = {};
        Object.entries(alunos).forEach(([aid, a], j) => { if (a.turmaIds[0] === tid) reg[aid] = (j * 7 + k * 3) % 11 === 0 ? 'F' : (j === 4 && k % 2 === 0) ? 'F' : (j + k) % 13 === 0 ? 'J' : 'P'; });
        chamadas[`${tid}_${dt}`] = { turmaId: tid, data: dt, registros: reg, atualizadoEm: new Date().toISOString(), exemplo: true };
      }
    }
    const inscricoes = {
      'ex-insc-1': { nome: 'Luana Ferreira', turmaId: t1, telefone: '(21) 90000-0000', origem: 'Instagram', status: 'nova', criadoEm: new Date().toISOString(), exemplo: true },
      'ex-insc-2': { nome: 'Miguel Oliveira', turmaId: t3, origem: 'Indicação', status: 'contato', criadoEm: new Date(Date.now() - 3 * 864e5).toISOString(), exemplo: true },
    };
    const m0 = ym(d), m1 = addMonths(m0, -1), m2 = addMonths(m0, -2);
    const lancamentos = {
      'ex-l1': { tipo: 'entrada', descricao: 'Doação de apoiador', valor: 500, data: back(5), categoria: 'Doação', exemplo: true },
      'ex-l2': { tipo: 'saida', descricao: 'Material escolar', valor: 180, data: back(4), categoria: 'Material didático', exemplo: true },
      'ex-l3': { tipo: 'saida', descricao: 'Lanche das turmas', valor: 120, data: back(2), categoria: 'Lanche', exemplo: true },
      'ex-l4': { tipo: 'entrada', descricao: 'Rifa beneficente', valor: 650, data: m1 + '-15', categoria: 'Evento / rifa', exemplo: true },
      'ex-l5': { tipo: 'saida', descricao: 'Conta de luz', valor: 210, data: m1 + '-10', categoria: 'Aluguel / contas', exemplo: true },
      'ex-l6': { tipo: 'entrada', descricao: 'Patrocínio comércio local', valor: 300, data: m2 + '-08', categoria: 'Patrocínio', exemplo: true },
      'ex-l7': { tipo: 'saida', descricao: 'Transporte de passeio', valor: 260, data: m2 + '-20', categoria: 'Transporte', exemplo: true },
    };
    return { turmas, alunos, chamadas, inscricoes, lancamentos };
  }
  async function seed() {
    const ex = exampleData();
    toast('Carregando exemplo…');
    await guard(async () => { for (const c of COLS) for (const [id, body] of Object.entries(ex[c])) await put(c, id, body); }, 'Exemplo carregado. Apague quando terminar de testar.');
  }

  // ───────────── Eventos ─────────────
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'modal-bg' && e.target !== t) return;
    if (act !== 'confirm' && S.confirm) { S.confirm = null; refreshModalFoot(); schedule(); }
    switch (act) {
      case 'nav': S.view = t.dataset.v; try { localStorage.setItem('iris:view', S.view); } catch {} render(); window.scrollTo?.(0, 0); break;
      case 'go-chamada': S.chamada.turmaId = t.dataset.t; S.chamada.data = today(); S.chamada.key = ''; S.view = 'chamada'; render(); break;
      case 'modal-bg': case 'modal-close': closeModal(); break;
      case 'confirm': {
        const key = t.dataset.key;
        if (S.confirm !== key) { S.confirm = key; if ($('#modal-root .modal')) refreshModalFoot(); else render(); return; }
        S.confirm = null;
        const ctx = JSON.parse($('#modal-root .modal')?.dataset.ctx || '{}');
        if (key === 'apagar-exemplos') { await deleteExamples(); return; }
        if (key === 'del-aluno') { if (await guard(() => del('alunos', ctx.id), 'Aluno excluído.')) closeModal(); }
        if (key === 'del-turma') { if (await guard(() => del('turmas', ctx.id), 'Turma excluída.')) closeModal(); }
        if (key === 'del-insc') { if (await guard(() => del('inscricoes', ctx.id), 'Inscrição excluída.')) closeModal(); }
        if (key === 'del-lanc') { if (await guard(() => del('lancamentos', ctx.id), 'Lançamento excluído.')) closeModal(); }
        break;
      }
      case 'seed': seed(); break;
      // Chamada
      case 'ch-turma': S.chamada.turmaId = t.dataset.t; render(); break;
      case 'ch-open': S.chamada.data = t.dataset.d; render(); window.scrollTo?.(0, 0); break;
      case 'ch-mark': { const r = S.chamada.registros; const cur = r[t.dataset.id] || ''; r[t.dataset.id] = { '': 'P', P: 'F', F: 'J', J: 'P' }[cur]; S.chamada.dirty = true; render(); break; }
      case 'ch-all': for (const a of alunosDaTurma(S.chamada.turmaId)) S.chamada.registros[a.id] = 'P'; S.chamada.dirty = true; render(); break;
      case 'ch-clear': S.chamada.registros = {}; S.chamada.dirty = true; render(); break;
      case 'ch-save': saveChamada(); break;
      // Alunos / turmas / inscrições / finanças
      case 'aluno-new': alunoModal(null, t.dataset.t); break;
      case 'aluno-open': alunoModal(t.dataset.id); break;
      case 'aluno-save': saveAluno(t.dataset.id); break;
      case 'turma-new': turmaModal(null); break;
      case 'turma-open': turmaModal(t.dataset.id); break;
      case 'turma-save': saveTurma(t.dataset.id); break;
      case 'insc-new': inscModal(null); break;
      case 'insc-open': inscModal(t.dataset.id); break;
      case 'insc-save': saveInsc(t.dataset.id); break;
      case 'insc-filter': S.inscStatus = t.dataset.s; render(); break;
      case 'insc-matricular': matricular(t.dataset.id); break;
      case 'lanc-new': lancModal(null); break;
      case 'lanc-open': lancModal(t.dataset.id); break;
      case 'lanc-save': saveLanc(t.dataset.id); break;
      case 'l-tipo': {
        const m = $('#modal-root .modal'); m.dataset.tipo = t.dataset.v;
        m.querySelectorAll('[data-act="l-tipo"]').forEach((b) => b.classList.toggle('on', b === t));
        $('#l-cat').innerHTML = (t.dataset.v === 'saida' ? CAT_OUT : CAT_IN).map((c) => `<option>${c}</option>`).join('');
        break;
      }
      case 'fin-prev': S.finMes = addMonths(S.finMes, -1); render(); break;
      case 'fin-next': S.finMes = addMonths(S.finMes, 1); render(); break;
      case 'csv-alunos': csvAlunos(); break;
      case 'csv-insc': csvInsc(); break;
      case 'csv-fin': csvFin(); break;
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'alunos-q') { S.alunosQ = e.target.value; render(); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'alunos-turma') { S.alunosTurma = el.value; render(); }
    else if (el.id === 'alunos-status') { S.alunosStatus = el.value; render(); }
    else if (el.id === 'ch-data') {
      if (S.chamada.dirty && !window.__chWarn) { window.__chWarn = 1; toast('A chamada anterior não foi salva.'); }
      S.chamada.data = el.value || today(); render();
    }
    else if (el.dataset.inscStatus) guard(() => patch('inscricoes', el.dataset.inscStatus, { status: el.value }), 'Situação atualizada.');
    else if (el.dataset.photo) uploadPhoto(el.dataset.photo, el.files && el.files[0]);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modal-root .modal')) closeModal(); });

  // ───────────── Inicialização ─────────────
  render();

  async function boot() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { startLocal(); return; }
    const [d, u, a, dl] = await Promise.all(['db', 'user', 'assets', 'downloads'].map((n) => c.use(n).catch(() => null)));
    if (!d) { startLocal(); return; }
    db = d; assets = a; downloads = dl; S.canUpload = !!a; S.mode = 'db';
    if (u) {
      try { const w = await u.can('data.write'); if (w === false) S.canWrite = false; } catch {}
    }
    const timer = setTimeout(() => { S.slow = true; schedule(); }, 10000);
    for (const col of COLS) {
      db.collection(col).onSnapshot((snap) => {
        const next = {};
        for (const doc of snap.docs) next[doc.id] = doc.data();
        S.data[col] = next;
        if (!snap.metadata.fromCache) { S.loaded.add(col); if (S.loaded.size === COLS.length) { clearTimeout(timer); S.slow = false; } }
        schedule();
      }, () => { S.loaded.add(col); schedule(); });
    }
    schedule();
  }

  function startLocal() {
    S.mode = 'local';
    S.data = exampleData();
    render();
  }

  boot();
})();
</script>
