# Publica o sistema no Firebase (Google).
# Só roda quando alguém manda publicar (aba Actions → "Publicar gestão" → Run workflow),
# para que as mudanças em andamento não entrem no ar antes de aprovadas.
# Precisa, nas configurações do repositório no GitHub:
#   Secrets → FIREBASE_SERVICE_ACCOUNT  (chave da conta de serviço, arquivo .json inteiro)
#   Variables → FIREBASE_PROJECT_ID     (ID do projeto no Firebase)
name: Publicar gestão
on:
  workflow_dispatch:
    inputs:
      aluna_teste:
        description: 'Só cadastrar uma aluna de teste com este e-mail (não publica o site)'
        required: false
        default: ''
      remover_aluna_teste:
        description: 'Só remover a aluna de teste com este e-mail e tudo dela (não publica o site)'
        required: false
        default: ''

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar configuração
        id: cfg
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PID" ]; then
            echo "Firebase ainda não configurado; nada a publicar."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cadastrar aluna de teste
        if: steps.cfg.outputs.ok == 'true' && inputs.aluna_teste != ''
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
          EMAIL: ${{ inputs.aluna_teste }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install --no-save --silent firebase-admin@12
          node scripts/aluna-teste.mjs "$EMAIL"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Remover aluna de teste
        if: steps.cfg.outputs.ok == 'true' && inputs.remover_aluna_teste != ''
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
          EMAIL: ${{ inputs.remover_aluna_teste }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install --no-save --silent firebase-admin@12
          node scripts/remover-aluna-teste.mjs "$EMAIL"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Montar o site
        if: steps.cfg.outputs.ok == 'true' && inputs.aluna_teste == '' && inputs.remover_aluna_teste == ''
        run: node scripts/build-gestao.mjs && node scripts/build-site.mjs
      - name: Publicar site e regras de acesso
        if: steps.cfg.outputs.ok == 'true' && inputs.aluna_teste == '' && inputs.remover_aluna_teste == ''
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project "$PID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
