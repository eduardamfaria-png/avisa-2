<title>Site Instituto Íris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
:root {
  --bg: #f4f5fa; --surface: #ffffff; --surface-2: #eef0f7; --ink: #141c40; --muted: #5b6386; --faint: #8a91ad; --line: #e1e4ef;
  --navy: #1c2d6b; --navy-ink: #ffffff; --navy-soft: #e6eaf7; --gold: #d99a12; --gold-soft: #fbf1d9; --gold-ink: #7a5508;
  --green: #17885a; --green-soft: #dff3e9; --red: #c8403a; --red-soft: #fbe5e3; --amber: #a8700f; --amber-soft: #fbefd6;
  --shadow: 0 1px 2px rgba(20, 28, 64, .06), 0 6px 20px rgba(20, 28, 64, .05);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1326; --surface: #161d37; --surface-2: #1d2645; --ink: #edf0fa; --muted: #a2aac8; --faint: #7a83a6; --line: #283255;
    --navy: #8ea6ff; --navy-ink: #0e1326; --navy-soft: #222d55; --gold: #f2b93b; --gold-soft: #3a2f14; --gold-ink: #f6d58a;
    --green: #4fcf92; --green-soft: #173a2b; --red: #ff7a72; --red-soft: #45201f; --amber: #f2b93b; --amber-soft: #3a2f14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1326; --surface: #161d37; --surface-2: #1d2645; --ink: #edf0fa; --muted: #a2aac8; --faint: #7a83a6; --line: #283255;
  --navy: #8ea6ff; --navy-ink: #0e1326; --navy-soft: #222d55; --gold: #f2b93b; --gold-soft: #3a2f14; --gold-ink: #f6d58a;
  --green: #4fcf92; --green-soft: #173a2b; --red: #ff7a72; --red-soft: #45201f; --amber: #f2b93b; --amber-soft: #3a2f14;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
.main { min-width: 0; padding-inline: 16px; padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.wrap > * { min-width: 0; }
.logo-img { display: block; height: 48px; width: auto; background: #fff; border-radius: 10px; padding: 3px 6px; }
.top { display: flex; align-items: center; gap: 10px; }
.top .grow { min-width: 0; }
.top b { display: block; font-family: var(--display); font-size: 16px; }
.top small { color: var(--muted); font-size: 12.5px; }
.who-select { margin-left: auto; max-width: 30vw !important; min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 4px 30px 4px 10px; font-size: 13.5px; font-weight: 600; max-width: 46vw; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; border: 0; background: none; color: var(--faint); font-size: 10.5px; font-weight: 600; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--navy); }
.tab.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 9px; background: var(--gold); color: #1a1405; font-size: 10px; line-height: 16px; padding: 0 4px; }
@media (min-width: 960px) {
  .app { grid-template-columns: 236px 1fr; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; background: var(--surface); border-right: 1px solid var(--line); }
  .side .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 18px; text-align: center; }
  .side .brand .logo-img { height: auto; width: 100%; max-width: 180px; padding: 6px 10px; }
  .side .brand small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .side .tab { flex-direction: row; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; color: var(--muted); }
  .side .tab:hover { background: var(--surface-2); color: var(--ink); }
  .side .tab.on { background: var(--navy-soft); color: var(--navy); }
  .side .tab.on::before { top: 9px; bottom: 9px; left: -14px; right: auto; width: 4px; height: auto; border-radius: 0 3px 3px 0; }
  .side .tab .dot { position: static; margin-left: auto; }
  .tabs, .top .logo-img, .sair-m { display: none; }
  .main { padding-inline: 32px; padding-block: 26px 48px; }
}

.page-head h1 { font-size: 28px; font-weight: 800; }
.page-head p { color: var(--muted); margin-top: 4px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-title h2 { font-size: 18px; }
.section-title span { font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.wrapx { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.navy { background: var(--navy-soft); color: var(--navy); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); }
.dotc { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink); font-size: 13.5px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.banner svg { flex: none; width: 18px; height: 18px; margin-top: 2px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1.15fr 1fr; align-items: start; } }

/* Avisos */
.aviso { display: flex; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--gold); box-shadow: var(--shadow); }
.aviso.urgente { border-left-color: var(--red); }
.aviso .ic { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-ink); }
.aviso.urgente .ic { background: var(--red-soft); color: var(--red); }
.aviso .ic svg { width: 19px; height: 19px; }
.aviso h3 { font-size: 15.5px; }
.aviso p { font-size: 14px; color: var(--muted); margin-top: 2px; }
.aviso .foot { font-size: 12px; color: var(--faint); margin-top: 6px; }

/* Próxima aula */
.next { padding: 18px; background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.next .eyebrow { color: color-mix(in srgb, var(--navy-ink) 70%, transparent); }
.next h2 { font-size: 24px; margin-top: 4px; }
.next .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: color-mix(in srgb, var(--navy-ink) 85%, transparent); }

/* Aulas */
.turma { padding: 16px; border-left: 5px solid var(--c); }
.turma h3 { font-size: 18px; }
.turma dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 14px; }
.turma dt { color: var(--muted); }
.turma dd { margin: 0; font-weight: 600; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 8px 4px; text-align: center; min-height: 92px; display: flex; flex-direction: column; gap: 4px; }
.wd.today { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.wd b { font-size: 12px; color: var(--muted); }
.wd .n { font-family: var(--display); font-weight: 800; font-size: 18px; }
.wd em { font-style: normal; font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 2px 3px; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Frequência */
.freq { padding: 16px; display: flex; gap: 16px; align-items: center; }
.ring { --p: 0; width: 84px; height: 84px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring span { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 19px; }
.hist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.hist i { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; }
.hist .P { background: var(--green); } .hist .F { background: var(--red); } .hist .J { background: var(--amber); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* Faltas e modal */
.faltas { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.falta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.input { width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
textarea.input { resize: vertical; }
.backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 32, .55); display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.modal h2 { font-size: 20px; }
@media (min-width: 640px) { .backdrop { align-items: center; padding: 24px; } .modal { max-width: 520px; border-radius: 20px; padding: 22px 24px; } }
.tab span { white-space: nowrap; }

/* Mural */
.post { overflow: hidden; }
.post .foto { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 800; font-size: 20px; text-align: center; padding: 16px; position: relative; }
.post .foto small { position: absolute; right: 10px; bottom: 8px; font-family: var(--body); font-size: 11px; font-weight: 600; opacity: .85; }
.post .body { padding: 14px 16px 16px; }
.post h3 { font-size: 17px; }
.post p { color: var(--muted); font-size: 14.5px; margin-top: 6px; }
.post .foot { font-size: 12px; color: var(--faint); margin-top: 10px; }
.feed { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .feed { grid-template-columns: 1fr 1fr; } }

/* Oportunidades */
.op { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.op h3 { font-size: 16.5px; }
.op p { color: var(--muted); font-size: 14px; }
.op .row .small { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chip.on { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.empty { text-align: center; padding: 22px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
.install { display: flex; gap: 12px; align-items: center; padding: 14px; }
.install svg { flex: none; width: 26px; height: 26px; color: var(--navy); }
.post .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* Site aberto */
.btn svg { width: 18px; height: 18px; flex: none; }
.feed { align-items: start; }
.user-btn { margin-left: auto; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; border: 0; background: none; color: var(--navy); font-size: 11.5px; font-weight: 700; padding: 4px 6px; }
.user-btn svg { width: 30px; height: 30px; padding: 5px; border-radius: 50%; background: var(--navy-soft); }
.hero { padding: 20px; background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.hero h1 { font-size: 26px; font-weight: 800; margin-top: 4px; } .hero p { margin-top: 6px; opacity: .9; }
.hero .eyebrow { color: var(--gold); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1405; }
.btn.on-navy { background: transparent; border-color: color-mix(in srgb, var(--navy-ink) 45%, transparent); color: var(--navy-ink); }
.cta { border-left: 5px solid var(--gold); }
.cta h3 { font-size: 17px; }
.logos { display: flex; flex-wrap: wrap; gap: 8px; }
.logo-chip { padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); font-weight: 700; font-size: 13.5px; }
.parceiro { display: flex; gap: 12px; align-items: flex-start; }
.parceiro .pl { width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center; background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; font-size: 18px; }
.parceiro { flex-direction: column; align-items: stretch; }
.parceiro .pl-box { height: 110px; border-radius: 12px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 12px; overflow: hidden; }
.parceiro .pl-box img { width: 100%; height: 86px; object-fit: contain; display: block; }
.parceiro h3 { font-size: 16.5px; }
.passos { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 960px) { .user-btn { display: none; } }
/* Fotos e Quem somos */
.foto-ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 16px; color: var(--muted); font-size: 13px; font-weight: 600;
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 12px, color-mix(in srgb, var(--surface-2) 70%, var(--surface)) 12px 24px); border: 1px dashed var(--line); }
.foto-ph svg { width: 30px; height: 30px; color: var(--faint); }
.foto-real { display: block; width: 100%; object-fit: cover; }
.hero-foto { position: relative; border-radius: 18px; overflow: hidden; background: var(--navy); }
.hero-foto .hero-img { width: 100%; aspect-ratio: 4 / 3; object-position: center 35%; }
@media (min-width: 860px) { .hero-foto { display: grid; grid-template-columns: 1.05fr 1fr; } .hero-foto .hero-img { aspect-ratio: 4 / 3; height: 100%; } }
.hero-foto .foto-ph.hero-img { align-items: center; justify-content: flex-start; padding-top: 22px; }
.hero-txt { padding: 18px; color: #fff; background: var(--navy); }
.hero-txt h1 { font-size: 25px; font-weight: 800; color: #fff; }
.hero-txt p { margin-top: 6px; font-size: 14.5px; opacity: .92; }
@media (min-width: 860px) { .hero-txt { display: flex; flex-direction: column; justify-content: center; padding: 32px 36px; } .hero-txt h1 { font-size: 36px; } .hero-txt p { max-width: 640px; font-size: 15.5px; } }
.atv { padding-top: 0; overflow: hidden; }
.atv .atv-foto { margin: 0 -16px 4px; width: calc(100% + 32px); aspect-ratio: 16 / 9; border: 0; border-bottom: 1px solid var(--line); }
.inst { display: grid; gap: 16px; }
.inst .inst-foto { width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; }
.inst-txt { display: flex; flex-direction: column; gap: 10px; }
.inst-txt h1 { font-size: 28px; font-weight: 800; }
.inst-txt p { color: var(--muted); }
.sub { font-size: 17px; color: var(--gold-ink); font-weight: 700; }
.tit { font-size: 23px; font-weight: 800; }
.historia { padding: 16px; background: linear-gradient(180deg, var(--surface), var(--gold-soft)); border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
.historia .retrato { aspect-ratio: 4 / 3; object-position: center 30%; max-width: 440px; justify-self: center; border: 3px solid var(--gold); }
.historia .destaque { color: var(--gold-ink); font-weight: 700; font-style: italic; }
@media (min-width: 860px) { .inst { grid-template-columns: 1fr 1.1fr; align-items: center; gap: 28px; } .historia { grid-template-columns: 440px 1fr; } }
.mensagem { padding: 22px 18px; background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.mensagem .eyebrow { color: var(--gold); }
.mensagem blockquote { margin: 12px 0 0; padding-left: 16px; border-left: 3px solid var(--gold); display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.55; }
.mensagem .assinatura { font-family: 'Great Vibes', cursive; font-size: 40px; color: var(--gold); margin-top: 14px; line-height: 1; }
.mensagem .small { color: color-mix(in srgb, var(--navy-ink) 80%, transparent) !important; }
.proposito { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (min-width: 860px) { .proposito { grid-template-columns: repeat(4, 1fr); } }
.prop { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.prop .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-ink); }
.prop .ic svg { width: 24px; height: 24px; }
.prop h3 { font-size: 16px; } .prop p { font-size: 13.5px; color: var(--muted); }
.faca { padding: 20px 18px; background: var(--navy); border-color: var(--navy); color: var(--navy-ink); display: flex; flex-direction: column; gap: 8px; }
.faca p { opacity: .92; }
/* Entrada */
body.gated .app, body.gated .tabs { display: none; }
body:not(.gated) #gate { display: none; }
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: 100%; max-width: 460px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.gate-card h1 { font-size: 26px; font-weight: 800; }
.gate-logo .logo-img { height: 76px; margin: 0 auto 4px; }
.choice { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; width: 100%; }
.choice:hover { border-color: var(--navy); background: var(--navy-soft); }
.choice .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); flex: none; }
.choice .ic svg { width: 22px; height: 22px; }
.choice b { display: block; font-size: 16px; } .choice small { color: var(--muted); font-size: 13.5px; }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; font-size: 13px; padding: 0 11px; }
.btn.ghost { border-color: transparent; background: none; color: var(--navy); align-self: flex-start; padding-inline: 6px; }
.banner.err { background: var(--red-soft); color: var(--red); border-color: transparent; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--navy); }
.req { color: var(--red); }
.tl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.tl div { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 700; color: var(--faint); }
.tl i { height: 6px; border-radius: 3px; background: var(--surface-2); }
.tl .on { color: var(--green); } .tl .on i { background: var(--green); }
.side-foot { margin-top: auto; padding-top: 12px; }
.toast { position: fixed; z-index: 80; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; }
@media (min-width: 960px) { .toast { bottom: 24px; left: auto; right: 24px; } }
</style>

  ];

  let uid = 0; const nid = () => 'x' + (++uid);
  [AVISOS, MURAL, OPORTUNIDADES].forEach((l) => l.forEach((x) => { x.id = nid(); }));

  // just[k]: { motivo, arquivo, status: 'pendente' | 'aceita' | 'recusada', obs }  ·  insc[k]: { obs, status: 'pendente' | 'aprovada' | 'recusada', resp, turma }
  const S = { view: 'inicio', aluno: 'ana', opTipo: 'Todos', just: {}, insc: {}, modal: null };
  try { S.view = localStorage.getItem('portal:view') || 'inicio'; } catch {}
  // Exemplos já enviados, para a coordenação ter o que avaliar.
  { const fd = ALUNOS[1].hist.reforco.filter((x) => x.v === 'F').pop(); if (fd) S.just[`davi|reforco|${fd.data}`] = { motivo: 'Estava com febre, fiquei em casa.', arquivo: 'atestado.jpg', status: 'pendente' }; }
  { const fs = ALUNOS[0].hist.info.filter((x) => x.v === 'F'); if (fs[0]) S.just[`ana|info|${fs[0].data}`] = { motivo: 'Consulta médica.', arquivo: 'atestado.jpg', status: 'recusada', obs: 'Traga o atestado original na próxima aula, por favor.' }; }
  { const js = ALUNOS[0].hist.danca.filter((x) => x.v === 'J'); if (js[0]) S.just[`ana|danca|${js[0].data}`] = { motivo: 'Estava com febre.', arquivo: '', status: 'aceita', obs: 'Melhoras!' }; }
  S.insc['davi|danca'] = { tel: '(21) 98765-4321', obs: 'Ele adora dançar, pode ser no sábado.', status: 'pendente' };
  const aluno = () => ALUNOS.find((a) => a.id === S.aluno);

  function proximaAula(a) {
    for (let k = 0; k < 14; k++) {
      const d = addDays(hoje, k);
      const ts = a.turmas.filter((t) => TURMAS[t].dias.includes(d.getDay())).sort((x, y) => TURMAS[x].inicio.localeCompare(TURMAS[y].inicio));
      for (const t of ts) {
        if (k === 0) { const [h, m] = TURMAS[t].fim.split(':').map(Number); const agora = new Date(); if (agora.getHours() * 60 + agora.getMinutes() > h * 60 + m) continue; }
        return { t, d };
      }
    }
    return null;
  }
  const freq = (hist) => { const pres = (hist || []).filter((x) => x.v !== 'F').length; return hist && hist.length ? pres / hist.length : null; };
  const avisosAtivos = (a) => AVISOS.filter((x) => x.ate >= H && (!x.turma || a.turmas.includes(x.turma))).sort((x, y) => Number(!!y.urgente) - Number(!!x.urgente) || x.ate.localeCompare(y.ate));

  function header(eyebrow, title, sub) {
    return `<div class="top">${LOGO}<div class="grow"><b>Portal do Aluno</b><small>Instituto Íris</small></div>${selector()}<button class="btn sm sair-m" data-sair="1">Sair</button></div>
      <div class="page-head"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>`;
  }
  // O seletor só aparece quando o mesmo e-mail está na ficha de mais de um aluno.
  function selector() {
    const doEmail = ALUNOS.filter((a) => (EMAIL_ALUNOS[S.auth?.email] || []).includes(a.id));
    if (doEmail.length < 2) return '';
    return `<select class="who-select" id="who" aria-label="Ver dados de">${doEmail.map((a) => `<option value="${a.id}"${a.id === S.aluno ? ' selected' : ''}>${esc(a.nome.split(' ')[0])}</option>`).join('')}</select>`;
  }
  const demoBanner = () => `<div class="banner">${icon('info')}<span><b>Protótipo com dados de exemplo.</b> Este e-mail tem duas pessoas cadastradas (Ana Clara e Davi): troque no seletor do topo para ver cada um.</span></div>`;

  function avisoHtml(x) {
    const t = x.turma ? TURMAS[x.turma] : null;
    return `<article class="aviso${x.urgente ? ' urgente' : ''}"><span class="ic">${icon(x.urgente ? 'alert' : 'bell')}</span><div class="grow"><h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p>
      <div class="foot">${t ? `<span class="dotc" style="background:${t.cor};width:8px;height:8px;margin-right:5px"></span>${esc(t.nome)} · ` : 'Para todos · '}aviso até ${fmtCurto(parse(x.ate))}</div></div></article>`;
  }

  function vInicio() {
    const a = aluno();
    const nx = proximaAula(a);
    const av = avisosAtivos(a);
    const resumo = a.turmas.map((t) => ({ t, f: freq(a.hist[t]) }));
    return header(fmtLongo(hoje), `Olá, ${esc(a.nome.split(' ')[0])}!`, '') + demoBanner() + `
      <section><div class="section-title"><h2>Avisos</h2><span>${plural(av.length, 'aviso', 'avisos')}</span></div>
        ${av.length ? `<div class="stack">${av.map(avisoHtml).join('')}</div>` : '<div class="empty">Nenhum aviso no momento.</div>'}</section>
      <div class="grid2">
        ${nx ? (() => { const t = TURMAS[nx.t]; const k = Math.round((nx.d - hoje) / 864e5); return `<section class="card next"><div class="eyebrow">Próxima aula · ${k === 0 ? 'hoje' : k === 1 ? 'amanhã' : DIAS_LONGO[nx.d.getDay()]}</div><h2>${esc(t.nome)}</h2>
          <div class="meta"><span>${fmtCurto(nx.d)} · ${t.inicio}–${t.fim}</span><span>${esc(t.local)}</span><span>${esc(t.professor)}</span></div></section>`; })() : '<section class="card pad">Nenhuma aula nos próximos dias.</section>'}
        <section class="card pad"><div class="section-title"><h2>Minha frequência</h2><button class="btn" data-nav="frequencia" style="min-height:32px;font-size:13px">Ver detalhes</button></div>
          <div class="stack">${resumo.map(({ t, f }) => `<div class="row small"><span class="dotc" style="background:${TURMAS[t].cor}"></span><b class="grow">${esc(TURMAS[t].nome)}</b>${f === null ? '<span class="pill navy">Começando</span>' : `<span class="pill ${f < 0.75 ? 'red' : 'green'} num">${Math.round(f * 100)}%</span>`}</div>`).join('')}</div></section>
      </div>
      <section class="card install"><span>${icon('phone')}</span><div class="grow small"><b>Use como aplicativo</b><br><span class="muted">No celular, toque em "Adicionar à tela inicial" para abrir o portal direto, já conectado.</span></div></section>`;
  }

  function vAulas() {
    const a = aluno();
    const seg = addDays(hoje, -((hoje.getDay() + 6) % 7));
    const semana = Array.from({ length: 7 }, (_, i) => addDays(seg, i));
    return header('Minhas aulas', 'Cursos e horários', `${plural(a.turmas.length, 'curso', 'cursos')} em que ${esc(a.nome.split(' ')[0])} está matriculado(a).`) + `
      <section><div class="section-title"><h2>Esta semana</h2><span>${fmtCurto(semana[0])} a ${fmtCurto(semana[6])}</span></div>
        <div class="week">${semana.map((d) => { const ts = a.turmas.filter((t) => TURMAS[t].dias.includes(d.getDay())); return `<div class="wd${ymd(d) === H ? ' today' : ''}"><b>${DIAS[d.getDay()]}</b><span class="n num">${d.getDate()}</span>${ts.map((t) => `<em style="--c:${TURMAS[t].cor}" title="${esc(TURMAS[t].nome)} ${TURMAS[t].inicio}">${TURMAS[t].inicio}</em>`).join('')}</div>`; }).join('')}</div></section>
      <div class="stack">${a.turmas.map((id) => { const t = TURMAS[id]; return `<article class="card turma" style="--c:${t.cor}"><h3>${esc(t.nome)}</h3>
        <dl><dt>Dias</dt><dd>${t.dias.map((d) => DIAS_LONGO[d]).join(' e ')}</dd><dt>Horário</dt><dd class="num">${t.inicio} às ${t.fim}</dd><dt>Professor(a)</dt><dd>${esc(t.professor)}</dd><dt>Local</dt><dd>${esc(t.local)}</dd></dl></article>`; }).join('')}</div>`;
  }

  function vFrequencia() {
    const a = aluno();
    return header('Minha frequência', 'Presenças e faltas', 'O mínimo para concluir o curso é 75% de presença. Faltas justificadas não contam como falta.') + a.turmas.map((id) => {
      const t = TURMAS[id]; const h = a.hist[id] || []; const f = freq(h); const p = Math.round(f * 100);
      if (f === null) return `<section class="card pad"><h3 style="font-size:18px">${esc(t.nome)}</h3><p class="small muted">Ainda não houve aulas desta turma. A frequência aparece aqui depois da primeira chamada.</p></section>`;
      const P = h.filter((x) => x.v === 'P').length, F = h.filter((x) => x.v === 'F').length, J = h.filter((x) => x.v === 'J').length;
      const cor = f < 0.75 ? 'var(--red)' : f < 0.85 ? 'var(--amber)' : 'var(--green)';
      return `<section class="card"><div class="freq"><div class="ring" style="--p:${p};--rc:${cor}"><span class="num">${p}%</span></div>
        <div class="grow"><h3 style="font-size:18px">${esc(t.nome)}</h3><p class="small muted num">${plural(P, 'presença', 'presenças')} · ${plural(F, 'falta', 'faltas')} · ${plural(J, 'justificada', 'justificadas')} · ${h.length} aulas</p>
        ${f < 0.75 ? '<p class="small" style="color:var(--red);font-weight:700;margin-top:4px">Atenção: abaixo de 75%. Converse com a coordenação.</p>' : f < 0.85 ? '<p class="small" style="color:var(--amber);font-weight:700;margin-top:4px">Perto do mínimo. Evite novas faltas.</p>' : '<p class="small" style="color:var(--green);font-weight:700;margin-top:4px">Frequência ótima!</p>'}</div></div>
        <div style="padding:0 16px 16px"><span class="small muted">Últimas aulas</span><div class="hist">${h.map((x) => `<i class="${x.v}" title="${fmtCurto(parse(x.data))}: ${{ P: 'presente', F: 'falta', J: 'justificada' }[x.v]}">${{ P: '✓', F: '✕', J: 'J' }[x.v]}</i>`).join('')}</div>
        <div class="legend"><span><i style="background:var(--green)"></i>Presente</span><span><i style="background:var(--red)"></i>Falta</span><span><i style="background:var(--amber)"></i>Justificada</span></div>
        ${faltasHtml(a, id, h)}</div></section>`;
    }).join('');
  }

  // Faltas da turma com o estado da justificativa.
  function faltasHtml(a, tid, h) {
    const faltas = h.filter((x) => x.v === 'F' || S.just[`${a.id}|${tid}|${x.data}`]).slice().reverse();
    if (!faltas.length) return '';
    return `<div class="faltas"><span class="small muted" style="font-weight:700">Faltas e justificativas</span>${faltas.map((x) => {
      const k = `${a.id}|${tid}|${x.data}`; const j = S.just[k];
      const d = parse(x.data);
      const st = !j ? `<button class="btn" data-just="${esc(k)}">Justificar</button>`
        : j.status === 'pendente' ? '<span class="pill amber">Em análise</span>'
        : j.status === 'aceita' ? '<span class="pill green">Justificativa aceita</span>'
        : '<span class="pill red">Não aceita</span>';
      return `<div class="falta-row"><span class="grow"><b>${DIAS_LONGO[d.getDay()].replace(/^./, (c) => c.toUpperCase())}, ${fmtCurto(d)}</b>${j ? `<br><span class="small muted">Motivo: ${esc(j.motivo)}${j.arquivo ? ' · anexo: ' + esc(j.arquivo) : ''}</span>${j.obs ? `<br><span class="small"><b>Coordenação:</b> ${esc(j.obs)}</span>` : ''}` : ''}</span>
        ${st}</div>`;
    }).join('')}${faltas.some((x) => S.just[`${a.id}|${tid}|${x.data}`]?.status === 'pendente') ? '<p class="small muted">Enquanto a justificativa está em análise, a falta continua contando. Se for aceita, vira justificada.</p>' : ''}</div>`;
  }

  function modalJust(k) {
    const [, tid, data] = k.split('|');
    const d = parse(data);
    return `<div class="backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Justificar falta">
      <h2>Justificar falta</h2><p class="muted small" style="margin:4px 0 14px">${esc(TURMAS[tid].nome)} · ${DIAS_LONGO[d.getDay()]}, ${fmtCurto(d)}</p>
      <form id="form-just" class="stack" data-k="${esc(k)}">
        <label class="field"><span>Motivo</span><textarea class="input" id="just-motivo" rows="3" required placeholder="Ex.: consulta médica, problema de transporte…"></textarea></label>
        <label class="field"><span>Atestado ou foto (opcional)</span><input class="input" type="file" id="just-arq" accept="image/*,application/pdf"></label>
        <p class="small muted">A coordenação avalia a justificativa. Só depois de aceita a falta passa a contar como justificada.</p>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">Enviar justificativa</button></div>
      </form></div></div>`;
  }

  function modalInsc(cid) {
    const c = CURSOS.find((x) => x.id === cid); const int = false; const a = aluno();
    return `<div class="backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Inscrição">
      <h2>Inscrição em ${esc(c.nome)}</h2><p class="muted small" style="margin:4px 0 14px">${esc(c.dias)} · ${esc(c.horario)}</p>
      <form id="form-insc" class="stack" data-c="${esc(cid)}">
        <p>Inscrever <b>${esc(a.nome)}</b> neste curso?</p>
        ${temVaga(c) ? '' : '<p class="small" style="color:var(--amber);font-weight:700">Sem vagas agora: a inscrição entra na lista de espera.</p>'}
        <label class="field"><span>Telefone / WhatsApp para contato *</span><input class="input" type="tel" id="insc-tel" required inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" maxlength="16" value="${esc(int ? a.telefone : '')}"><small class="small muted">Obrigatório: o professor vai usar para entrar em contato.</small><small class="small" id="insc-tel-err" style="color:var(--red);font-weight:700" hidden>Digite um telefone com DDD (10 ou 11 números).</small></label>
        <label class="field"><span>Observação para a coordenação (opcional)</span><textarea class="input" id="insc-obs" rows="2" placeholder="Ex.: só posso no período da tarde"></textarea></label>
        <p class="small muted">A coordenação analisa a inscrição e avisa quando ela for aprovada e a turma definida.</p>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">Enviar inscrição</button></div>
      </form></div></div>`;
  }

  function vCursos() {
    const a = aluno();
    return header('Cursos do Íris', 'Inscreva-se', 'Cursos gratuitos do instituto com inscrições abertas.') + `<div class="feed">${CURSOS.map((c) => {
      const ja = c.turma && a.turmas.includes(c.turma);
      const ins = S.insc[`${a.id}|${c.id}`];
      return `<article class="card op"><div class="row wrapx">${c.novo ? '<span class="pill gold">Novo</span>' : ''}<span class="pill ${temVaga(c) ? 'green' : 'amber'}">${temVaga(c) ? vagasTxt(c) : 'Lista de espera'}</span></div>
        <h3>${esc(c.nome)}</h3><p>${esc(c.texto)}</p>
        <div class="small muted">${esc(c.dias)} · ${esc(c.horario)} · Início: ${esc(c.inicio)}<br>Para quem: ${esc(c.quem)}</div>
        <div>${ja ? '<span class="pill navy">Você já está neste curso</span>' : ins?.status === 'pendente' ? '<span class="pill amber">Inscrição enviada · aguardando aprovação</span>' : ins?.status === 'recusada' ? `<span class="pill red">Inscrição não aprovada</span>${ins.resp ? `<p class="small" style="margin-top:6px"><b>Coordenação:</b> ${esc(ins.resp)}</p>` : ''}` : `<button class="btn primary" data-insc="${c.id}">${temVaga(c) ? 'Quero me inscrever' : 'Entrar na lista de espera'}</button>`}</div></article>`;
    }).join('')}</div>`;
  }

  function vMural() {
    return header('Mural', 'Acontece no Íris', 'Fotos e novidades do instituto.') + `<div class="feed">${MURAL.map((m) => `<article class="card post"><div class="foto" style="background:linear-gradient(135deg, ${m.cor}, color-mix(in srgb, ${m.cor} 55%, #000))">${m.img ? `<img src="${m.img}" alt="${esc(m.titulo)}">` : `${esc(m.titulo)}<small>${esc(m.foto)} (exemplo)</small>`}</div>
      <div class="body"><h3>${esc(m.titulo)}</h3><p>${esc(m.texto)}</p><div class="foot">Publicado em ${fmtCurto(parse(m.data))} pela coordenação</div></div></article>`).join('')}</div>`;
  }

  function vOportunidades() {
    const tipos = ['Todos', 'Emprego', 'Estágio', 'Curso', 'Edital'];
    const lista = OPORTUNIDADES.filter((o) => o.prazo >= H).filter((o) => S.opTipo === 'Todos' || o.tipo === S.opTipo).sort((a, b) => a.prazo.localeCompare(b.prazo));
    const cor = { Emprego: 'green', Estágio: 'green', Curso: 'navy', Edital: 'gold' };
    return header('Oportunidades', 'Oportunidade para todos!', 'Vagas, cursos e editais de fora do instituto, escolhidos pela coordenação. A inscrição é feita no site de quem oferece.') + `
      <div class="chips">${tipos.map((t) => `<button class="chip${S.opTipo === t ? ' on' : ''}" data-op="${t}">${t}</button>`).join('')}</div>
      ${lista.length ? `<div class="feed">${lista.map((o) => { const dias = Math.round((parse(o.prazo) - hoje) / 864e5); return `<article class="card op"><div class="row wrapx"><span class="pill ${cor[o.tipo]}">${o.tipo}</span><span class="small grow" style="text-align:right">${dias <= 7 ? `<b style="color:var(--red)">Termina em ${plural(dias, 'dia', 'dias')}</b>` : `Até ${fmtCurto(parse(o.prazo))}`}</span></div>
        <h3>${esc(o.titulo)}</h3><p>${esc(o.texto)}</p><div class="small muted">Para quem: ${esc(o.quem)}</div>
        <div><button class="btn primary" data-saber="${esc(o.link || '')}">Acessar inscrição ↗</button> <span class="small muted">no ${esc(o.onde)}</span></div></article>`; }).join('')}</div>` : '<div class="empty">Nenhuma oportunidade desse tipo agora.</div>'}`;
  }

  const AJUDA = ['Patrocínio', 'Doação (dinheiro ou materiais)', 'Parceria com empresa', 'Ser voluntário(a)', 'Outro'];

  const lerLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const gravarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  // Quem entrou fica salvo no aparelho: na próxima vez o site já abre na tela certa.
  S.auth = lerLS('portal:auth', null);

  const salvarVis = () => gravarLS('portal:visitante', S.vis);
  const okEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  const ERR = (h) => `<div class="banner err"><span>${h}</span></div>`;

  function pHeader() {
    return `<div class="top">${LOGO}<div class="grow"><b>Instituto Íris</b><small>Aulas gratuitas em Éden</small></div></div>`;
  }
  const STI = { enviada: 0, analise: 1, matriculado: 2 };
  function minhasInsc() {
    const ps = S.vis.pedidos; if (!ps.length) return '';
    return `<section><div class="section-title"><h2>Sua inscrição</h2><span>${esc(S.vis.dados?.nome?.split(' ')[0] || '')}</span></div><div class="stack">${ps.map((p, i) => ({ ...p, i })).reverse().map((p) => {
      const c = CURSOS.find((x) => x.id === p.curso); const k = STI[p.status];
      const txt = { enviada: 'Recebemos sua inscrição. A coordenação vai analisar.', analise: `A coordenação está analisando e vai falar com você pelo WhatsApp <b class="num">${esc(S.vis.dados?.telefone || '')}</b>.`, matriculado: 'Parabéns, você foi matriculado(a)! Agora toque em <b>Entrar</b>, na barra do site, e use este mesmo e-mail para ver suas aulas e sua frequência.' }[p.status];
      return `<article class="card pad"><div class="row wrapx"><h3 class="grow" style="font-size:17px">${esc(c.nome)}</h3><span class="small muted">enviada em ${fmtCurto(parse(p.em))}</span></div>
        <div class="tl">${['Enviada', 'Em análise', 'Matriculado(a)'].map((l, j) => `<div class="${j <= k ? 'on' : ''}"><i></i>${l}</div>`).join('')}</div>
        <p class="small" style="margin-top:10px">${txt}</p>
        ${p.status !== 'matriculado' ? `<button class="btn ghost sm" data-avancar="${p.i}" style="margin-top:6px">(protótipo) simular próxima etapa</button>` : ''}</article>`;
    }).join('')}</div></section>`;
  }
  function fotoBox(src, rotulo, cls = '') {
    return src ? `<img class="foto-real ${cls}" src="${src}" alt="${esc(rotulo)}">` : `<div class="foto-ph ${cls}">${icon('cam')}<span>Foto: ${esc(rotulo)}</span></div>`;
  }
  function cursoCard(c) {
    const p = S.vis.pedidos.find((x) => x.curso === c.id);
    return `<article class="card op atv">${fotoBox(c.foto, 'aula de ' + c.nome, 'atv-foto')}<div class="row wrapx">${c.novo ? '<span class="pill gold">Novo</span>' : ''}<span class="pill ${temVaga(c) ? 'green' : ''}">${temVaga(c) ? vagasTxt(c) : 'Sem vagas no momento'}</span></div>

      <div>${p ? '<span class="pill amber">Inscrição enviada · acompanhe acima</span>' : temVaga(c) ? `<button class="btn primary" data-pinsc="${c.id}">Quero me inscrever</button>` : '<span class="small muted">As inscrições abrem quando houver vaga.</span>'}</div></article>`;
  }
  function postCard(m) {
    return `<article class="card post"><div class="foto" style="background:linear-gradient(135deg, ${m.cor}, color-mix(in srgb, ${m.cor} 55%, #000))">${m.img ? `<img src="${m.img}" alt="${esc(m.titulo)}">` : `${esc(m.titulo)}<small>${esc(m.foto)} (exemplo)</small>`}</div>

  function vPInicio() {

    return pHeader() + `

      ${MURAL.length ? `<div class="feed">${MURAL.map(postCard).join('')}</div>` : '<div class="empty">Em breve, fotos das nossas aulas aqui.</div>'}`;

  function vPCursos() {

  function vPSobre() {

        <div class="inst-txt"><div class="eyebrow">Quem somos</div><h1>Conheça o Instituto Íris</h1><h2 class="sub">Cuidar de pessoas. Transformar vidas.</h2>

          <p class="destaque">Uma história de gratidão que se transforma em amor ao próximo.</p></div></section>

      <section class="inst">${fotoBox(FOTOS.fundador, 'Eduardo Faria no Instituto, junto à comunidade', 'inst-foto')}

          <p>Empresário, cristão, esposo e pai, Eduardo Faria acredita que o sucesso também está na capacidade de contribuir para a vida de outras pessoas.</p>
          <p>Fundador e presidente da Shine Rio, empresa que gera mais de 500 empregos diretos, dedica parte de sua vida ao ensino, ao empreendedorismo e ao desenvolvimento de pessoas.</p>
          <p>Criou o Instituto Íris para colocar sua experiência e seus valores a serviço da sociedade, oferecendo oportunidades a quem mais precisa.</p>
          <p>Seu desejo é construir um espaço onde as pessoas possam aprender, cuidar da saúde, desenvolver seus talentos e realizar sonhos.</p></div></section>

      <section class="card mensagem"><div class="eyebrow">Uma mensagem do presidente</div>
        <blockquote><p>Acredito que Deus nos permite conquistar muitas coisas na vida, mas também nos dá a responsabilidade de compartilhar nossas conquistas com o próximo.</p>
          <p>O Instituto Íris nasce desse sentimento.</p>
          <p>Queremos oferecer às pessoas oportunidades que, muitas vezes, elas não tiveram. Seja através da educação, da saúde, do esporte ou do trabalho.</p>
          <p>Se conseguirmos mudar para melhor a realidade de uma família, nosso trabalho já terá valido a pena.</p></blockquote>
        <div class="assinatura">Eduardo Faria</div><div class="small muted"><b>Eduardo Faria</b> · Fundador e Presidente</div></section>

      <section><div class="eyebrow">Nosso propósito</div><h2 class="tit" style="margin:4px 0 12px">O que move o Íris</h2>
        <div class="proposito">${PROPOSITO.map(([ic, t, d]) => `<div class="card prop"><span class="ic">${icon(ic)}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></section>

      <section class="card faca"><h2 class="tit">Juntos, podemos fazer a diferença!</h2>
        <p>Seja participando das nossas atividades, compartilhando conhecimento, sendo voluntário ou apoiando nossos projetos, você também pode fazer parte dessa história.</p>
        <p><b>Venha conhecer o Instituto Íris!</b></p>
        <div class="row wrapx" style="margin-top:14px"><button class="btn gold" data-nav="p-cursos">Ver atividades</button><button class="btn on-navy" data-nav="p-parceiros" data-depois="associado">Quero apoiar / ser voluntário</button></div></section>

      <section class="card pad row wrapx"><span class="grow">Acompanhe as novidades no Instagram <b>@instituto__iris</b></span><button class="btn" data-insta="1">Abrir Instagram ↗</button></section>`;
  }
  function vPParceiros() {
    return pHeader() + `<div class="page-head"><div class="eyebrow">Parceiros e patrocinadores</div><h1>Quem apoia o Íris</h1><p>Empresas, instituições e pessoas que tornam os cursos gratuitos possíveis.</p></div>
      <button class="btn gold" data-ir="associado" style="align-self:flex-start">Quero ser um associado</button>
      <div class="feed">${PARCEIROS.map((p) => `<article class="card pad parceiro" style="--c:${p.cor}"><div class="pl-box">${p.logo ? `<img src="${p.logo}" alt="Logo ${esc(p.nome)}">` : `<span class="pl">${esc(p.nome.split(' ').map((w) => w[0]).slice(0, 2).join(''))}</span>`}</div><div><h3>${esc(p.nome)}</h3><p class="small muted">${esc(p.texto)}</p></div></article>`).join('')}</div>
      ${assocSecao()}`;
  }
  // "Seja um associado": formulário dentro da aba Parceiros, para quem quer patrocinar, doar, ser parceiro ou voluntário.
  function assocSecao() {
    if (S.assocEnviado) return `<section class="card pad cta" id="associado" style="text-align:center"><h2 style="font-size:22px">Obrigado!</h2><p class="muted" style="margin-top:6px">Recebemos seu contato. A coordenação vai falar com você em breve.</p></section>`;
    return `<section class="card pad cta" id="associado"><div class="eyebrow">Seja um associado</div><h2 style="font-size:22px;margin-top:4px">Apoie o Instituto Íris</h2><p class="muted" style="margin:4px 0 14px">Patrocine, doe, seja parceiro ou voluntário. Deixe seu contato e a coordenação fala com você.</p>
      <form id="form-assoc" class="stack" novalidate>
        <label class="field"><span>Seu nome <b class="req">*</b></span><input class="input" id="as-nome" autocomplete="name"></label>
        <label class="field"><span>Empresa (se for o caso)</span><input class="input" id="as-emp" autocomplete="organization"></label>
        <label class="field"><span>WhatsApp <b class="req">*</b></span><input class="input" type="tel" id="as-tel" inputmode="tel" placeholder="(21) 99999-9999" maxlength="16"></label>
        <label class="field"><span>E-mail</span><input class="input" type="email" id="as-email" placeholder="seu@email.com"></label>
        <label class="field"><span>Como quer ajudar</span><select class="input" id="as-ajuda">${AJUDA.map((a) => `<option>${a}</option>`).join('')}</select></label>
        <label class="field"><span>Mensagem (opcional)</span><textarea class="input" id="as-msg" rows="3"></textarea></label>
        ${S.assocErro ? ERR(S.assocErro) : ''}
        <button class="btn primary block">Enviar</button></form></section>`;
  }


  // Inscrição de quem ainda não é aluno: cadastro rápido junto com a inscrição (sem login).
  function modalPInsc(cid) {
    // cid vazio = veio do "Não sou aluno" do Entrar: a pessoa escolhe o curso aqui.
    const c = CURSOS.find((x) => x.id === cid); const d = S.vis.dados || {}; const t = S.modal.tmp || {};
    const v = (k) => esc(t[k] ?? d[k] ?? '');
    const jaPediu = (id) => S.vis.pedidos.some((p) => p.curso === id);
    const opcoes = CURSOS.filter((x) => temVaga(x) && !jaPediu(x.id));
    return `<div class="backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Inscrição">
      ${c ? `<h2>Inscrição em ${esc(c.nome)}</h2><p class="muted small" style="margin:4px 0 14px">${esc(c.dias)} · ${esc(c.horario)} · ${vagasTxt(c)}</p>`
        : `<h2>Quero me inscrever</h2><p class="muted small" style="margin:4px 0 14px">Escolha um curso com vaga e preencha o cadastro rápido.</p>`}
      <form id="form-pinsc" class="stack" data-c="${esc(cid || '')}" novalidate>
        ${c ? '' : opcoes.length ? `<label class="field"><span>Curso <b class="req">*</b></span><select class="input" id="pi-curso"><option value="">Escolha o curso</option>${opcoes.map((x) => `<option value="${x.id}"${t.curso === x.id ? ' selected' : ''}>${esc(x.nome)} · ${esc(x.dias)} ${esc(x.horario)} · ${vagasTxt(x)}</option>`).join('')}</select></label>` : '<div class="empty">Nenhum curso com vaga aberta agora. Volte em breve!</div>'}
        ${d.nome ? `<p class="small muted">Seus dados do cadastro já estão preenchidos. Confira e envie.</p>` : '<p class="small muted">Cadastro rápido: leva menos de um minuto.</p>'}
        <label class="field"><span>Nome completo <b class="req">*</b></span><input class="input" id="pi-nome" autocomplete="name" value="${v('nome')}"></label>
        <label class="field"><span>E-mail <b class="req">*</b></span><input class="input" type="email" id="pi-email" autocomplete="email" placeholder="seu@email.com" value="${v('email')}"></label>
        <label class="field"><span>WhatsApp <b class="req">*</b></span><input class="input" type="tel" id="pi-tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" maxlength="16" value="${v('telefone')}"></label>
        <label class="field"><span>Data de nascimento <b class="req">*</b></span><input class="input" type="date" id="pi-nasc" value="${v('nascimento')}"></label>
        <label class="field"><span>Bairro onde mora <b class="req">*</b></span><input class="input" id="pi-bairro" list="dl-bairros" placeholder="Ex.: Éden" value="${v('bairro')}"><datalist id="dl-bairros">${BAIRROS.map((b) => `<option value="${b}">`).join('')}</datalist></label>
        <label class="field"><span>Como conheceu o Íris</span><select class="input" id="pi-como"><option value="">Escolha (opcional)</option>${COMO.map((x) => `<option${(t.comoConheceu ?? d.comoConheceu) === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
        <label class="check"><input type="checkbox" id="pi-aceite"${(t.aceite ?? d.aceite) ? ' checked' : ''}><span class="small">Aceito receber comunicações do Instituto Íris sobre novos cursos e novidades por e-mail ou WhatsApp. Posso cancelar quando quiser.</span></label>
        ${S.modal.erro ? ERR(S.modal.erro) : ''}
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">Enviar inscrição</button></div>
      </form></div></div>`;
  }
  function enviarPInsc(form) {
    const g = (id) => document.getElementById(id).value.trim();
    const t = S.modal.tmp = { curso: form.dataset.c || (document.getElementById('pi-curso')?.value || ''), nome: g('pi-nome'), email: g('pi-email').toLowerCase(), telefone: g('pi-tel'), nascimento: g('pi-nasc'), bairro: g('pi-bairro'), comoConheceu: g('pi-como'), aceite: document.getElementById('pi-aceite').checked };
    const dig = t.telefone.replace(/\D/g, '');
    const falta = [!t.curso && 'curso', !t.nome && 'nome', !okEmail(t.email) && 'e-mail válido', (dig.length < 10 || dig.length > 11) && 'WhatsApp com DDD', !t.nascimento && 'data de nascimento', !t.bairro && 'bairro'].filter(Boolean);
    S.modal.erro = falta.length ? `Preencha: ${falta.join(', ')}.` : EMAIL_ALUNOS[t.email] ? 'Este e-mail já é de um aluno. Toque em <b>Entrar</b>, na barra do site, para se inscrever pelo Portal do Aluno.' : '';
    if (S.modal.erro) return render();
    S.vis.dados = { ...t, telefone: fmtTel(dig) };
    S.vis.pedidos.push({ curso: t.curso, status: 'enviada', em: H });
    salvarVis(); S.modal = null; S.pview = 'p-cursos'; render(); try { window.scrollTo(0, 0); } catch {}
    toast('Inscrição enviada! Acompanhe aqui na aba Cursos.');
  }

  // Entrar (a "pessoinha"): só aluno e equipe.
  function modalEntrar() {
    const L = S.modal; let body;
    const voltar = '<button class="btn ghost sm" data-ent="voltar">← Voltar</button>';
    if (L.etapa === 'enviado') body = `${voltar}<h2>Confira seu e-mail</h2><p style="margin-top:6px">Enviamos um link de acesso para <b>${esc(L.email)}</b>. Toque nele para entrar. Depois disso você continua conectado(a) neste aparelho.</p>
      <button class="btn primary block" data-ent="abrir" style="margin-top:14px">Simular: abrir o link do e-mail</button><p class="small faint" style="margin-top:6px">No protótipo não chega e-mail de verdade: use o botão acima.</p>`;
    else if (!L.modo) body = `<h2>Entrar</h2><p class="muted small" style="margin:4px 0 14px">Como você quer entrar?</p><div class="stack">
      <button class="choice" data-ent="aluno"><span class="ic">${icon('book')}</span><span class="grow"><b>Sou aluno</b><small>Ver minhas aulas, frequência e avisos</small></span></button>
      <button class="choice" data-ent="equipe"><span class="ic">${icon('check')}</span><span class="grow"><b>Sou da equipe</b><small>Coordenação e professores</small></span></button>
      <button class="choice" data-ent="naoaluno"><span class="ic">${icon('plus')}</span><span class="grow"><b>Não sou aluno</b><small>Quero escolher um curso e me inscrever</small></span></button></div>`;
    else body = `${voltar}<h2>${L.modo === 'aluno' ? 'Sou aluno' : 'Sou da equipe'}</h2><p class="muted small" style="margin:4px 0 14px">${L.modo === 'aluno' ? 'Digite o e-mail que você deu na sua ficha de inscrição.' : 'Digite seu e-mail da equipe.'} Vamos enviar um link para você entrar, sem senha.</p>
      <form id="form-entrar" class="stack" novalidate><input class="input" type="email" id="ent-email" autocomplete="email" placeholder="seu@email.com" value="${esc(L.email || '')}"><button class="btn primary block">Receber link de acesso</button></form>
      ${L.erro ? `<div style="margin-top:12px">${ERR(L.erro)}</div>` : ''}
      <div class="banner" style="margin-top:12px">${icon('info')}<span><b>Protótipo.</b> Para testar: aluno <b>familia.souza@exemplo.com</b> · equipe <b>coordenacao@exemplo.com</b>.</span></div>`;
    return `<div class="backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Entrar">${body}</div></div>`;
  }
  function enviarEntrar() {
    const L = S.modal; L.email = document.getElementById('ent-email').value.trim().toLowerCase(); L.erro = '';
    if (!okEmail(L.email)) L.erro = 'Digite um e-mail válido, como nome@gmail.com.';
    else if (L.modo === 'aluno' && !EMAIL_ALUNOS[L.email]) L.erro = '<b>Este e-mail não está na ficha de nenhum aluno.</b><br>Confira se digitou certo. Se continuar dando erro, fale com a coordenação para conferir o e-mail da sua ficha.';
    else if (L.modo === 'equipe' && !EMAIL_EQUIPE.includes(L.email)) L.erro = '<b>Este e-mail não tem acesso à área da equipe.</b><br>Confira se digitou certo.';
    else L.etapa = 'enviado';
    render();
  }
  function telaEquipe() {
    return `<div class="gate"><div class="card gate-card"><div class="gate-logo">${LOGO}</div><div class="eyebrow">Área da equipe</div><h1>Olá, equipe!</h1>
      <p>No site de verdade, a tela inteira vira o <b>site de gestão</b> (Painel, Chamada, Turmas, Inscrições, Portal e Finanças) e fica salva neste aparelho.</p>
      <a class="btn primary block" href="${GESTAO_URL}" target="_blank" rel="noopener" style="text-decoration:none">Abrir o protótipo da gestão ↗</a>
      <button class="btn block" data-sair="1">Sair</button></div></div>`;
  }

  const NAV = [['inicio', 'Início', 'home'], ['aulas', 'Aulas', 'book'], ['frequencia', 'Frequência', 'check'], ['cursos', 'Cursos', 'plus'], ['mural', 'Mural', 'image'], ['oportunidades', 'Oportunid.', 'rocket']];
  const PNAV = [['p-inicio', 'Início', 'home'], ['p-cursos', 'Cursos', 'book'], ['p-sobre', 'Quem somos', 'info'], ['p-parceiros', 'Parceiros', 'heart']];
  const LONGO = { oportunidades: 'Oportunidades', cursos: 'Cursos do Íris' };
  function render() {
    const eq = S.auth?.tipo === 'equipe';
    document.body.classList.toggle('gated', eq);
    $('#gate').innerHTML = eq ? telaEquipe() : '';
    if (eq) { $('#modal-root').innerHTML = ''; return; }
    const pub = !S.auth;
    const nav = pub ? PNAV : NAV; const cur = pub ? S.pview : S.view;
    const dots = pub ? {} : { inicio: avisosAtivos(aluno()).length };
    const btn = ([id, l, ic]) => `<button class="tab${cur === id ? ' on' : ''}" data-nav="${id}" aria-current="${cur === id ? 'page' : 'false'}">${icon(ic)}<span>${l}</span>${dots[id] ? `<span class="dot num">${dots[id]}</span>` : ''}</button>`;
    const entrarTab = pub ? `<button class="tab" data-entrar="1">${icon('user')}<span>Entrar</span></button>` : '';
    $('#tabs').style.gridTemplateColumns = `repeat(${nav.length + (pub ? 1 : 0)}, 1fr)`;
    $('#tabs').innerHTML = nav.map(btn).join('') + entrarTab;
    $('#side').innerHTML = `<div class="brand">${LOGO}<small>${pub ? 'Aulas gratuitas em Éden' : 'Portal do Aluno'}</small></div>${nav.map(([id, l, ic]) => btn([id, LONGO[id] || l, ic])).join('')}${entrarTab}<div class="side-foot">${pub ? '<p class="small faint">Alunos, equipe ou quem quer se inscrever: toque em Entrar</p>' : '<button class="btn sm block" data-sair="1">Sair</button>'}</div>`;
    const V = { inicio: vInicio, aulas: vAulas, frequencia: vFrequencia, cursos: vCursos, mural: vMural, oportunidades: vOportunidades, 'p-inicio': vPInicio, 'p-cursos': vPCursos, 'p-sobre': vPSobre, 'p-parceiros': vPParceiros };
    $('#view').innerHTML = (V[cur] || (pub ? vPInicio : vInicio))();
    const M = S.modal;
    $('#modal-root').innerHTML = !M ? '' : M.tipo === 'just' ? modalJust(M.k) : M.tipo === 'insc' ? modalInsc(M.c) : M.tipo === 'pinsc' ? modalPInsc(M.c) : modalEntrar();
  }
  function toast(m) { $('#toast-root').innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => ($('#toast-root').innerHTML = ''), 3000); }

  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { if (!S.auth) { S.pview = nav.dataset.nav; S.assocEnviado = false; if (nav.dataset.depois) { render(); document.getElementById(nav.dataset.depois)?.scrollIntoView({ block: 'start' }); return; } } else { S.view = nav.dataset.nav; try { localStorage.setItem('portal:view', S.view); } catch {} } render(); try { window.scrollTo(0, 0); } catch {} return; }
    if (e.target.closest('[data-ir]')) { document.getElementById('associado')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (e.target.closest('[data-entrar]')) { S.modal = { tipo: 'entrar', modo: '', etapa: '' }; render(); return; }
    const en = e.target.closest('[data-ent]');
    if (en) {
      const v = en.dataset.ent; const L = S.modal;
      if (v === 'voltar') S.modal = { tipo: 'entrar', modo: '', etapa: '' };
      else if (v === 'naoaluno') S.modal = { tipo: 'pinsc', c: '' };
      else if (v === 'abrir') { S.auth = { tipo: L.modo, email: L.email }; gravarLS('portal:auth', S.auth); if (L.modo === 'aluno') { S.aluno = EMAIL_ALUNOS[L.email][0]; S.view = 'inicio'; } S.modal = null; try { window.scrollTo(0, 0); } catch {} }
      else { L.modo = v; L.erro = ''; }
      render(); document.getElementById('ent-email')?.focus(); return;
    }
    if (e.target.closest('[data-sair]')) { S.auth = null; gravarLS('portal:auth', null); S.pview = 'p-inicio'; render(); return; }
    const av = e.target.closest('[data-avancar]');
    if (av) { const p = S.vis.pedidos[Number(av.dataset.avancar)]; p.status = p.status === 'enviada' ? 'analise' : 'matriculado'; salvarVis(); render(); return; }
    const pi = e.target.closest('[data-pinsc]'); if (pi) { S.modal = { tipo: 'pinsc', c: pi.dataset.pinsc }; render(); return; }
    if (e.target.closest('[data-insta]')) { toast('No site de verdade, abre o Instagram @instituto__iris.'); return; }
    const op = e.target.closest('[data-op]');
    if (op) { S.opTipo = op.dataset.op; render(); return; }
    const sb = e.target.closest('[data-saber]'); if (sb) { toast(`No portal de verdade, este botão abre ${sb.dataset.saber || 'o site da inscrição'} (e o Íris conta o acesso).`); return; }
    const j = e.target.closest('[data-just]'); if (j) { S.modal = { tipo: 'just', k: j.dataset.just }; render(); document.getElementById('just-motivo')?.focus(); return; }
    const ins = e.target.closest('[data-insc]'); if (ins) { S.modal = { tipo: 'insc', c: ins.dataset.insc }; render(); return; }
    const c = e.target.closest('[data-close]'); if (c && (e.target === c || c.tagName === 'BUTTON')) { S.modal = null; render(); }
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'form-entrar') return enviarEntrar();
    if (e.target.id === 'form-pinsc') return enviarPInsc(e.target);
    if (e.target.id === 'form-assoc') {
      const g = (id) => document.getElementById(id).value.trim(); const dig = g('as-tel').replace(/\D/g, '');
      S.assocErro = !g('as-nome') ? 'Escreva seu nome.' : (dig.length < 10 || dig.length > 11) ? 'Digite um WhatsApp com DDD.' : '';
      if (!S.assocErro) S.assocEnviado = true;
      render(); document.getElementById('associado')?.scrollIntoView({ block: 'start' }); return;
    }
    if (e.target.id === 'form-just') {
      const motivo = document.getElementById('just-motivo').value.trim(); if (!motivo) return;
      const f = document.getElementById('just-arq').files[0];
      S.just[e.target.dataset.k] = { motivo, arquivo: f ? f.name : '', status: 'pendente' }; S.modal = null; render();
      toast('Justificativa enviada para a coordenação avaliar.');
    }
    if (e.target.id === 'form-insc') {
      const tel = document.getElementById('insc-tel').value.trim(); const dig = tel.replace(/\D/g, '');
      if (dig.length < 10 || dig.length > 11) { document.getElementById('insc-tel-err').hidden = false; document.getElementById('insc-tel').focus(); return; }
      const obs = document.getElementById('insc-obs').value.trim();
      S.insc[`${S.aluno}|${e.target.dataset.c}`] = { tel: fmtTel(dig), obs, status: 'pendente' }; S.modal = null; render(); toast('Inscrição enviada! A coordenação vai analisar.'); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });
  document.addEventListener('change', (e) => { if (e.target.id === 'who') { S.aluno = e.target.value; render(); } });
  render();
})();
</script>
