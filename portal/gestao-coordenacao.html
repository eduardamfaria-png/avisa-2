.backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 32, .55); display: flex; align-items: flex-end; justify-content: center; }

.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 0; background: none; color: var(--muted); }

.mural-thumb { width: 52px; height: 40px; border-radius: 8px; flex: none; object-fit: cover; background: var(--surface-2); }

.hide { display: none !important; }
.today { display: grid; gap: 10px; }

}

/* ── Ficha e tabela ── */
.modal.wide { max-width: 760px; }
.ficha-nav { position: sticky; top: -18px; z-index: 2; background: var(--surface); padding: 8px 0 10px; margin-bottom: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }

table.sheet th { position: sticky; top: 0; background: var(--surface); }
/* ── Chamada: escolher turma e lista de presença ── */
.turma-pick { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.tp { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; text-align: left; border-left: 5px solid var(--c); }
.tp:hover { border-color: var(--faint); border-left-color: var(--c); }
.tp .row { width: 100%; }
.date-chips .chip:disabled { opacity: .4; }
.roll-list { overflow: hidden; }
.roll-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; transition: background .15s; }
.roll-row.P { background: color-mix(in srgb, var(--green-soft) 60%, transparent); }
.roll-row.F { background: color-mix(in srgb, var(--red-soft) 60%, transparent); }
.roll-row.J { background: color-mix(in srgb, var(--amber-soft) 60%, transparent); }
.roll-n { width: 20px; text-align: right; font-size: 12.5px; }
.roll-name { border: 0; background: none; text-align: left; font-weight: 700; font-size: 15px; padding: 4px 0; min-width: 120px; }
.roll-btns { display: flex; gap: 6px; }
.rb { min-height: 40px; min-width: 76px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13.5px; color: var(--muted); }
.rb.j { min-width: 54px; }
.rb.p.on { background: var(--green); border-color: var(--green); color: #fff; }
.rb.f.on { background: var(--red); border-color: var(--red); color: #fff; }
.rb.j.on { background: var(--amber); border-color: var(--amber); color: #fff; }
.rb:disabled { opacity: .4; cursor: not-allowed; }
@media (max-width: 520px) { .roll-btns { width: 100%; padding-left: 78px; } .rb { flex: 1; min-width: 0; } }
/* ── Tela de acesso ── */
body.gated .side, body.gated .tabs { display: none; }
body.gated .app { grid-template-columns: 1fr; }
.gate { min-height: 80vh; display: grid; place-items: center; }
.gate-card { max-width: 440px; width: 100%; padding: 32px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.gate-card h1 { font-size: 26px; font-weight: 800; }
.gate-card p { max-width: 36ch; }
.gate-logo svg { display: block; }
.who { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); }
.who img { border-radius: 50%; flex: none; }
.who b { color: var(--ink); }
.mobile-who { font-size: 12.5px; margin: -8px 0 0; }
@media (min-width: 960px) { .mobile-who { display: none; } }
/* ── Logo oficial ── */
.logo-img { display: block; height: 52px; width: auto; background: #fff; border-radius: 10px; padding: 3px 6px; }
.brand-side { flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.brand-side .logo-img { height: auto; width: 100%; max-width: 184px; padding: 6px 10px; }
.brand-side small { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.gate-logo .logo-img { height: auto; width: 220px; max-width: 100%; padding: 8px 12px; }
</style>

  const LOGO = `<img class="logo-img" src="${LOGO_SRC}" alt="Instituto Íris">`;

  // ───────────── Estado ─────────────
  const COLS = ['alunos', 'turmas', 'chamadas', 'lancamentos', 'avisos', 'mural', 'oportunidades', 'justificativas', 'pedidos'];
  // Situação de cada pessoa no instituto (inscrição e aluno são o mesmo cadastro).
  const SIT = { matriculado: ['Matriculado', 'green'], inscrito: ['Aguardando vaga', 'gold'], formado: ['Formado', 'navy'], desistiu: ['Desistiu', 'red'], saiu: ['Saiu do curso', ''] };
  const sit = (a) => ({ ativo: 'matriculado', inativo: 'saiu' }[a?.status] || (SIT[a?.status] ? a.status : 'matriculado'));
  const isAtivo = (a) => sit(a) === 'matriculado';
  const sitPill = (a) => `<span class="pill ${SIT[sit(a)][1]}">${SIT[sit(a)][0]}</span>`;
  const S = {
    mode: 'loading', // loading | db | local
    data: Object.fromEntries(COLS.map((c) => [c, {}])),
    loaded: new Set(),
    slow: false,
    canWrite: true,
    canUpload: false,
    view: 'painel',
    alunosQ: '', alunosTurma: '', alunosStatus: 'todos', qOpen: false, inscQ: '', qDraft: {}, alunosBairro: '', alunosFaixa: '', alunosIncompletos: false, alunosModo: 'lista',
    calMes: ym(new Date()), calDia: ymd(new Date()),
    finMes: ym(new Date()), portalSub: 'avisos',
    chamada: { turmaId: '', data: today(), registros: {}, key: '', dirty: false, rev: 0, status: '' },
    confirm: null,
    me: null,
    gate: '',
    platform: 'claude',
    canFinance: true,
    login: { email: '', sent: '', busy: false, needEmail: false, error: '' },
  };
  try { const v = localStorage.getItem('iris:view'); if (v) S.view = v === 'alunos' ? 'inscricoes' : v; const m = localStorage.getItem('iris:alunosModo'); if (m) S.alunosModo = m; } catch {}

  let db = null, assets = null, downloads = null, backend = null;

  const list = (col) => Object.entries(S.data[col]).map(([id, d]) => ({ id, ...d }));
  const get = (col, id) => (S.data[col][id] ? { id, ...S.data[col][id] } : null);
  const turmasList = () => list('turmas').sort(sortByName);
  const alunosList = () => list('alunos').sort(sortByName);
  const alunosDaTurma = (tid) => alunosList().filter((a) => isAtivo(a) && (a.turmaIds || []).includes(tid));
  const fotoSrc = (a) => {
    if (!a) return '';
    if (S.platform === 'firebase') return S.data.fotos?.[a.id]?.data || '';
    return a.fotoId ? '/_blob/' + encodeURIComponent(a.fotoId) : '';
  };
  const avatar = (a, size = 40) => {
    const src = fotoSrc(a);
    const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px;background:hsl(${hueOf(a?.nome)} 45% 38%)`;
    return `<span class="avatar" style="${st}">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${src ? '' : esc(initials(a?.nome))}</span>`;
  };

  // ───────────── Persistência ─────────────
  // Grava no banco e já reflete na tela (o retorno do banco confirma em seguida).
  async function put(col, id, body) {
    if (S.mode === 'db') await db.collection(col).doc(id).set(body);
    S.data[col] = { ...S.data[col], [id]: body }; schedule();
  }
  async function patch(col, id, body) {
    if (S.mode === 'db') await db.collection(col).doc(id).update(body);
    S.data[col] = { ...S.data[col], [id]: { ...S.data[col][id], ...body } }; schedule();
  }
  async function del(col, id) {
    if (S.mode === 'db') await db.collection(col).doc(id).delete();
    const next = { ...S.data[col] }; delete next[id]; S.data[col] = next; schedule();
  }
  async function guard(fn, ok) {
    if (!S.canWrite) return toast('Você tem acesso só para ver. Peça acesso de edição a quem administra a página.');
    try { await fn(); if (ok) toast(ok); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' && S.mode === 'db') { S.canWrite = false; schedule(); toast('Esta conta não pode salvar alterações aqui.'); }
      else if (code === 'quota_exceeded') toast('O espaço de dados ficou cheio. Apague registros antigos para continuar.');
      else toast('Não foi possível salvar. Verifique a conexão e tente de novo.');
      return false;
    }
  }

  // ───────────── Cálculos ─────────────
  function freqStats(sinceYmd) {
    const st = {};
    for (const c of list('chamadas')) {
      if (sinceYmd && c.data < sinceYmd) continue;
      for (const [aid, v] of Object.entries(c.registros || {})) {
        const s = (st[aid] ||= { total: 0, pres: 0, faltas: 0, just: 0 });
        s.total++;
        if (v === 'P') s.pres++;
        else if (v === 'J') { s.just++; }
        else if (v === 'F') s.faltas++;
      }
    }
    for (const s of Object.values(st)) s.rate = s.total ? (s.pres + s.just) / s.total : null;
    return st;
  }
  function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); }

  // ───────────── Ficha do aluno (banco de dados) ─────────────
  // Cada campo: [chave, rótulo, tipo, opções?, largura total?]
  const FICHA = [
    ['Dados pessoais', [
      ['nome', 'Nome completo', 'text', null, 1],
      ['nascimento', 'Data de nascimento', 'date'],
      ['genero', 'Gênero', 'select', ['Feminino', 'Masculino', 'Não binário', 'Prefere não dizer']],
      ['corRaca', 'Cor ou raça (IBGE)', 'select', ['Preta', 'Parda', 'Branca', 'Amarela', 'Indígena', 'Prefere não dizer']],
      ['cpf', 'CPF', 'text'],
    ]],
    ['Contato e endereço', [
      ['telefone', 'Telefone / WhatsApp', 'tel'],
      ['email', 'E-mail', 'email'],
      ['cep', 'CEP (preenche o endereço)', 'cep'],
      ['endereco', 'Rua / avenida', 'text'],
      ['numero', 'Número', 'text'],
      ['complemento', 'Complemento', 'text'],
      ['bairro', 'Bairro', 'text'],
      ['cidade', 'Cidade', 'text'],
      ['uf', 'Estado (UF)', 'text'],
    ]],
    ['Responsável (menores de 18)', [
      ['responsavel', 'Nome do responsável', 'text', null, 1],
      ['parentesco', 'Parentesco', 'select', ['Mãe', 'Pai', 'Avó / Avô', 'Tia / Tio', 'Irmã / Irmão', 'Outro']],
      ['telefoneResp', 'Telefone do responsável', 'tel'],
      ['cpfResp', 'CPF do responsável', 'text'],
    ]],
    ['Escola, trabalho e benefício', [
      ['escolaridade', 'Escolaridade', 'select', ['Não alfabetizado', 'Fundamental incompleto', 'Fundamental completo', 'Médio incompleto', 'Médio completo', 'Superior incompleto', 'Superior completo']],
      ['serie', 'Série / ano', 'text'],
      ['turnoEscola', 'Turno da escola', 'select', ['Manhã', 'Tarde', 'Noite', 'Integral', 'Não estuda']],
      ['trabalha', 'Trabalha?', 'select', ['Não', 'Sim, com carteira', 'Sim, informal', 'Procurando emprego']],
      ['beneficio', 'Recebe benefício social?', 'select', ['Nenhum', 'Bolsa Família', 'BPC', 'Outro']],
    ]],
    ['Saúde e inclusão', [
      ['deficiencia', 'Deficiência ou neurodivergência', 'select', ['Não', 'Física', 'Visual', 'Auditiva', 'Intelectual', 'TEA (autismo)', 'TDAH', 'Múltipla', 'Outra']],
      ['alergias', 'Alergias', 'text'],
      ['medicacao', 'Medicação contínua', 'text'],
      ['necessidades', 'Cuidados ou adaptações necessárias', 'textarea', null, 1],
      ['emergenciaNome', 'Contato de emergência', 'text'],
      ['emergenciaTel', 'Telefone de emergência', 'tel'],
    ]],
    ['Autorizações', [
      ['autorizaImagem', 'Autoriza uso de imagem?', 'select', ['Pendente', 'Sim', 'Não']],
      ['termoAssinado', 'Ficha / termo assinado?', 'select', ['Pendente', 'Sim']],
      ['aceitaComunicacoes', 'Aceito receber comunicações do Instituto Íris sobre novos cursos, novidades e conteúdos por e-mail, WhatsApp ou SMS. Posso cancelar quando quiser.', 'consent', null, 1],
    ]],
    ['No instituto', [
      ['__turmas', 'Turmas', 'turmas', null, 1],
      ['matriculaEm', 'Matriculado em', 'date'],
      ['status', 'Situação', 'select', ['matriculado:Matriculado (cursando)', 'inscrito:Aguardando vaga', 'formado:Formado', 'desistiu:Desistiu', 'saiu:Saiu do curso']],
      ['saidaEm', 'Data da formatura ou saída', 'date'],
      ['comoConheceu', 'Como conheceu o instituto', 'select', ['Instagram', 'Indicação', 'WhatsApp', 'Escola', 'Na rua / evento', 'Outro']],
      ['obs', 'Observações', 'textarea', null, 1],
    ]],
  ];
  const FICHA_FIELDS = FICHA.flatMap(([, fs]) => fs).filter((f) => !f[0].startsWith('__'));
  // Campos que contam para "ficha completa".
  function missingFields(a) {
    const keys = ['nascimento', 'genero', 'corRaca', 'telefone', 'endereco', 'bairro', 'emergenciaTel'];
    const miss = keys.filter((k) => !String(a[k] ?? '').trim());
    if (!a.autorizaImagem || a.autorizaImagem === 'Pendente') miss.push('autorizaImagem');
    const idade = age(a.nascimento);
    if (idade != null && idade < 18 && !String(a.responsavel || '').trim()) miss.push('responsavel');
    if (!(a.turmaIds || []).length) miss.push('__turmas');
    return miss;
  }
  const fieldLabel = (k) => (k === '__turmas' ? 'Turma' : FICHA_FIELDS.find((f) => f[0] === k)?.[1] || k);
  const FAIXAS = [['Até 12 anos', 0, 12], ['13 a 17', 13, 17], ['18 a 29', 18, 29], ['30 a 59', 30, 59], ['60 ou mais', 60, 200]];
  const faixa = (a) => { const i = age(a.nascimento); if (i == null) return 'Sem data'; return FAIXAS.find(([, lo, hi]) => i >= lo && i <= hi)[0]; };

  // ───────────── Render ─────────────
  let raf = 0;
  function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

  const NAV = [
    ['painel', 'Painel', 'home'],
    ['chamada', 'Chamada', 'check'],
    ['turmas', 'Turmas', 'book'],
    ['inscricoes', 'Inscrições', 'form'],
    ['portal', 'Portal', 'mega'],
    ['financas', 'Finanças', 'cash'],
  ];

  function renderNav() {
    const dots = { inscricoes: alunosList().filter((a) => sit(a) === 'inscrito').length + pendentes('pedidos').length, portal: pendentes('justificativas').length };
    const btn = (id, label, ic) => `<button class="tab${S.view === id ? ' on' : ''}" data-act="nav" data-v="${id}" aria-current="${S.view === id ? 'page' : 'false'}">${icon(ic)}<span>${label}</span>${dots[id] ? `<span class="dot num">${dots[id]}</span>` : ''}</button>`;
    const nav = NAV.filter(([id]) => id !== 'financas' || S.canFinance);
    $('#tabs').style.gridTemplateColumns = `repeat(${nav.length}, 1fr)`;
    $('#tabs').innerHTML = nav.map((n) => btn(...n)).join('');
    $('#side').innerHTML = `<div class="brand brand-side">${LOGO}<small>Gestão das aulas</small></div>${nav.map((n) => btn(...n)).join('')}<div class="side-foot">${S.me && S.me.name ? `<div class="who">${S.me.avatarUrl ? `<img src="${esc(S.me.avatarUrl)}" alt="" width="28" height="28">` : ''}<span><b>${esc(S.me.name)}</b><br>conectado(a)</span></div>` : ''}${S.platform === 'firebase' ? `<div class="row" style="gap:6px;margin-bottom:10px"><button class="btn sm" data-act="equipe">Equipe</button><button class="btn sm ghost" data-act="sair">Sair</button></div>` : ''}${S.mode === 'db' ? 'Dados salvos e compartilhados com a equipe.' : S.mode === 'local' ? (S.demo ? 'Versão de teste: nada é salvo.' : 'Visualização local: nada é salvo.') : 'Carregando…'}</div>`;
  }

  function header(eyebrow, title, sub, actions = '') {
    return `<div class="mobile-head brand">${LOGO}<div><b>Gestão das aulas</b><small>Aulas gratuitas em Éden</small></div></div>
      ${S.me && S.me.name ? `<div class="who mobile-who">${S.me.avatarUrl ? `<img src="${esc(S.me.avatarUrl)}" alt="" width="24" height="24">` : ''}<span class="grow">${esc(S.me.name)}</span>${S.platform === 'firebase' ? '<button class="btn sm ghost" data-act="equipe">Equipe</button><button class="btn sm ghost" data-act="sair">Sair</button>' : ''}</div>` : ''}
      <div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="row wrapx">${actions}</div>` : ''}</div>`;
  }

  function notices() {
    let out = '';
    if (S.mode === 'local') out += S.demo
      ? `<div class="banner">${icon('info')}<span><b>Versão de teste com dados de exemplo.</b> Pode mexer à vontade: nada do que você fizer é salvo, e ao recarregar tudo volta ao início.</span></div>`
      : `<div class="banner">${icon('info')}<span><b>Visualização local com dados de exemplo.</b> Abra pelo link do Claude para salvar e compartilhar com a equipe.</span></div>`;
    if (S.mode === 'db' && S.slow && S.loaded.size < COLS.length) out += `<div class="banner">${icon('info')}<span>Os dados estão demorando para carregar. O que aparece pode estar desatualizado.</span></div>`;
    if (S.mode === 'db' && !S.canWrite) out += `<div class="banner">${icon('info')}<span>Você está vendo sem permissão de edição. Para registrar chamadas e cadastros, peça acesso de Colaborador ou Editor.</span></div>`;
    const ex = COLS.some((c) => Object.values(S.data[c]).some((d) => d.exemplo));
    if (S.mode === 'db' && ex) out += `<div class="banner">${icon('info')}<span class="grow">Há <b>dados de exemplo</b> misturados aos seus. Apague quando terminar de testar.</span>${confirmBtn('apagar-exemplos', 'Apagar exemplos', 'Confirmar: apagar exemplos', 'btn sm')}</div>`;
    return out;
  }

  function confirmBtn(key, label, confirmLabel, cls) {
    const on = S.confirm === key;
    return `<button class="${cls}${on ? ' danger' : ''}" data-act="confirm" data-key="${key}">${on ? confirmLabel : label}</button>`;
  }

  function loginScreen() {
    const L = S.login;
    let body;
    if (L.sent) body = `<p>Enviamos um link de acesso para <b>${esc(L.sent)}</b>.</p><p class="muted small">Abra seu e-mail (veja também o spam) e toque no link. Ele entra direto no sistema.</p><button class="btn ghost sm" data-act="login-reset">Usar outro e-mail</button>`;
    else body = `<p>${L.needEmail ? 'Confirme seu e-mail para terminar a entrada.' : 'Digite seu e-mail. Vamos enviar um link para você entrar, sem senha.'}</p>
      <form class="stack" style="width:100%" data-form="login"><input class="input" type="email" id="login-email" autocomplete="email" placeholder="seu@email.com" value="${esc(L.email)}" required>
      <button class="btn primary block" type="submit" ${L.busy ? 'disabled' : ''}>${L.busy ? 'Enviando…' : L.needEmail ? 'Entrar' : 'Receber link de acesso'}</button></form>
      ${L.needEmail ? '' : `<div class="faint small">ou</div><button class="btn block" data-act="login-google">Entrar com Google</button>`}`;
    return `<div class="gate"><div class="card gate-card">
      <div class="gate-logo">${LOGO}</div>
      <div class="eyebrow">Gestão das aulas</div>
      <h1>Entrar</h1>${body}
      ${L.error ? `<div class="banner" style="text-align:left">${esc(L.error)}</div>` : ''}
      <p class="faint small" style="margin-top:6px">Acesso só para a equipe do instituto.</p>
    </div></div>`;
  }

  function gateScreen() {
    if (S.gate === 'login') return loginScreen();
    if (S.gate === 'loading') return `<div class="gate"><div class="card gate-card"><div class="gate-logo">${LOGO}</div><p class="muted">Carregando…</p></div></div>`;
    if (S.gate === 'erro') return `<div class="gate"><div class="card gate-card"><h1>Não foi possível conectar</h1><p class="muted">${esc(S.login.error || 'Verifique a internet e recarregue a página.')}</p></div></div>`;
    const nome = S.me && S.me.name;
    const negado = S.gate === 'denied';
    return `<div class="gate"><div class="card gate-card">
      <div class="gate-logo">${LOGO}</div>
      <div class="eyebrow">Gestão das aulas</div>
      <h1>Acesso restrito à equipe</h1>
      ${negado
        ? `<p>${nome ? `Você entrou como <b>${esc(nome)}</b>, mas esta conta` : 'Esta conta'} ainda não tem permissão para ver os dados dos alunos.</p>
           <p class="muted small">Peça à coordenação do instituto para liberar seu acesso. Depois, abra este link de novo.</p>
           ${S.platform === 'firebase' ? '<button class="btn" data-act="sair">Sair e usar outro e-mail</button>' : ''}`
        : `<p>Para entrar, use a conta Claude que a coordenação autorizou.</p>
           <p class="muted small">Se você já entrou e continua vendo esta tela, sua conta ainda não foi liberada. Fale com a coordenação.</p>
           <a class="btn primary" href="https://claude.ai/login" target="_blank" rel="noopener">Entrar com minha conta</a>`}
      <p class="faint small" style="margin-top:6px">Os dados dos alunos são protegidos e só aparecem para pessoas autorizadas.</p>
    </div></div>`;
  }

  function render() {
    // Preserva foco e cursor de campos da página principal.
    const ae = document.activeElement;
    const keep = ae && ae.id && $('#view').contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
    document.body.classList.toggle('gated', !!S.gate);
    if (S.gate) { $('#view').innerHTML = gateScreen(); return; }
    renderNav();
    if (S.mode === 'loading' || (S.mode === 'db' && S.loaded.size < COLS.length && !S.slow)) {
      $('#view').innerHTML = header('Instituto Íris', 'Carregando dados…', 'Buscando alunos, turmas e chamadas.');
      return;
    }
    if (S.view === 'financas' && !S.canFinance) S.view = 'painel';
    const v = { painel: vPainel, chamada: vChamada, turmas: vTurmas, inscricoes: vInscricoes, portal: vPortal, financas: vFinancas }[S.view] || vPainel;
    $('#view').innerHTML = v();
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch {} } }
  }

  // ───────────── Painel ─────────────
  function countBy(arr, fn) { const m = new Map(); for (const x of arr) { const k = fn(x) || 'Não informado'; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); }
  function barList(rows, total, max = 6) {
    if (!rows.length) return '<p class="small muted">Sem dados ainda.</p>';
    const top = rows.slice(0, max); const rest = rows.slice(max).reduce((n, r) => n + r[1], 0);
    if (rest) top.push(['Outros', rest]);
    const peak = Math.max(...top.map((r) => r[1]));
    return `<div class="stack" style="gap:9px">${top.map(([k, n]) => `<div><div class="row small"><span class="grow"${k === 'Não informado' || k === 'Sem data' ? ' style="color:var(--faint)"' : ''}>${esc(k)}</span><b class="num">${n}</b><span class="faint num" style="min-width:38px;text-align:right">${Math.round((n / total) * 100)}%</span></div><div class="meter" style="margin-top:4px"><i style="width:${(n / peak) * 100}%"></i></div></div>`).join('')}</div>`;
  }

  function calendar() {
    const [y, mo] = S.calMes.split('-').map(Number);
    const first = new Date(y, mo - 1, 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const turmas = turmasList();
    const hoje = today();
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      if (i >= 35 && d.getMonth() !== mo - 1) break;
      const key = ymd(d); const out = d.getMonth() !== mo - 1;
      const aulas = turmas.filter((t) => (t.dias || []).includes(d.getDay()));
      const feitas = aulas.filter((t) => S.data.chamadas[`${t.id}_${key}`]).length;
      cells += `<button class="cal-day${out ? ' out' : ''}${key === hoje ? ' today' : ''}${key === S.calDia ? ' sel' : ''}" data-act="cal-dia" data-d="${key}" aria-label="${fmtLong(key)}: ${aulas.length} aulas">
        <span class="cal-n num">${d.getDate()}</span>
        <span class="cal-dots">${aulas.slice(0, 4).map((t) => `<i style="background:${esc(t.cor || '#1c2d6b')}"></i>`).join('')}</span>
        ${aulas.length && feitas === aulas.length && key <= hoje ? '<span class="cal-ok">✓</span>' : ''}
        <span class="cal-names">${aulas.slice(0, 3).map((t) => `<em style="--c:${esc(t.cor || '#1c2d6b')}">${esc(t.nome)}</em>`).join('')}${aulas.length > 3 ? `<em>+${aulas.length - 3}</em>` : ''}</span>
      </button>`;
    }
    const sel = S.calDia; const selDow = parseYmd(sel).getDay();
    const aulasSel = turmas.filter((t) => (t.dias || []).includes(selDow)).sort((a, b) => String(a.horario).localeCompare(String(b.horario)));
    return `<section class="card pad">
      <div class="section-title"><h2>Calendário de aulas</h2><div class="row" style="gap:2px"><button class="icon-btn" data-act="cal-prev" aria-label="Mês anterior">${icon('left')}</button><b style="min-width:92px;text-align:center">${monthLabel(S.calMes)}</b><button class="icon-btn" data-act="cal-next" aria-label="Próximo mês">${icon('right')}</button></div></div>
      <div class="cal-grid">${DIAS.map((d) => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      <div class="legend wrapx" style="margin-top:10px">${turmas.map((t) => `<span><i style="background:${esc(t.cor || '#1c2d6b')}"></i>${esc(t.nome)}</span>`).join('')}</div>
      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
        <div class="section-title" style="margin-bottom:8px"><h2 style="font-size:16px">${fmtLong(sel).replace(/^./, (c) => c.toUpperCase())}</h2><span>${plural(aulasSel.length, 'aula', 'aulas')}</span></div>
        ${aulasSel.length ? `<div class="today">${aulasSel.map((t) => lessonRow(t, sel)).join('')}</div>` : '<p class="small muted">Nenhuma aula neste dia.</p>'}
      </div>
    </section>`;
  }

  function lessonRow(t, dia) {
    const c = get('chamadas', `${t.id}_${dia}`);
    const n = alunosDaTurma(t.id).length;
    const pres = c ? Object.values(c.registros || {}).filter((v) => v === 'P').length : 0;
    const futuro = dia > today();
    return `<div class="lesson"><span class="time">${esc(t.horario || '--:--')}${t.horarioFim ? `<small class="time-end">até ${esc(t.horarioFim)}</small>` : ''}</span><span class="dotc" style="background:${esc(t.cor || '#1c2d6b')}"></span>
      <div class="grow"><b>${esc(t.nome)}</b><div class="small muted">${plural(n, 'aluno', 'alunos')}${t.professor ? ' · ' + esc(t.professor) : ''}</div></div>
      ${c ? `<button class="pill green num" style="border:0" data-act="go-chamada" data-t="${t.id}" data-d="${dia}">${pres}/${n} presentes</button>` : futuro ? '<span class="pill">agendada</span>' : `<button class="btn sm primary" data-act="go-chamada" data-t="${t.id}" data-d="${dia}">Fazer chamada</button>`}</div>`;
  }

  function vPainel() {
    const alunos = alunosList();
    const ativos = alunos.filter(isAtivo);
    const formados = alunos.filter((a) => sit(a) === 'formado').length;
    const saidas = alunos.filter((a) => sit(a) === 'desistiu' || sit(a) === 'saiu').length;
    const mesAtual = new Date().getMonth();
    const mes = ym(new Date());
    const novosMes = alunos.filter((a) => (a.matriculaEm || '').startsWith(mes)).length;
    const st30 = freqStats(daysAgo(30));
    const vals = Object.values(st30).filter((s) => s.total);
    const media = vals.length ? vals.reduce((n, s) => n + s.pres + s.just, 0) / vals.reduce((n, s) => n + s.total, 0) : null;
    const novas = alunos.filter((a) => sit(a) === 'inscrito').length;
    const turmas = turmasList();

    const vazio = !turmas.length && !alunos.length;
    const comeco = vazio ? `
      <div class="card pad start">
        <div class="grow"><h2 style="font-size:19px">Comece por aqui</h2>
          <div class="steps" style="margin-top:10px"><div>Crie as turmas (curso, dias e horário)</div><div>Cadastre os alunos com a ficha completa</div><div>Faça a chamada em cada aula</div></div></div>
        <div class="stack" style="min-width:220px"><button class="btn primary" data-act="turma-new">${icon('plus')}Criar primeira turma</button>
          ${S.mode === 'db' && S.canWrite ? `<button class="btn" data-act="seed">Ver com dados de exemplo</button><span class="small muted">Os exemplos podem ser apagados depois com um botão.</span>` : ''}</div>
      </div>` : '';

    const vagas = turmas.reduce((n, t) => n + Math.max(0, (Number(t.capacidade) || 0) - alunosDaTurma(t.id).length), 0);
    const aniversariantes = ativos.filter((a) => a.nascimento && parseYmd(a.nascimento).getMonth() === mesAtual).sort((a, b) => parseYmd(a.nascimento).getDate() - parseYmd(b.nascimento).getDate());
    const incompletas = ativos.map((a) => ({ a, miss: missingFields(a) })).filter((x) => x.miss.length).sort((x, y) => y.miss.length - x.miss.length);
    const completas = ativos.length - incompletas.length;
    const stAll = freqStats();
    const baixa = ativos.map((a) => ({ a, s: stAll[a.id] })).filter((x) => x.s && x.s.total >= 4 && x.s.rate < 0.75).sort((x, y) => x.s.rate - y.s.rate).slice(0, 5);
    const pcd = ativos.filter((a) => a.deficiencia && a.deficiencia !== 'Não').length;
    const semImagem = ativos.filter((a) => a.autorizaImagem === 'Não').length;
    const beneficio = ativos.filter((a) => a.beneficio && a.beneficio !== 'Nenhum').length;
    const recentes = alunos.slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm))).slice(0, 4);

    return header(fmtLong(today()), 'Painel', '') + notices() + comeco + `
      <div class="kpis">
        <div class="card kpi hl"><span>Alunos ativos</span><b>${ativos.length}</b><small>${alunos.length} no banco · ${formados} ${formados === 1 ? 'formado' : 'formados'} · ${saidas} saíram</small></div>
        <div class="card kpi"><span>Novas matrículas</span><b>${novosMes}</b><small>em ${MESES[mesAtual]}</small></div>
        <div class="card kpi"><span>Frequência média</span><b style="color:${media != null && media < 0.75 ? 'var(--red)' : 'inherit'}">${pct(media)}</b><small>últimos 30 dias</small></div>
        <div class="card kpi"><span>Aguardando vaga</span><b>${novas}</b><small>inscritos ainda sem turma</small></div>
      </div>
      <div class="minis">
        <div><b class="num">${turmas.length}</b><span>${turmas.length === 1 ? 'turma' : 'turmas'}</span></div>
        <div><b class="num">${vagas}</b><span>vagas livres</span></div>
        <div><b class="num">${pcd}</b><span>com deficiência ou neurodivergência</span></div>
        <div><b class="num">${aniversariantes.length}</b><span>aniversariantes em ${MESES[mesAtual]}</span></div>

        <div><b class="num">${ativos.length ? Math.round((completas / ativos.length) * 100) : 0}%</b><span>fichas completas</span></div>
      </div>
      <div class="grid2">
        ${calendar()}
        <section class="stack" style="gap:18px">
          ${justCard()}
          <div>
            <div class="section-title"><h2>Fichas incompletas</h2><span>${plural(incompletas.length, 'aluno', 'alunos')}</span></div>
            <div class="card list">${incompletas.length ? incompletas.slice(0, 5).map(({ a, miss }) => `<button class="item" data-act="aluno-open" data-id="${a.id}">${avatar(a, 36)}<div class="grow"><strong>${esc(a.nome)}</strong><span class="sub">Falta: ${miss.slice(0, 3).map(fieldLabel).join(', ')}${miss.length > 3 ? ` e mais ${miss.length - 3}` : ''}</span></div><span class="pill amber num">${miss.length}</span></button>`).join('') + (incompletas.length > 5 ? `<button class="item small" data-act="alunos-incompletos" style="justify-content:center;color:var(--navy);font-weight:700">Ver todos os ${incompletas.length}</button>` : '') : '<div class="pad small muted">Todas as fichas dos alunos ativos estão completas.</div>'}</div>

          </div>
          <div>

            <div class="card list">${aniversariantes.length ? aniversariantes.slice(0, 6).map((a) => `<button class="item" data-act="aluno-open" data-id="${a.id}">${avatar(a, 32)}<div class="grow"><strong>${esc(a.nome)}</strong></div><span class="pill gold num">dia ${parseYmd(a.nascimento).getDate()}</span></button>`).join('') : '<div class="pad small muted">Nenhum aniversariante este mês.</div>'}</div>
          </div>
        </section>
      </div>
      <section>
        <div class="section-title"><h2>Quem são os alunos</h2><span>${plural(ativos.length, 'aluno ativo', 'alunos ativos')}</span></div>
        <div class="profile-grid">
          <div class="card pad"><h3 class="ph">Faixa etária</h3>${barList(countBy(ativos, faixa).sort((a, b) => FAIXAS.findIndex((f) => f[0] === a[0]) - FAIXAS.findIndex((f) => f[0] === b[0])), ativos.length, 7)}</div>
          <div class="card pad"><h3 class="ph">Bairro</h3>${barList(countBy(ativos, (a) => (a.bairro || '').trim()), ativos.length)}</div>
          <div class="card pad"><h3 class="ph">Gênero</h3>${barList(countBy(ativos, (a) => a.genero), ativos.length)}</div>
          <div class="card pad"><h3 class="ph">Cor ou raça</h3>${barList(countBy(ativos, (a) => a.corRaca), ativos.length)}</div>
          <div class="card pad"><h3 class="ph">Escolaridade</h3>${barList(countBy(ativos, (a) => a.escolaridade), ativos.length)}</div>
          <div class="card pad"><h3 class="ph">Benefício social</h3>${barList(countBy(ativos, (a) => a.beneficio), ativos.length)}</div>
        </div>
        ${semImagem ? `<p class="small muted" style="margin-top:10px">${plural(semImagem, 'aluno não autoriza', 'alunos não autorizam')} uso de imagem — cuidado ao postar fotos das aulas.</p>` : ''}
      </section>
      <div class="grid2">
        <section>
          <div class="section-title"><h2>Alunos por turma</h2><span>vagas ocupadas</span></div>
          <div class="card pad stack">${turmas.map((t) => {
            const n = alunosDaTurma(t.id).length, cap = Number(t.capacidade) || 0;
            const r = cap ? Math.min(1, n / cap) : 0;
            return `<div><div class="row small"><span class="dotc" style="background:${esc(t.cor || '#1c2d6b')}"></span><b class="grow">${esc(t.nome)}</b><span class="num muted">${n}${cap ? ' / ' + cap : ''}</span></div>
              <div class="meter${r >= 1 ? ' gold' : ''}" style="margin-top:6px"><i style="width:${cap ? Math.round(r * 100) : 0}%"></i></div></div>`;
          }).join('') || '<span class="muted">Nenhuma turma.</span>'}</div>
        </section>
        <section>
          <div class="section-title"><h2>Inscrições recentes</h2><button class="btn sm ghost" data-act="nav" data-v="inscricoes">Ver todas</button></div>
          <div class="card list">${recentes.length ? recentes.map((a) => `<button class="item" data-act="aluno-open" data-id="${a.id}">${avatar(a, 32)}<div class="grow"><strong>${esc(a.nome)}</strong><span class="sub">Inscrito em ${fmtDate((a.criadoEm || '').slice(0, 10))}</span></div>${sitPill(a)}</button>`).join('') : `<div class="pad muted small">Nenhuma inscrição ainda.</div>`}</div>
        </section>
      </div>`;
  }

  // ───────────── Chamada ─────────────
  // Datas de aula de uma turma (pelos dias da semana cadastrados).
  function classDates(t, fromYmd, n, dir) {
    const out = []; const dias = t.dias || [];
    if (!dias.length) return out;
    const d = parseYmd(fromYmd);
    for (let i = 0; i < 400 && out.length < n; i++) {
      if (dias.includes(d.getDay())) out.push(ymd(d));
      d.setDate(d.getDate() + dir);
    }
    return out;
  }
  // Data padrão ao abrir a chamada: hoje, se tem aula; senão a última aula que já passou.
  function defaultClassDate(t) {
    const hoje = today();
    if ((t.dias || []).includes(new Date().getDay())) return hoje;
    return classDates(t, hoje, 1, -1)[0] || hoje;
  }

  function openChamada(turmaId, data) {
    flushChamada();
    const t = get('turmas', turmaId); if (!t) return;
    S.chamada = { turmaId, data: data || defaultClassDate(t), registros: {}, key: '', dirty: false, rev: 0, status: '' };
    S.view = 'chamada'; render(); window.scrollTo?.(0, 0);
  }

  function syncChamadaDraft() {
    const ch = S.chamada;
    const key = `${ch.turmaId}_${ch.data}`;
    if (ch.key !== key) {
      ch.key = key; ch.registros = { ...(get('chamadas', key)?.registros || {}) }; ch.dirty = false; ch.status = '';
    } else if (!ch.dirty) {
      ch.registros = { ...(get('chamadas', key)?.registros || {}) };
    }
  }

  function vChamadaTurmas() {
    const turmas = turmasList();
    const hoje = today(); const dow = new Date().getDay();
    if (!turmas.length) return header('Frequência', 'Chamada', '') + notices() + `<div class="empty card"><h3>Nenhuma turma ainda</h3><p>Crie uma turma e cadastre os alunos para fazer a chamada.</p><button class="btn primary" data-act="turma-new">${icon('plus')}Criar turma</button></div>`;
    const ordered = [...turmas].sort((a, b) => Number((b.dias || []).includes(dow)) - Number((a.dias || []).includes(dow)) || String(a.horario).localeCompare(String(b.horario)) || sortByName(a, b));
    return header('Frequência', 'Chamada', 'Escolha a turma para marcar a presença dos alunos.') + notices() + `
      <div class="turma-pick">${ordered.map((t) => {
        const n = alunosDaTurma(t.id).length;
        const temHoje = (t.dias || []).includes(dow);
        const c = get('chamadas', `${t.id}_${hoje}`);
        const pres = c ? Object.values(c.registros || {}).filter((v) => v !== 'F').length : 0;
        const prox = classDates(t, hoje, 1, 1)[0];
        const status = !(t.dias || []).length ? '<span class="pill">Sem dias definidos</span>'
          : temHoje ? (c ? `<span class="pill green num">Hoje: ${pres}/${n} presentes</span>` : '<span class="pill gold">Aula hoje · chamada pendente</span>')
          : `<span class="pill">Próxima aula: ${fmtWeekday(prox)}</span>`;
        return `<button class="card tp" data-act="ch-turma" data-t="${t.id}" style="--c:${esc(t.cor || '#1c2d6b')}">
          <div class="row"><b class="grow" style="font-size:17px;font-family:var(--display)">${esc(t.nome)}</b><span class="faint">${icon('right')}</span></div>
          <span class="small muted">${(t.dias || []).map((d) => DIAS[d]).join(', ') || '—'}${horarioTxt(t) ? ' · ' + esc(horarioTxt(t)) : ''} · ${plural(n, 'aluno', 'alunos')}</span>
          ${status}
        </button>`;
      }).join('')}</div>`;
  }

  function vChamada() {
    if (!S.chamada.turmaId || !get('turmas', S.chamada.turmaId)) { S.chamada.turmaId = ''; return vChamadaTurmas(); }
    syncChamadaDraft();
    const ch = S.chamada;
    const t = get('turmas', ch.turmaId);
    const alunos = alunosDaTurma(ch.turmaId); // já em ordem alfabética
    const count = { P: 0, F: 0, J: 0 };
    for (const a of alunos) if (ch.registros[a.id]) count[ch.registros[a.id]]++;
    const sem = alunos.length - count.P - count.F - count.J;
    const diaOk = (t.dias || []).includes(parseYmd(ch.data).getDay());
    const hoje = today();
    const datas = [...classDates(t, ch.data, 4, -1).reverse(), ...classDates(t, addDays(ch.data, 1), 2, 1)].filter((d, i, arr) => arr.indexOf(d) === i);
    const saved = get('chamadas', ch.key);
    const statusTxt = ch.status === 'salvando' ? 'Salvando…' : ch.status === 'pendente' ? 'Salvando…' : ch.status === 'erro' ? '<b style="color:var(--red)">Não salvou — toque de novo</b>' : saved ? '✓ Salvo automaticamente' : 'Marque os alunos — salva sozinho';
    const futuro = ch.data > hoje;

    return `<div class="mobile-head brand">${LOGO}<div><b>Gestão das aulas</b><small>Aulas gratuitas em Éden</small></div></div>
      <button class="btn ghost sm" style="align-self:flex-start;margin-left:-8px" data-act="ch-back">${icon('left')}Todas as turmas</button>
      <div class="page-head"><div><div class="eyebrow" style="color:var(--muted)"><span class="dotc" style="display:inline-block;background:${esc(t.cor || '#1c2d6b')};margin-right:6px;vertical-align:middle"></span>${esc(t.nome)}${horarioTxt(t) ? ' · ' + esc(horarioTxt(t)) : ''}${t.professor ? ' · ' + esc(t.professor) : ''}</div>
        <h1>${fmtLong(ch.data).replace(/^./, (c) => c.toUpperCase())}</h1>
        <p>${ch.data === hoje ? 'Aula de hoje' : futuro ? 'Aula futura' : 'Aula anterior'}${diaOk ? '' : ' · <b style="color:var(--amber)">não é dia de aula desta turma</b>'}</p></div></div>
      ${notices()}
      ${(() => { const js = pendentes('justificativas').filter((j) => j.turmaId === ch.turmaId && j.data === ch.data); return js.length ? `<div class="banner">${icon('info')}<span class="grow">${plural(js.length, 'justificativa', 'justificativas')} de falta desta aula para avaliar: ${js.map((j) => esc(get('alunos', j.alunoId)?.nome || '')).join(', ')}.</span><button class="btn sm" data-act="just-open" data-id="${js[0].id}">Avaliar</button></div>` : ''; })()}
      <div class="card pad stack" style="gap:10px">
        <span class="small muted" style="font-weight:700">Dias de aula</span>
        <div class="chips date-chips">${datas.map((d) => `<button class="chip${d === ch.data ? ' on' : ''}" data-act="ch-date" data-d="${d}"${d > hoje ? ' disabled' : ''}>${d === hoje ? 'Hoje' : fmtWeekday(d)}</button>`).join('')}
          <label class="chip" style="cursor:pointer;position:relative;overflow:hidden">Outra data…<input type="date" id="ch-data" value="${esc(ch.data)}" max="${hoje}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer" aria-label="Escolher outra data"></label></div>
      </div>
      ${alunos.length ? `
      <div class="row wrapx" style="gap:8px">
        <div class="tally grow"><span class="pill green num">${plural(count.P, 'presente', 'presentes')}</span><span class="pill red num">${plural(count.F, 'falta', 'faltas')}</span>${count.J ? `<span class="pill amber num">${plural(count.J, 'justificada', 'justificadas')}</span>` : ''}${sem ? `<span class="pill num">${sem} sem marcação</span>` : ''}</div>
        <button class="btn sm" data-act="ch-all" ${futuro ? 'disabled' : ''}>Todos presentes</button>
      </div>
      <div class="card list roll-list">${alunos.map((a, i) => { const v = ch.registros[a.id] || ''; return `<div class="roll-row ${v}">
          <span class="faint num roll-n">${i + 1}</span>${avatar(a, 38)}
          <button type="button" class="grow roll-name" data-act="aluno-open" data-id="${a.id}">${esc(a.nome)}</button>
          <div class="roll-btns" role="group" aria-label="Frequência de ${esc(a.nome)}">
            <button class="rb p${v === 'P' ? ' on' : ''}" data-act="ch-set" data-id="${a.id}" data-v="P" ${futuro ? 'disabled' : ''} aria-pressed="${v === 'P'}">Presente</button>
            <button class="rb f${v === 'F' ? ' on' : ''}" data-act="ch-set" data-id="${a.id}" data-v="F" ${futuro ? 'disabled' : ''} aria-pressed="${v === 'F'}">Falta</button>
            <button class="rb j${v === 'J' ? ' on' : ''}" data-act="ch-set" data-id="${a.id}" data-v="J" ${futuro ? 'disabled' : ''} aria-pressed="${v === 'J'}" title="Falta justificada">Just.</button>
          </div></div>`; }).join('')}</div>
      <div class="savebar"><span class="grow small">${statusTxt}</span><span class="small muted num">${count.P + count.J}/${alunos.length} presentes</span></div>`
      : `<div class="empty"><h3>Nenhum aluno nesta turma</h3><p>Cadastre alunos e marque esta turma na ficha.</p><button class="btn primary" data-act="aluno-new" data-t="${t.id}">${icon('plus')}Cadastrar aluno nesta turma</button></div>`}`;
  }

  // Salvamento automático: junta toques seguidos e grava um de cada vez.
  let chTimer = 0, chSaving = null;
  function markChamada(alunoId, v) {
    const ch = S.chamada;
    ch.registros[alunoId] = ch.registros[alunoId] === v ? '' : v;
    ch.dirty = true; ch.rev = (ch.rev || 0) + 1; ch.status = 'pendente';
    clearTimeout(chTimer); chTimer = setTimeout(flushChamada, 600);
    render();
  }
  async function flushChamada() {
    clearTimeout(chTimer);
    const ch = S.chamada;
    if (!ch.dirty || !ch.turmaId) return;
    if (chSaving) { await chSaving; if (S.chamada !== ch || !ch.dirty) return; }
    const rev = ch.rev;
    const ids = alunosDaTurma(ch.turmaId).map((a) => a.id);
    const registros = Object.fromEntries(Object.entries(ch.registros).filter(([k, v]) => v && ids.includes(k)));
    const body = { turmaId: ch.turmaId, data: ch.data, registros, atualizadoEm: new Date().toISOString() };
    ch.status = 'salvando'; schedule();
    chSaving = guard(() => put('chamadas', ch.key, body));
    const ok = await chSaving; chSaving = null;
    if (!ok) { ch.status = 'erro'; schedule(); return; }
    if (ch.rev === rev) { ch.dirty = false; ch.status = ''; }
    else flushChamada();
    schedule();
  }
  window.addEventListener('pagehide', () => flushChamada());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushChamada(); });

  // ───────────── Alunos ─────────────
  function filteredAlunos() {
    const q = S.alunosQ.trim().toLowerCase();
    return alunosList().filter((a) =>
      (!q || [a.nome, a.responsavel, a.cpf, a.telefone, a.bairro].some((v) => String(v || '').toLowerCase().includes(q))) &&
      (!S.alunosTurma || (a.turmaIds || []).includes(S.alunosTurma)) &&
      (!S.alunosBairro || (a.bairro || '').trim() === S.alunosBairro) &&
      (!S.alunosFaixa || faixa(a) === S.alunosFaixa) &&
      (!S.alunosIncompletos || missingFields(a).length) &&
      (S.alunosStatus === 'todos' || sit(a) === S.alunosStatus));
  }

  // Lista de todas as pessoas, separada por situação (usada dentro de Inscrições).
  function alunosPanel() {
    const st = freqStats();
    const rows = filteredAlunos();
    const turmas = turmasList();
    const bairros = [...new Set(alunosList().map((a) => (a.bairro || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const turmaNomes = (a) => (a.turmaIds || []).map((id) => get('turmas', id)?.nome).filter(Boolean).join(', ');
    const freqPill = (a) => { const s = st[a.id]; return !isAtivo(a) ? sitPill(a) : s && s.total ? `<span class="pill ${s.rate < 0.75 ? 'red' : 'green'} num" title="Frequência">${pct(s.rate)}</span>` : '<span class="pill">sem aulas</span>'; };
    const opt = (v, l, cur) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${esc(l)}</option>`;

    const body = !rows.length ? `<div class="empty"><h3>${alunosList().length ? 'Nenhum aluno com esses filtros' : 'Nenhum aluno cadastrado'}</h3>${alunosList().length ? '' : `<button class="btn primary" data-act="aluno-new">${icon('plus')}Cadastrar aluno</button>`}</div>`
      : S.alunosModo === 'tabela'
        ? `<div class="card table-wrap"><table class="sheet"><thead><tr><th>Aluno</th><th>Idade</th><th>Gênero</th><th>Cor/raça</th><th>Bairro</th><th>Telefone</th><th>Responsável</th><th>Turmas</th><th>Escolaridade</th><th>Deficiência</th><th>Imagem</th><th>Situação</th><th>Ficha</th><th>Freq.</th></tr></thead><tbody>${rows.map((a) => { const miss = missingFields(a).length; return `<tr data-act="aluno-open" data-id="${a.id}" tabindex="0"><td><div class="row" style="gap:8px">${avatar(a, 28)}<b>${esc(a.nome)}</b></div></td><td class="num">${age(a.nascimento) ?? '—'}</td><td>${esc(a.genero || '—')}</td><td>${esc(a.corRaca || '—')}</td><td>${esc(a.bairro || '—')}</td><td class="num" style="white-space:nowrap">${esc(a.telefone || a.telefoneResp || '—')}</td><td>${esc(a.responsavel || '—')}</td><td>${esc(turmaNomes(a) || '—')}</td><td>${esc(a.escolaridade || '—')}</td><td>${esc(a.deficiencia || '—')}</td><td>${esc(a.autorizaImagem || 'Pendente')}</td><td>${sitPill(a)}</td><td>${miss ? `<span class="pill amber num">faltam ${miss}</span>` : '<span class="pill green">completa</span>'}</td><td>${freqPill(a)}</td></tr>`; }).join('')}</tbody></table></div>`
        : `<div class="card list">${rows.map((a) => { const idade = age(a.nascimento); const miss = missingFields(a).length; return `<button class="item" data-act="aluno-open" data-id="${a.id}">${avatar(a, 46)}<div class="grow"><strong>${esc(a.nome)}</strong><span class="sub">${idade != null ? idade + ' anos · ' : ''}${esc(turmaNomes(a) || 'Sem turma')}${a.bairro ? ' · ' + esc(a.bairro) : ''}</span></div>${miss ? `<span class="pill amber num" title="Campos faltando na ficha">ficha ${miss}</span>` : ''}${freqPill(a)}</button>`; }).join('')}</div>`;

    return `
      <div class="chips" role="tablist" aria-label="Situação">${[...Object.entries(SIT).map(([k, [l]]) => [k, k === 'desistiu' ? 'Desistentes' : k === 'formado' ? 'Formados' : k === 'matriculado' ? 'Matriculados' : l]), ['todos', 'Todos']].map(([k, l]) => `<button class="chip${S.alunosStatus === k ? ' on' : ''}" data-act="alunos-sit" data-v="${k}">${l} <i class="num">${k === 'todos' ? alunosList().length : alunosList().filter((a) => sit(a) === k).length}</i></button>`).join('')}</div>
      <div class="card pad form-grid filters">
        <label class="field full"><span>Buscar</span><input class="input" id="alunos-q" type="search" placeholder="Nome, responsável, CPF, telefone ou bairro" value="${esc(S.alunosQ)}"></label>
        <label class="field"><span>Turma</span><select class="select" id="alunos-turma">${opt('', 'Todas', S.alunosTurma)}${turmas.map((t) => opt(t.id, t.nome, S.alunosTurma)).join('')}</select></label>
        <label class="field"><span>Bairro</span><select class="select" id="alunos-bairro">${opt('', 'Todos', S.alunosBairro)}${bairros.map((b) => opt(b, b, S.alunosBairro)).join('')}</select></label>
        <label class="field"><span>Faixa etária</span><select class="select" id="alunos-faixa">${opt('', 'Todas', S.alunosFaixa)}${[...FAIXAS.map((f) => f[0]), 'Sem data'].map((f) => opt(f, f, S.alunosFaixa)).join('')}</select></label>
      </div>
      <div class="row wrapx">
        <div class="seg" role="tablist" aria-label="Modo de visualização"><button class="${S.alunosModo !== 'tabela' ? 'on' : ''}" data-act="alunos-modo" data-v="lista">Lista</button><button class="${S.alunosModo === 'tabela' ? 'on' : ''}" data-act="alunos-modo" data-v="tabela">Tabela</button></div>
        <label class="check" style="padding:6px 10px"><input type="checkbox" id="alunos-incompletos"${S.alunosIncompletos ? ' checked' : ''}>Só fichas incompletas</label>
        <span class="small muted" style="margin-left:auto;white-space:nowrap">${plural(rows.length, 'resultado', 'resultados')}</span>
      </div>
      ${body}`;
  }

  // ───────────── Turmas ─────────────
  function vTurmas() {
    const st = freqStats(daysAgo(30));
    const turmas = turmasList();
    return header('Cursos', 'Turmas', 'Dias, horários, professores e vagas.', `<button class="btn primary" data-act="turma-new">${icon('plus')}Nova turma</button>`) + notices() + (turmas.length ? `
      <div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))">${turmas.map((t) => {
        const al = alunosDaTurma(t.id); const cap = Number(t.capacidade) || 0;
        let pres = 0, tot = 0; for (const a of al) { const s = st[a.id]; if (s) { pres += s.pres + s.just; tot += s.total; } }
        return `<button class="card pad stack" style="text-align:left;border-top:4px solid ${esc(t.cor || '#1c2d6b')}" data-act="turma-open" data-id="${t.id}">
          <h3 style="font-size:19px">${esc(t.nome)}</h3>
          <div class="small muted">${(t.dias || []).map((d) => DIAS[d]).join(', ') || 'Sem dias'} · ${esc(horarioTxt(t) || '--:--')}${t.professor ? ' · ' + esc(t.professor) : ''}</div>
          <div class="row small"><span class="grow">Alunos</span><b class="num">${al.length}${cap ? ' / ' + cap : ''}</b></div>
          <div class="row" style="gap:0">${al.slice(0, 8).map((x) => `<span style="margin-right:-6px;border:2px solid var(--surface);border-radius:50%">${avatar(x, 28)}</span>`).join('')}${al.length > 8 ? `<span class="small muted" style="margin-left:12px">+${al.length - 8}</span>` : ''}${al.length ? '' : '<span class="small muted">Nenhum aluno ainda</span>'}</div>
          <div class="meter${cap && al.length >= cap ? ' gold' : ''}"><i style="width:${cap ? Math.min(100, Math.round((al.length / cap) * 100)) : 0}%"></i></div>
          <div class="row small"><span class="grow">Frequência (30 dias)</span><b class="num" style="color:${tot && pres / tot < 0.75 ? 'var(--red)' : 'inherit'}">${tot ? pct(pres / tot) : '—'}</b></div>
        </button>`;
      }).join('')}</div>` : `<div class="empty"><h3>Nenhuma turma</h3><button class="btn primary" data-act="turma-new">${icon('plus')}Criar turma</button></div>`);
  }

  // ───────────── Inscrições (porta de entrada do cadastro) ─────────────
  // Inscrição e aluno são o mesmo registro: a aba reúne o formulário e todas as pessoas por situação.
  function vInscricoes() {
    const total = alunosList().length;
    return header('Banco de dados', 'Inscrições', `${plural(total, 'pessoa inscrita', 'pessoas inscritas')} · ${plural(alunosList().filter(isAtivo).length, 'matriculada', 'matriculadas')}`, `<button class="btn" data-act="csv-alunos">${icon('down')}Planilha completa</button><button class="btn primary" data-act="aluno-new">${icon('plus')}Nova inscrição</button>`) + notices() + (total ? '' : `
      <div class="empty card"><h3>Nenhuma inscrição ainda</h3><p>Toque em "Nova inscrição" e preencha a ficha da pessoa. Só o nome é obrigatório; o resto pode ser completado depois.</p><button class="btn primary" data-act="aluno-new">${icon('plus')}Nova inscrição</button></div>`) + `
      ${pedidosSec()}
      <div class="section-title" style="margin:6px 0 -6px"><h2>Todas as inscrições</h2><span>separadas por situação</span></div>
      ${alunosPanel()}`;
  }


  // ───────────── Portal do Aluno (o que a equipe publica e avalia) ─────────────
  const semId = (o) => { if (!o) return {}; const { id, ...r } = o; return r; };
  const pendentes = (col) => list(col).filter((x) => x.status === 'pendente');
  const nomeAluno = (id) => get('alunos', id)?.nome || 'Aluno removido';
  const turmaNome = (id) => get('turmas', id)?.nome || '—';
  const turmaOptions = (sel, todas) => (todas ? `<option value="">${todas}</option>` : '') + turmasList().map((t) => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>${esc(t.nome)}</option>`).join('');
  const STJ = { pendente: ['Em análise', 'amber'], aceita: ['Aceita', 'green'], recusada: ['Não aceita', 'red'], aprovado: ['Matriculado', 'green'], recusado: ['Recusado', 'red'] };
  const stPill = (s) => `<span class="pill ${STJ[s]?.[1] || ''}">${STJ[s]?.[0] || esc(s)}</span>`;
  const delFoot = (col, id, saveAct) => `${id ? confirmBtn('del-portal', 'Excluir', 'Confirmar exclusão', 'btn ghost') : ''}<span class="grow"></span><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="${saveAct}" data-id="${id || ''}">${id ? 'Salvar' : 'Publicar'}</button>`;

  function justRow(j) {
    return `<button class="item" data-act="just-open" data-id="${j.id}">${avatar(get('alunos', j.alunoId), 36)}<div class="grow"><strong>${esc(nomeAluno(j.alunoId))}</strong><span class="sub">${esc(turmaNome(j.turmaId))} · falta em ${fmtWeekday(j.data)}</span></div>${stPill(j.status)}</button>`;
  }
  function justCard() {
    const p = pendentes('justificativas');
    if (!p.length) return '';
    return `<div><div class="section-title"><h2>Justificativas para avaliar</h2><span>${plural(p.length, 'pendente', 'pendentes')}</span></div>
      <div class="card list">${p.map(justRow).join('')}</div></div>`;
  }

  function pedidosSec() {
    const p = pendentes('pedidos').sort((a, b) => String(a.enviadoEm).localeCompare(String(b.enviadoEm)));
    if (!p.length) return '';
    return `<section><div class="section-title"><h2>Pedidos pelo Portal do Aluno</h2><span>${plural(p.length, 'aguardando aprovação', 'aguardando aprovação')}</span></div>
      <div class="card list">${p.map((x) => `<button class="item" data-act="ped-open" data-id="${x.id}">${avatar(get('alunos', x.alunoId) || { nome: x.nome }, 36)}<div class="grow"><strong>${esc(nomePedido(x))}</strong><span class="sub">Quer entrar em <b>${esc(cursoPedido(x))}</b>${x.alunoId ? '' : ' · pessoa nova'}</span><span class="sub num" style="display:block;color:var(--green);font-weight:700">WhatsApp ${esc(x.telefone || '—')}</span></div><span class="pill amber">Avaliar</span></button>`).join('')}</div></section>`;
  }

  function vPortal() {
    const subs = [['avisos', 'Avisos'], ['mural', 'Mural'], ['oportunidades', 'Oportunidades'], ['cursos', 'Cursos abertos'], ['justificativas', 'Justificativas']];
    const nj = pendentes('justificativas').length;
    const acao = { avisos: `<button class="btn primary" data-act="aviso-new">${icon('plus')}Novo aviso</button>`, mural: `<button class="btn primary" data-act="mural-new">${icon('plus')}Nova publicação</button>`, oportunidades: `<button class="btn primary" data-act="op-new">${icon('plus')}Nova oportunidade</button>` }[S.portalSub] || '';
    const sub = { avisos: pAvisos, mural: pMural, oportunidades: pOport, cursos: pCursos, justificativas: pJust }[S.portalSub] || pAvisos;
    return header('Portal do Aluno', 'Portal', 'O que os alunos veem no portal deles: avisos, mural, oportunidades e cursos com inscrição aberta.', acao) + notices() + `
      <div class="ptabs" role="tablist" aria-label="Seções do portal">${subs.map(([k, l]) => `<button class="chip${S.portalSub === k ? ' on' : ''}" role="tab" aria-selected="${S.portalSub === k}" data-act="p-sub" data-v="${k}">${l}${k === 'justificativas' && nj ? ` <i class="num">${nj}</i>` : ''}</button>`).join('')}</div>
      ${sub()}`;
  }

  function pAvisos() {
    const l = list('avisos').sort((a, b) => String(b.ate).localeCompare(String(a.ate)));
    const hoje = today();
    if (!l.length) return `<div class="empty card"><h3>Nenhum aviso</h3><p>Os avisos aparecem na tela inicial do portal e somem sozinhos na data escolhida.</p><button class="btn primary" data-act="aviso-new">${icon('plus')}Novo aviso</button></div>`;
    return `<p class="small muted">Aparecem na tela inicial do aluno até a data escolhida. Depois somem sozinhos.</p>
      <div class="card list">${l.map((a) => { const on = a.ate >= hoje; return `<button class="item${on ? '' : ' off'}" data-act="aviso-open" data-id="${a.id}"><div class="grow"><strong>${esc(a.titulo)}</strong><span class="sub">${a.turmaId ? esc(turmaNome(a.turmaId)) : 'Todos os alunos'} · ${on ? 'até ' + fmtDate(a.ate) : 'venceu em ' + fmtDate(a.ate)}</span></div>${a.importante ? '<span class="pill red">Importante</span>' : ''}<span class="pill ${on ? 'green' : ''}">${on ? 'No ar' : 'Vencido'}</span></button>`; }).join('')}</div>`;
  }
  function pMural() {
    const l = list('mural').sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
    if (!l.length) return `<div class="empty card"><h3>Mural vazio</h3><p>Publique fotos e novidades do instituto.</p><button class="btn primary" data-act="mural-new">${icon('plus')}Nova publicação</button></div>`;
    return `<p class="small muted">Fotos e novidades que aparecem na aba Mural do portal. Antes de postar foto de aluno, confira se a ficha autoriza uso de imagem.</p>
      <div class="card list">${l.map((m) => `<button class="item" data-act="mural-open" data-id="${m.id}">${m.foto ? `<img class="mural-thumb" src="${esc(m.foto)}" alt="">` : `<span class="mural-thumb" style="display:grid;place-items:center;color:var(--faint)">${icon('cam')}</span>`}<div class="grow"><strong>${esc(m.titulo)}</strong><span class="sub">Publicado em ${fmtDate((m.criadoEm || '').slice(0, 10))}</span></div></button>`).join('')}</div>`;
  }
  function pOport() {
    const l = list('oportunidades').sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)));
    const hoje = today();
    if (!l.length) return `<div class="empty card"><h3>Nenhuma oportunidade</h3><p>Vagas, cursos e editais de fora do instituto, com o link da inscrição.</p><button class="btn primary" data-act="op-new">${icon('plus')}Nova oportunidade</button></div>`;
    return `<p class="small muted">Vagas, cursos e editais de fora do instituto. O aluno toca e vai direto para a inscrição no site de quem oferece. Somem depois do prazo.</p>
      <div class="card list">${l.map((o) => { const on = o.prazo >= hoje; return `<button class="item${on ? '' : ' off'}" data-act="op-open" data-id="${o.id}"><div class="grow"><strong>${esc(o.titulo)}</strong><span class="sub">${esc(o.tipo)} · ${on ? 'até ' + fmtDate(o.prazo) : 'encerrada'} · ${esc(hostDe(o.link))}</span></div></button>`; }).join('')}</div>`;
  }
  function pCursos() {
    const ts = turmasList();
    if (!ts.length) return `<div class="empty card"><h3>Nenhuma turma</h3><p>Crie turmas na aba Turmas para abrir inscrições no portal.</p></div>`;
    return `<p class="small muted">Turmas que aparecem em "Cursos do Íris" no portal, com o botão de inscrição. Os pedidos chegam em Inscrições para aprovar.</p>
      <div class="card list">${ts.map((t) => { const n = alunosDaTurma(t.id).length; const cap = Number(t.capacidade) || 0; const livres = cap ? Math.max(0, cap - n) : null; return `<button class="item" data-act="curso-open" data-id="${t.id}"><span class="dotc" style="background:${esc(t.cor || '#1c2d6b')}"></span><div class="grow"><strong>${esc(t.nome)}</strong><span class="sub">${livres == null ? 'Vagas não definidas' : livres ? plural(livres, 'vaga livre', 'vagas livres') : 'Sem vagas: entra na lista de espera'}</span></div><span class="pill ${t.portalAberto ? 'green' : ''}">${t.portalAberto ? 'Inscrições abertas' : 'Fechado'}</span></button>`; }).join('')}</div>`;
  }
  function pJust() {
    const l = list('justificativas').sort((a, b) => Number(b.status === 'pendente') - Number(a.status === 'pendente') || String(b.enviadoEm).localeCompare(String(a.enviadoEm)));
    if (!l.length) return '<div class="empty card"><h3>Nenhuma justificativa</h3><p>Quando um aluno justificar uma falta pelo portal, ela aparece aqui.</p></div>';
    return `<p class="small muted">A falta só passa a contar como justificada depois que alguém da equipe aceita. Até lá, continua como falta.</p>
      <div class="card list">${l.map(justRow).join('')}</div>`;
  }
  function hostDe(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u || 'sem link'; } }

  // Janelas de edição
  function avisoModal(id) {
    const a = id ? get('avisos', id) : { titulo: '', texto: '', turmaId: '', ate: addDays(today(), 7), importante: false };
    openModal(id ? 'Editar aviso' : 'Novo aviso', `<div class="form-grid">
      <label class="field full"><span>Título</span><input class="input" id="a-tit" maxlength="90" value="${esc(a.titulo)}" placeholder="Ex.: Sem aula na sexta-feira"></label>
      <label class="field full"><span>Mensagem</span><textarea class="textarea" id="a-txt">${esc(a.texto)}</textarea></label>
      <label class="field"><span>Para quem</span><select class="select" id="a-turma">${turmaOptions(a.turmaId, 'Todos os alunos')}</select></label>
      <label class="field"><span>Mostrar até</span><input class="input" type="date" id="a-ate" value="${esc(a.ate)}"></label>
      <label class="check full"><input type="checkbox" id="a-imp"${a.importante ? ' checked' : ''}><span>Importante: aparece em vermelho e no topo</span></label>
    </div>`, delFoot('avisos', id, 'aviso-save'));
    $('#modal-root .modal').dataset.ctx = JSON.stringify({ col: 'avisos', id });
  }
  async function saveAviso(id) {
    const body = { titulo: val('a-tit'), texto: val('a-txt'), turmaId: val('a-turma'), ate: val('a-ate'), importante: document.getElementById('a-imp').checked };
    if (!body.titulo || !body.ate) return toast('Preencha o título e a data em que o aviso some.');
    const prev = id ? get('avisos', id) : null;
    if (await guard(() => put('avisos', id || uid(), { ...semId(prev), ...body, criadoEm: prev?.criadoEm || new Date().toISOString() }), id ? 'Aviso atualizado.' : 'Aviso publicado no portal.')) closeModal();
  }

  let fotoMural = null;
  function muralModal(id) {
    const m = id ? get('mural', id) : { titulo: '', texto: '', foto: '' };
    fotoMural = m.foto || '';
    openModal(id ? 'Editar publicação' : 'Nova publicação no mural', `<div class="form-grid">
      <label class="field full"><span>Foto</span><input class="input" type="file" id="m-foto" accept="image/*"><img class="foto-prev" id="m-prev" alt=""${m.foto ? ` src="${esc(m.foto)}"` : ' hidden'}></label>
      <label class="field full"><span>Título</span><input class="input" id="m-tit" maxlength="90" value="${esc(m.titulo)}"></label>
      <label class="field full"><span>Texto</span><textarea class="textarea" id="m-txt">${esc(m.texto)}</textarea></label>
    </div>`, delFoot('mural', id, 'mural-save'));
    $('#modal-root .modal').dataset.ctx = JSON.stringify({ col: 'mural', id });
  }
  function lerFotoMural(file) {
    if (!file) return;
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      fotoMural = c.toDataURL('image/jpeg', 0.8); URL.revokeObjectURL(url);
      const p = document.getElementById('m-prev'); if (p) { p.src = fotoMural; p.hidden = false; }
    };
    img.src = url;
  }
  async function saveMural(id) {
    const body = { titulo: val('m-tit'), texto: val('m-txt'), foto: fotoMural || '' };
    if (!body.titulo) return toast('Escreva um título.');
    const prev = id ? get('mural', id) : null;
    if (await guard(() => put('mural', id || uid(), { ...semId(prev), ...body, criadoEm: prev?.criadoEm || new Date().toISOString() }), id ? 'Publicação atualizada.' : 'Publicado no mural.')) closeModal();
  }

  function opModal(id) {
    const o = id ? get('oportunidades', id) : { tipo: 'Emprego', titulo: '', texto: '', quem: '', prazo: addDays(today(), 14), link: '' };
    openModal(id ? 'Editar oportunidade' : 'Nova oportunidade', `<div class="form-grid">
      <label class="field"><span>Tipo</span><select class="select" id="o-tipo">${['Emprego', 'Estágio', 'Curso', 'Edital'].map((x) => `<option${o.tipo === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="field"><span>Inscrições até</span><input class="input" type="date" id="o-prazo" value="${esc(o.prazo)}"></label>
      <label class="field full"><span>Título</span><input class="input" id="o-tit" maxlength="100" value="${esc(o.titulo)}"></label>
      <label class="field full"><span>Descrição</span><textarea class="textarea" id="o-txt">${esc(o.texto)}</textarea></label>
      <label class="field full"><span>Para quem</span><input class="input" id="o-quem" value="${esc(o.quem)}" placeholder="Ex.: de 16 a 24 anos, ensino médio"></label>
      <label class="field full"><span>Link da inscrição</span><input class="input" type="url" id="o-link" value="${esc(o.link)}" placeholder="https://"></label>
    </div>`, delFoot('oportunidades', id, 'op-save'));
    $('#modal-root .modal').dataset.ctx = JSON.stringify({ col: 'oportunidades', id });
  }
  async function saveOp(id) {
    const body = { tipo: val('o-tipo'), prazo: val('o-prazo'), titulo: val('o-tit'), texto: val('o-txt'), quem: val('o-quem'), link: val('o-link') };
    if (!body.titulo || !body.prazo) return toast('Preencha o título e o prazo.');
    if (!/^https?:\/\/\S+\.\S+/.test(body.link)) return toast('Cole o link da inscrição (começando com https://).');
    const prev = id ? get('oportunidades', id) : null;
    if (await guard(() => put('oportunidades', id || uid(), { ...semId(prev), ...body }), id ? 'Oportunidade atualizada.' : 'Oportunidade publicada.')) closeModal();
  }

  function cursoModal(id) {
    const t = get('turmas', id); if (!t) return;
    openModal(`Portal: ${esc(t.nome)}`, `<div class="form-grid">
      <label class="check full"><input type="checkbox" id="c-aberto"${t.portalAberto ? ' checked' : ''}><span><b>Inscrições abertas no portal</b><br><span class="small muted">O curso aparece em "Cursos do Íris" com o botão de inscrição.</span></span></label>
      <label class="field full"><span>Descrição para os alunos</span><textarea class="textarea" id="c-desc" placeholder="O que se aprende no curso">${esc(t.portalDescricao || '')}</textarea></label>
      <label class="field full"><span>Para quem</span><input class="input" id="c-quem" value="${esc(t.portalQuem || '')}" placeholder="Ex.: a partir de 12 anos"></label>
      <p class="small muted full">Dias, horário e vagas vêm da turma: ${(t.dias || []).map((d) => DIAS[d]).join(', ') || 'sem dias'} · ${esc(horarioTxt(t) || '--:--')} · ${Number(t.capacidade) || 0} vagas.</p>
    </div>`, `<span class="grow"></span><button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="curso-save" data-id="${id}">Salvar</button>`);
  }
  async function saveCurso(id) {
    const body = { portalAberto: document.getElementById('c-aberto').checked, portalDescricao: val('c-desc'), portalQuem: val('c-quem') };
    if (await guard(() => patch('turmas', id, body), body.portalAberto ? 'Inscrições abertas no portal.' : 'Curso fechado no portal.')) closeModal();
  }

  function justModal(id) {
    const j = get('justificativas', id); if (!j) return;
    const a = get('alunos', j.alunoId);
    const pend = j.status === 'pendente';
    openModal('Justificativa de falta', `<div class="row" style="margin-bottom:14px">${avatar(a, 44)}<div class="grow"><b>${esc(nomeAluno(j.alunoId))}</b><div class="small muted">${esc(turmaNome(j.turmaId))} · falta em ${fmtLong(j.data)}</div></div>${stPill(j.status)}</div>
      <div class="quote">${esc(j.motivo)}</div>
      ${j.anexo ? `<p class="small muted" style="margin-top:8px">Anexo: <b>${esc(j.anexo)}</b> (no site, abre a foto ou o PDF enviado)</p>` : '<p class="small muted" style="margin-top:8px">Sem anexo.</p>'}
      ${pend ? `<label class="field" style="margin-top:14px"><span>Resposta para o aluno (opcional)</span><textarea class="textarea" id="j-resp" placeholder="Ex.: traga o atestado original na próxima aula"></textarea></label>
        <p class="small muted" style="margin-top:8px">Ao aceitar, a chamada desse dia muda de <b>Falta</b> para <b>Justificada</b>.</p>` : j.resposta ? `<p class="small" style="margin-top:12px"><b>Resposta enviada:</b> ${esc(j.resposta)}</p>` : ''}`,
      pend ? `<button class="btn" data-act="go-chamada" data-t="${j.turmaId}" data-d="${j.data}">Ver chamada</button><span class="grow"></span><button class="btn danger" data-act="just-dec" data-id="${id}" data-v="recusada">Não aceitar</button><button class="btn primary" data-act="just-dec" data-id="${id}" data-v="aceita">Aceitar</button>`
        : `<button class="btn" data-act="go-chamada" data-t="${j.turmaId}" data-d="${j.data}">Ver chamada</button><span class="grow"></span><button class="btn" data-act="modal-close">Fechar</button>`);
  }
  async function decidirJust(id, status) {
    const j = get('justificativas', id); if (!j) return;
    const resposta = val('j-resp');
    const key = `${j.turmaId}_${j.data}`; const ch = get('chamadas', key);
    const ok = await guard(async () => {
      await patch('justificativas', id, { status, resposta, avaliadoEm: new Date().toISOString(), avaliadoPor: S.me?.email || '' });
      if (status === 'aceita' && ch) await patch('chamadas', key, { registros: { ...(ch.registros || {}), [j.alunoId]: 'J' } });
    }, status === 'aceita' ? 'Aceita: a falta agora conta como justificada.' : 'Justificativa não aceita: a falta continua contando.');
    if (ok) closeModal();
  }

  const cursoDe = (t) => t.curso || t.nome;
  const cursosList = () => [...new Set(turmasList().map(cursoDe))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const turmasDoCurso = (c) => turmasList().filter((t) => cursoDe(t) === c);
  const vagasTxt = (t) => { const cap = Number(t.capacidade) || 0; if (!cap) return 'vagas não definidas'; const l = cap - alunosDaTurma(t.id).length; return l > 0 ? plural(l, 'vaga', 'vagas') : 'lotada'; };

      <div class="card pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--green-soft);border-color:transparent;box-shadow:none">
        <div class="grow"><div class="small" style="color:var(--green);font-weight:700">Telefone / WhatsApp</div><div class="num" style="font-family:var(--display);font-size:22px;font-weight:800;white-space:nowrap">${esc(p.telefone || '—')}</div></div>
        <a class="btn primary" style="background:var(--green);border-color:var(--green);text-decoration:none" href="${esc(waLink(p.telefone))}" target="_blank" rel="noopener">Chamar no WhatsApp</a>

  // ───────────── Finanças ─────────────
  const CAT_IN = ['Doação', 'Patrocínio', 'Edital / projeto', 'Evento / rifa', 'Outros'];
  const CAT_OUT = ['Material didático', 'Lanche', 'Transporte', 'Aluguel / contas', 'Manutenção', 'Outros'];
  function vFinancas() {
    const m = S.finMes;
    const all = list('lancamentos');
    const doMes = all.filter((l) => (l.data || '').startsWith(m)).sort((a, b) => b.data.localeCompare(a.data));
    const sum = (arr, t) => arr.filter((l) => l.tipo === t).reduce((n, l) => n + (Number(l.valor) || 0), 0);
    const ent = sum(doMes, 'entrada'), sai = sum(doMes, 'saida');
    const acum = all.filter((l) => (l.data || '').slice(0, 7) <= m).reduce((n, l) => n + (l.tipo === 'saida' ? -1 : 1) * (Number(l.valor) || 0), 0);
    const meses = Array.from({ length: 6 }, (_, k) => addMonths(m, k - 5));
    const series = meses.map((mm) => { const a = all.filter((l) => (l.data || '').startsWith(mm)); return { mm, e: sum(a, 'entrada'), s: sum(a, 'saida') }; });
    const max = Math.max(1, ...series.flatMap((x) => [x.e, x.s]));
    const cats = {};
    for (const l of doMes) { const k = `${l.tipo}|${l.categoria || 'Outros'}`; cats[k] = (cats[k] || 0) + (Number(l.valor) || 0); }
    const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);

    return header('Dinheiro do instituto', 'Finanças', 'Doações, apoios e despesas das aulas gratuitas.', `<button class="btn" data-act="csv-fin">${icon('down')}Planilha</button><button class="btn primary" data-act="lanc-new">${icon('plus')}Novo lançamento</button>`) + notices() + `
      <div class="row"><button class="icon-btn" data-act="fin-prev" aria-label="Mês anterior">${icon('left')}</button><h2 style="font-size:20px;min-width:110px;text-align:center">${monthLabel(m)}</h2><button class="icon-btn" data-act="fin-next" aria-label="Próximo mês">${icon('right')}</button></div>
      <div class="kpis">
        <div class="card kpi"><span>Entradas</span><b style="font-size:24px;color:var(--green)">${money(ent)}</b><small>${doMes.filter((l) => l.tipo === 'entrada').length} lançamentos</small></div>
        <div class="card kpi"><span>Saídas</span><b style="font-size:24px;color:var(--red)">${money(sai)}</b><small>${doMes.filter((l) => l.tipo === 'saida').length} lançamentos</small></div>
        <div class="card kpi"><span>Saldo do mês</span><b style="font-size:24px">${money(ent - sai)}</b><small>entradas − saídas</small></div>
        <div class="card kpi hl"><span>Caixa acumulado</span><b style="font-size:24px">${money(acum)}</b><small>até ${monthLabel(m)}</small></div>
      </div>
      <div class="grid2">
        <section class="card pad">
          <div class="section-title"><h2>Últimos 6 meses</h2><div class="legend"><span><i style="background:var(--green)"></i>Entradas</span><span><i style="background:var(--red)"></i>Saídas</span></div></div>
          <div class="bars">${series.map((x) => `<div class="bar-col" title="${monthLabel(x.mm)}: entradas ${money(x.e)}, saídas ${money(x.s)}"><div class="bar-pair"><i class="in" style="height:${(x.e / max) * 100}%"></i><i class="out" style="height:${(x.s / max) * 100}%"></i></div><small${x.mm === m ? ' style="color:var(--ink);font-weight:700"' : ''}>${MESES[Number(x.mm.slice(5)) - 1]}</small></div>`).join('')}</div>
        </section>
        <section class="card pad">
          <div class="section-title"><h2>Por categoria</h2><span>${monthLabel(m)}</span></div>
          ${catRows.length ? `<div class="stack">${catRows.map(([k, v]) => { const [t, c] = k.split('|'); return `<div class="row small"><span class="dotc" style="background:var(--${t === 'saida' ? 'red' : 'green'})"></span><span class="grow">${esc(c)}</span><b class="num">${money(v)}</b></div>`; }).join('')}</div>` : '<p class="small muted">Sem lançamentos neste mês.</p>'}
        </section>
      </div>
      <section><div class="section-title"><h2>Lançamentos de ${monthLabel(m)}</h2></div>
        ${doMes.length ? `<div class="card table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th></th></tr></thead><tbody>${doMes.map((l) => `<tr><td class="num">${fmtDate(l.data)}</td><td>${esc(l.descricao)}</td><td class="muted">${esc(l.categoria || '')}</td><td class="r num" style="font-weight:700;color:var(--${l.tipo === 'saida' ? 'red' : 'green'})">${l.tipo === 'saida' ? '−' : '+'} ${money(l.valor)}</td><td class="r"><button class="btn sm ghost" data-act="lanc-open" data-id="${l.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Nenhum lançamento neste mês.</div>`}
      </section>`;
  }

  // ───────────── Modais ─────────────
  function openModal(title, body, foot, onMount) {

    if (first && window.matchMedia('(min-width: 640px)').matches) first.focus();
  }
  const closeModal = () => { $('#modal-root').innerHTML = ''; S.confirm = null; };
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  const turmaCheck = (t, on) => `<label class="check"><input type="checkbox" name="f-turma" value="${t.id}"${on ? ' checked' : ''}><span class="dotc" style="background:${esc(t.cor || '#1c2d6b')}"></span>${esc(t.nome)}</label>`;
  const CORES = ['#1c2d6b', '#d99a12', '#17885a', '#c8403a', '#7a4fc4', '#1d8bb5'];

  async function quickTurma() {
    const nome = val('f-nova-turma');
    if (!nome) return toast('Escreva o nome da turma.');
    const id = uid();
    const body = { nome, dias: [], horario: '', capacidade: 0, professor: '', cor: CORES[turmasList().length % CORES.length], criadoEm: new Date().toISOString() };

      document.getElementById('f-turmas-vazio')?.remove();

      document.getElementById('f-nova-turma').value = '';
