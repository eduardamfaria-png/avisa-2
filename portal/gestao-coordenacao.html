  function fieldHtml([key, label, type, opts, full], a) {
    const id = 'f-' + key; const v = a[key] ?? '';
    const wrap = (inner) => `<label class="field${full ? ' full' : ''}"><span>${esc(label)}</span>${inner}</label>`;
    if (type === 'turmas') {
      const ts = turmasList();
      return `<div class="field full"><span>${esc(label)}</span><div class="form-grid" id="f-turmas-box">${ts.map((t) => turmaCheck(t, (a.turmaIds || []).includes(t.id))).join('') || '<span class="small muted" id="f-turmas-vazio">Nenhuma turma criada ainda. Crie abaixo.</span>'}</div>
        <div class="row" style="margin-top:8px"><input class="input grow" id="f-nova-turma" placeholder="Nome de uma nova turma" autocomplete="off"><button type="button" class="btn" data-act="turma-quick">${icon('plus')}Criar turma</button></div></div>`;
    }
    if (type === 'select') {
      const options = opts.map((o) => { const [val, lab] = o.includes(':') ? o.split(':') : [o, o]; return `<option value="${esc(val)}"${String(v) === val ? ' selected' : ''}>${esc(lab)}</option>`; });
      const hasDefault = key === 'status' || key === 'autorizaImagem' || key === 'termoAssinado';
      return wrap(`<select class="select" id="${id}">${hasDefault ? '' : `<option value=""${v ? '' : ' selected'}>Não informado</option>`}${options.join('')}</select>`);
    }
    if (type === 'textarea') return wrap(`<textarea class="textarea" id="${id}">${esc(v)}</textarea>`);
    if (type === 'consent') return `<label class="check full consent"><input type="checkbox" id="${id}"${v === 'Sim' ? ' checked' : ''}><span>${esc(label)}</span></label>`;
    if (type === 'cep') return wrap(`<input class="input" id="${id}" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" value="${esc(v)}" autocomplete="postal-code"><small class="hint" id="cep-msg"></small>`);
    const extra = type === 'tel' ? ' inputmode="tel"' : type === 'number' ? ' inputmode="numeric" min="0"' : '';
    return wrap(`<input class="input" id="${id}" type="${type === 'tel' ? 'text' : type}" value="${esc(v)}"${extra} autocomplete="off">`);
  }

  function alunoModal(id, presetTurma, pre) {
    if (id && !get('alunos', id)) return;
    const a = id ? { ...get('alunos', id), status: sit(get('alunos', id)) } : { nome: '', turmaIds: presetTurma ? [presetTurma] : [], status: 'matriculado', matriculaEm: today(), autorizaImagem: 'Pendente', termoAssinado: 'Pendente' };
    if (pre) Object.assign(a, pre.campos);
    const s = id ? freqStats()[id] : null;
    const miss = id ? missingFields(a) : [];
    const photo = id ? `<div class="photo-edit">${avatar(a, 84)}<div class="stack" style="gap:6px">${S.canUpload ? `<label class="btn sm">${icon('cam')}${a.fotoId ? 'Trocar foto' : 'Adicionar foto'}<input type="file" accept="image/*" class="hide" data-photo="${id}"></label>` : `<span class="small muted">Para enviar fotos é preciso acesso de Editor.</span>`}
        ${s && s.total ? `<span class="small muted num">Frequência ${pct(s.rate)} · ${plural(s.pres, 'presença', 'presenças')}, ${plural(s.faltas, 'falta', 'faltas')}, ${plural(s.just, 'justificada', 'justificadas')}</span>` : ''}
        ${miss.length ? `<span class="pill amber" style="align-self:flex-start">Ficha incompleta: falta ${miss.slice(0, 3).map(fieldLabel).join(', ')}${miss.length > 3 ? '…' : ''}</span>` : '<span class="pill green" style="align-self:flex-start">Ficha completa</span>'}</div></div>`
      : `<p class="small muted" style="margin-bottom:12px">Só o nome é obrigatório. Preencha o que tiver agora e complete depois. A foto entra depois de salvar. Dica: digite o CEP para preencher o endereço.</p>`;

    openModal(pre ? 'Matrícula: ficha do aluno' : id ? esc(a.nome) : 'Nova inscrição', `${pre ? pre.banner : ''}${photo}${nav}
      ${FICHA.map(([sec, fields], i) => `<fieldset class="ficha-sec" id="ficha-${i}"><legend>${esc(sec)}</legend><div class="form-grid">${fields.map((f) => fieldHtml(f, a)).join('')}</div></fieldset>`).join('')}`,

    $('#modal-root .modal').dataset.ctx = JSON.stringify({ type: 'aluno', id, pedidoId: pre ? pre.pedidoId : '' });
    $('#modal-root .modal').classList.add('wide');
  }

  // Busca o endereço pelo CEP (ViaCEP). Dentro do link do Claude o acesso a outros sites é bloqueado.
  let cepSeq = 0;
  async function buscarCep(raw) {
    const cep = raw.replace(/\D/g, '');
    const msg = document.getElementById('cep-msg');
    if (cep.length !== 8) { if (msg) msg.textContent = ''; return; }
    const seq = ++cepSeq;
    if (msg) msg.textContent = 'Buscando endereço…';
    try {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`, { signal: ctrl.signal });
      clearTimeout(t);
      const d = await r.json();
      if (seq !== cepSeq) return;
      if (d.erro) { if (msg) msg.textContent = 'CEP não encontrado. Confira os números ou preencha à mão.'; return; }
      const set = (k, v) => { const el = document.getElementById('f-' + k); if (el && v) el.value = v; };
      set('endereco', d.logradouro); set('bairro', d.bairro); set('cidade', d.localidade); set('uf', d.uf);
      if (d.complemento && !val('f-complemento')) set('complemento', d.complemento);
      if (msg) msg.textContent = 'Endereço preenchido. Complete o número.';
      document.getElementById('f-numero')?.focus();
    } catch {
      if (seq !== cepSeq) return;
      if (msg) msg.textContent = 'Não foi possível buscar o CEP aqui. Preencha o endereço à mão.';
    }
  }

  async function saveAluno(id) {
    const nome = val('f-nome');
    if (!nome) return toast('Informe o nome do aluno.');
    const body = { ...(id ? S.data.alunos[id] : { criadoEm: new Date().toISOString() }) };
    for (const [key, , type] of FICHA_FIELDS) body[key] = type === 'consent' ? (document.getElementById('f-' + key)?.checked ? 'Sim' : 'Não') : type === 'number' ? (val('f-' + key) === '' ? '' : Number(val('f-' + key))) : val('f-' + key);
    body.turmaIds = [...document.querySelectorAll('input[name="f-turma"]:checked')].map((x) => x.value);
    body.status = body.status || 'matriculado';
    body.atualizadoEm = new Date().toISOString();
    const newId = id || uid();
    const pedidoId = JSON.parse($('#modal-root .modal')?.dataset.ctx || '{}').pedidoId;
    if (pedidoId) {
      const turmaFinal = body.turmaIds.find((t) => t === get('pedidos', pedidoId)?.turmaEscolhida) || body.turmaIds[0] || '';
      if (await guard(async () => { await put('alunos', newId, body); await patch('pedidos', pedidoId, { status: 'aprovado', alunoId: newId, turmaFinal, avaliadoEm: new Date().toISOString() }); }, `Matrícula concluída: ${nome.split(' ')[0]} está em ${turmaNome(turmaFinal)}.`)) closeModal();
      return;
    }
    if (await guard(() => put('alunos', newId, body), id ? 'Ficha atualizada.' : 'Inscrição salva. Se quiser, adicione a foto.')) { closeModal(); if (!id) alunoModal(newId); }
  }

      <label class="field"><span>Término da aula</span><input class="input" type="time" id="t-hora-fim" value="${esc(t.horarioFim || '')}"></label>

      <div class="field full"><span>Cor</span><div class="chips">${CORES.map((c) => `<label class="check" style="padding:6px 10px"><input type="radio" name="t-cor" value="${c}"${(t.cor || '#1c2d6b') === c ? ' checked' : ''}><span class="dotc" style="background:${c};width:16px;height:16px"></span></label>`).join('')}</div></div>

  async function uploadPhoto(id, file) {
    if (!file) return;
    if (S.platform === 'firebase') {
      toast('Salvando foto…');
      try {
        const blob = await resizeImage(file, 320);
        const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
        if (await guard(() => put('fotos', id, { data, atualizadoEm: new Date().toISOString() }), 'Foto salva.')) { if ($('#modal-root .modal')) alunoModal(id); }
      } catch { toast('Não foi possível salvar a foto.'); }
      return;
    }
    if (!assets) return;
    toast('Enviando foto…');
    try {
      const blob = await resizeImage(file, 480);
      const res = await assets.upload(blob);
      const old = S.data.alunos[id]?.fotoId;
      if (await guard(() => patch('alunos', id, { fotoId: res.id }), 'Foto salva.')) {
        if (old) assets.delete(old).catch(() => {});
        if ($('#modal-root .modal')) alunoModal(id);
      }
    } catch (e) { toast(e && e.code === 'not_granted' ? 'Sem permissão para enviar fotos.' : 'Não foi possível enviar a foto.'); }
  }

  function resizeImage(file, max) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('blob'))), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

  // CSV (planilha) — separado por ponto e vírgula, com BOM, abre direto no Excel / Google Planilhas.
  function csv(rows) {
    const cell = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n');
  }
  async function saveFile(filename, data) {
    if (S.demo) return toast('Na versão de teste não dá para baixar planilhas. No sistema oficial, este botão baixa a planilha.');
    if (!downloads) {
      // Fora do Claude: download comum do navegador.
      const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return;
    }
    try { await downloads.save({ filename, data }); } catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('Não foi possível gerar a planilha.'); }
  }

    if (act !== 'confirm' && S.confirm) { S.confirm = null; refreshModalFoot(); schedule(); }
    switch (act) {
      case 'nav': flushChamada(); if (t.dataset.v === 'chamada' && S.view === 'chamada') S.chamada.turmaId = ''; S.view = t.dataset.v; try { localStorage.setItem('iris:view', S.view); } catch {} render(); window.scrollTo?.(0, 0); break;
      case 'go-chamada': closeModal(); openChamada(t.dataset.t, t.dataset.d); break;
      case 'cal-dia': S.calDia = t.dataset.d; if (t.dataset.d.slice(0, 7) !== S.calMes) S.calMes = t.dataset.d.slice(0, 7); render(); break;
      case 'cal-prev': S.calMes = addMonths(S.calMes, -1); render(); break;
      case 'cal-next': S.calMes = addMonths(S.calMes, 1); render(); break;
      case 'alunos-modo': S.alunosModo = t.dataset.v; try { localStorage.setItem('iris:alunosModo', S.alunosModo); } catch {} render(); break;
      case 'alunos-sit': S.alunosStatus = t.dataset.v; render(); break;
      case 'alunos-incompletos': S.alunosIncompletos = true; S.alunosStatus = 'matriculado'; S.view = 'inscricoes'; try { localStorage.setItem('iris:view', S.view); } catch {} render(); window.scrollTo?.(0, 0); break;
      case 'ficha-jump': document.getElementById('ficha-' + t.dataset.i)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'modal-bg': case 'modal-close': closeModal(); break;
      case 'confirm': {
        const key = t.dataset.key;
        if (S.confirm !== key) { S.confirm = key; if ($('#modal-root .modal')) refreshModalFoot(); else render(); return; }
        S.confirm = null;
        const ctx = JSON.parse($('#modal-root .modal')?.dataset.ctx || '{}');
        if (key === 'apagar-exemplos') { await deleteExamples(); return; }
        if (key === 'del-aluno') { if (await guard(async () => { await del('alunos', ctx.id); if (S.platform === 'firebase' && S.data.fotos?.[ctx.id]) await del('fotos', ctx.id); }, 'Cadastro excluído.')) closeModal(); }
        if (key === 'del-turma') { if (await guard(() => del('turmas', ctx.id), 'Turma excluída.')) closeModal(); }
        if (key === 'del-portal') { if (await guard(() => del(ctx.col, ctx.id), 'Removido.')) closeModal(); }
        if (key === 'del-lanc') { if (await guard(() => del('lancamentos', ctx.id), 'Lançamento excluído.')) closeModal(); }
        break;
      }
      case 'seed': seed(); break;
      case 'sair': backend?.signOut(); break;
      case 'equipe': equipeModal(); break;
      case 'equipe-del': setEquipe((S.data.config?.acesso?.emails || []).filter((x) => x !== t.dataset.e)); break;
      case 'login-google': S.login.error = ''; backend?.googleSignIn().catch((err) => { S.login.error = loginErro(err); render(); }); break;
      case 'login-reset': S.login = { email: '', sent: '', busy: false, needEmail: false, error: '' }; render(); break;
      // Chamada
      case 'ch-turma': openChamada(t.dataset.t); break;
      case 'ch-back': flushChamada(); S.chamada.turmaId = ''; render(); window.scrollTo?.(0, 0); break;
      case 'ch-date': flushChamada(); S.chamada.data = t.dataset.d; render(); break;
      case 'ch-set': markChamada(t.dataset.id, t.dataset.v); break;
      case 'ch-all': for (const a of alunosDaTurma(S.chamada.turmaId)) S.chamada.registros[a.id] = 'P'; S.chamada.dirty = true; S.chamada.rev++; S.chamada.status = 'pendente'; clearTimeout(chTimer); chTimer = setTimeout(flushChamada, 300); render(); break;
      // Alunos / turmas / inscrições / finanças
      case 'aluno-new': alunoModal(null, t.dataset.t); break;
      case 'aluno-open': alunoModal(t.dataset.id); break;
      case 'aluno-save': saveAluno(t.dataset.id); break;
      case 'turma-new': turmaModal(null); break;
      case 'turma-open': turmaModal(t.dataset.id); break;
      case 'turma-save': saveTurma(t.dataset.id); break;
      case 'turma-quick': quickTurma(); break;
      case 'lanc-new': lancModal(null); break;
      case 'lanc-open': lancModal(t.dataset.id); break;
      case 'lanc-save': saveLanc(t.dataset.id); break;
      case 'l-tipo': {
        const m = $('#modal-root .modal'); m.dataset.tipo = t.dataset.v;
        m.querySelectorAll('[data-act="l-tipo"]').forEach((b) => b.classList.toggle('on', b === t));
        $('#l-cat').innerHTML = (t.dataset.v === 'saida' ? CAT_OUT : CAT_IN).map((c) => `<option>${c}</option>`).join('');
        break;
      }
      case 'fin-prev': S.finMes = addMonths(S.finMes, -1); render(); break;
      case 'fin-next': S.finMes = addMonths(S.finMes, 1); render(); break;
      case 'csv-alunos': csvAlunos(); break;
      case 'p-sub': S.portalSub = t.dataset.v; render(); break;
      case 'aviso-new': avisoModal(null); break;
      case 'aviso-open': avisoModal(t.dataset.id); break;
      case 'aviso-save': saveAviso(t.dataset.id); break;
      case 'mural-new': muralModal(null); break;
      case 'mural-open': muralModal(t.dataset.id); break;
      case 'mural-save': saveMural(t.dataset.id); break;
      case 'op-new': opModal(null); break;
      case 'op-open': opModal(t.dataset.id); break;
      case 'op-save': saveOp(t.dataset.id); break;
      case 'curso-open': cursoModal(t.dataset.id); break;
      case 'curso-save': saveCurso(t.dataset.id); break;
      case 'just-open': justModal(t.dataset.id); break;
      case 'just-dec': decidirJust(t.dataset.id, t.dataset.v); break;
      case 'ped-open': pedidoModal(t.dataset.id); break;
      case 'ped-dec': decidirPedido(t.dataset.id, t.dataset.v); break;
      case 'ped-ficha': fichaDoPedido(t.dataset.id); break;
      case 'csv-fin': csvFin(); break;
    }
  });

  document.addEventListener('submit', async (e) => {
    const f = e.target.dataset.form; if (!f) return;
    e.preventDefault();
    if (f === 'login') {
      const email = val('login-email').toLowerCase(); S.login.email = email; S.login.error = '';
      if (!email) return;
      S.login.busy = true; render();
      try {
        if (S.login.needEmail) await backend.completeLink(email);
        else if (backend.isAllowedEmail && !(await backend.isAllowedEmail(email))) {
          S.login.error = 'Este e-mail não tem acesso ao sistema. Se você faz parte da equipe, peça à coordenação para liberar seu e-mail.';
        }
        else { await backend.sendLink(email); S.login.sent = email; }
      } catch (err) { S.login.error = loginErro(err); }
      S.login.busy = false; render();
    }
    if (f === 'equipe') { const email = val('equipe-email'); if (email) setEquipe([...(S.data.config?.acesso?.emails || []), email]); }
  });
  function loginErro(err) {
    const c = err && err.code || '';
    if (c.includes('invalid-email')) return 'Este e-mail não parece válido.';
    if (c.includes('popup')) return 'A janela do Google foi fechada antes de terminar.';
    if (c.includes('invalid-action-code') || c.includes('expired')) return 'Este link já foi usado ou expirou. Peça um novo.';
    if (c.includes('quota') || c.includes('too-many')) return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
    if (c.includes('unauthorized-domain') || c.includes('operation-not-allowed')) return 'O login ainda não foi ativado na configuração do sistema.';
    return 'Não foi possível entrar. Tente de novo.';
  }

  document.addEventListener('change', (e) => { if (e.target.id === 'm-foto') lerFotoMural(e.target.files[0]); if (e.target.id === 'p-curso') { const sel = document.getElementById('p-turma'); sel.innerHTML = turmasDoCurso(e.target.value).map((t) => `<option value="${t.id}">${esc(t.nome)} · ${esc(vagasTxt(t))}</option>`).join(''); } });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'f-cep') {
      const d = e.target.value.replace(/\D/g, '').slice(0, 8);
      e.target.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
      buscarCep(d);
    }
    if (e.target.id === 'alunos-q') { S.alunosQ = e.target.value; render(); }
    else if (e.target.id === 'insc-q') { S.inscQ = e.target.value; render(); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'alunos-turma') { S.alunosTurma = el.value; render(); }
    else if (el.id === 'alunos-bairro') { S.alunosBairro = el.value; render(); }
    else if (el.id === 'alunos-faixa') { S.alunosFaixa = el.value; render(); }
    else if (el.id === 'alunos-incompletos') { S.alunosIncompletos = el.checked; render(); }
    else if (el.id === 'ch-data') { flushChamada(); S.chamada.data = el.value || today(); render(); }
    else if (el.dataset.photo) uploadPhoto(el.dataset.photo, el.files && el.files[0]);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modal-root .modal')) closeModal();
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) e.target.click();
  });

  // ───────────── Inicialização ─────────────
  render();

  function subscribeAll(extra, pular = []) {
    const timer = setTimeout(() => { S.slow = true; schedule(); }, 10000);
    for (const col of pular) S.loaded.add(col);
    for (const col of [...COLS, ...extra].filter((c) => !pular.includes(c))) {
      db.collection(col).onSnapshot((snap) => {
        const next = {};
        for (const doc of snap.docs) next[doc.id] = doc.data();
        S.data[col] = next;
        if (!snap.metadata.fromCache && COLS.includes(col)) { S.loaded.add(col); if (S.loaded.size === COLS.length) { clearTimeout(timer); S.slow = false; } }
        schedule();
      }, () => { if (COLS.includes(col)) S.loaded.add(col); schedule(); });
    }
  }

  // Versão publicada fora do Claude (Firebase): login por e-mail e lista da equipe.
  async function bootFirebase() {
    S.platform = 'firebase'; S.gate = 'loading'; render();
    try { backend = await window.irisBackend; }
    catch (err) { S.gate = 'erro'; S.login.error = 'A configuração do sistema não foi encontrada.'; render(); return; }
    downloads = null; db = backend.db; S.canUpload = true;
    try { if (await backend.linkPending()) { S.login.needEmail = !backend.savedEmail(); if (!S.login.needEmail) await backend.completeLink(backend.savedEmail()); } }
    catch (err) { S.login.error = loginErro(err); }
    let subscribed = false;
    backend.onAuth(async (u) => {
      if (!u) { S.me = null; S.gate = 'login'; render(); if (subscribed) location.reload(); return; }
      S.me = { name: u.displayName || u.email, avatarUrl: u.photoURL || '', email: (u.email || '').toLowerCase() };
      S.login = { email: '', sent: '', busy: false, needEmail: false, error: '' };
      S.gate = 'loading'; render();
      const ok = await backend.isMember();
      if (!ok) { S.gate = 'denied'; render(); return; }
      S.gate = ''; S.mode = 'db';
      S.canFinance = backend.canFinance ? await backend.canFinance(S.me.email).catch(() => false) : true;
      if (!subscribed) {
        subscribed = true; subscribeAll(['fotos', 'config'], S.canFinance ? [] : ['lancamentos']);
        // Completa a lista de e-mails liberados (para quem foi liberado antes da checagem prévia existir).
        setTimeout(() => { const em = S.data.config?.acesso?.emails || []; if (em.length && backend.syncPermitidos) backend.syncPermitidos(em, []).catch(() => {}); }, 4000);
      }
      render();
    });
  }

  async function boot() {
    // Versão de teste (para mostrar a quem não tem acesso): só dados de exemplo, nada é salvo.
    if (window.IRIS_DEMO) { S.demo = true; startLocal(); return; }
    if (window.irisBackend) return bootFirebase();
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { startLocal(); return; }
    const [d, u, a, dl] = await Promise.all(['db', 'user', 'assets', 'downloads'].map((n) => c.use(n).catch(() => null)));
    if (u) { try { S.me = await u.me(); } catch {} }
    // Sem banco = pessoa não entrou numa conta com acesso a esta página.
    if (!d) { S.gate = 'signedout'; render(); return; }
    if (u) {
      let w = null;
      try { w = await u.can('data.write'); } catch {}
      // Sem permissão de Colaborador/Editor: os dados ficam fechados para essa conta.
      if (w === false) { S.gate = 'denied'; render(); return; }
    }
    db = d; assets = a; downloads = dl; S.canUpload = !!a; S.mode = 'db'; S.gate = '';
    subscribeAll([]);
    schedule();
  }

  function startLocal() {
    S.mode = 'local';
    S.data = exampleData();
    render();
  }

  boot();
})();
</script>
